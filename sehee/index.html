<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ece6d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세희">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>세희</title>
<style>
  :root{--f-body:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;--f-head:"Noto Serif KR","Batang",serif;
    --paper:#ece6d4; --paper-deep:#e2dabf; --line:#c3b795; --ink:#2b2417; --ink-soft:#5c5340;
    --green:#5f7a55; --red:#a13b2c; --blue:#1B5FC1; --done:#8f8875; --card:#f8f4e8; --fs:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:calc(15px * var(--fs))}
  body{
    margin:0; color:var(--ink);
    background:repeating-linear-gradient(var(--paper) 0,var(--paper) 30px,var(--paper-deep) 30px,var(--paper-deep) 31px);
    font-family:var(--f-body);
    min-height:100vh; padding-bottom:calc(150px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit;color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 12px}

  /* 머리 — 위에 붙어 있다 */
  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);
    padding:calc(6px + env(safe-area-inset-top)) 0 6px}
  .hrow{display:flex;align-items:center;gap:6px}
  .brand{font-family:var(--f-head);font-weight:700;font-size:1.15rem;letter-spacing:.5px;white-space:nowrap;flex:0 0 auto}
  .ver{font-size:.68rem;color:var(--ink-soft);margin-left:2px;white-space:nowrap;flex:0 0 auto}
  .saved{font-size:.72rem;color:var(--green);margin-left:auto;opacity:0;transition:opacity .4s}
  .saved.on{opacity:1}
  .ib{border:1px solid var(--ink-soft);background:transparent;border-radius:3px;min-width:36px;height:34px;
    padding:0 9px;font-size:.88rem;cursor:pointer}
  .ib:disabled{opacity:.3}
  .ib.on{background:var(--ink);color:var(--paper)}
  .gear{margin-left:6px;font-size:1.05rem}
  .nav{margin-top:6px}
  .day{flex:1 1 auto;min-width:0;text-align:center;border:none;background:none;font-family:var(--f-head);
    font-weight:700;font-size:1.08rem;cursor:pointer;padding:4px 2px;white-space:nowrap}
  .day small{font-family:-apple-system,sans-serif;font-weight:400;font-size:.7rem;color:var(--ink-soft);margin-left:4px}
  #pick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

  .band{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0;padding:8px 10px;border-radius:4px;font-size:.82rem;line-height:1.5}
  .band.on{display:flex}
  .band span{flex:1 1 180px}
  .band.old{border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--ink-soft)}
  .band.upd{border:1.5px solid var(--green);background:#e7ecdd;color:#33472d;font-weight:600}
  .band .ib{height:30px;font-size:.8rem;background:var(--paper)}

  /* 세희 */
  .sehee{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
  .fig{flex:0 0 auto;width:64px;text-align:center}
  .fig svg{display:block;margin:0 auto}
  .fig .cap{font-family:var(--f-head);font-size:.62rem;color:var(--ink-soft);margin-top:1px}
  .bubble{position:relative;flex:1 1 auto;min-width:0;background:#fdfcf8;border:1.5px solid #2b3a55;border-radius:16px;
    padding:10px 50px 10px 14px}
  .bubble::before,.bubble::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#2b3a55}
  .bubble::after{left:-6.5px;border-right-color:#fdfcf8}
  .bubble textarea{width:100%;border:none;background:transparent;resize:none;overflow:hidden;font:inherit;font-size:.9rem;
    line-height:1.55;color:#23304a;padding:0;min-height:1.55em}
  .bubble textarea:focus{outline:none}
  .stamp{position:absolute;right:9px;top:50%;transform:translateY(-50%) rotate(-8deg);width:34px;height:34px;border-radius:50%;
    border:1.8px solid var(--red);background:none;color:var(--red);font:600 .7rem ui-monospace,Consolas,monospace;
    letter-spacing:-.5px;padding:0;cursor:pointer}

  /* 받은 것 */
  .inbox{margin:14px 0;border:1.5px dashed var(--ink-soft);border-radius:6px;background:rgba(253,252,248,.75);padding:10px 10px 4px}
  .inbox h3{margin:0 0 6px;font-size:.92rem;display:flex;align-items:baseline;gap:6px}
  .inbox h3 small{font-weight:400;color:var(--ink-soft);font-size:.72rem}
  .ibx{border-top:1px dotted var(--line);padding:8px 0}
  .ibx:first-of-type{border-top:none}
  .ibtx{white-space:pre-wrap;word-break:break-word;font-size:.9rem;line-height:1.55;max-height:9.3em;overflow:hidden;position:relative}
  .ibtx.open{max-height:none}
  .ibmore{border:none;background:none;color:var(--blue);font-size:.75rem;padding:2px 0;cursor:pointer}
  .ibact{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:5px 9px;font-size:.76rem;cursor:pointer}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
  .chip.x{color:var(--red);border-color:transparent;background:none}

  /* 칸 */
  .sec{margin:14px 0;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:3px;
    box-shadow:0 1px 2px rgba(43,36,23,.12)}
  .sh{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .sh b{font-family:var(--f-head);font-size:.98rem;color:var(--c)}
  .sh .cnt{font-size:.75rem;color:var(--ink-soft)}
  .sh .fold{margin-left:auto;font-size:.75rem;color:var(--ink-soft)}
  .sec.folded .list,.sec.folded .add{display:none}
  .it{display:grid;grid-template-columns:34px 1fr 34px;align-items:start;gap:2px;padding:6px 6px 6px 4px;border-bottom:1px dotted var(--line)}
  .ck{width:26px;height:26px;margin:2px 4px 0;border-radius:50%;border:1.6px solid var(--ink-soft);background:#fff;cursor:pointer;padding:0;font-size:.85rem;line-height:1}
  .it.done .ck{background:var(--green);border-color:var(--green);color:#fff}
  .body{min-width:0;padding-top:3px}
  .tx{white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:.95rem;min-height:1.5em;cursor:text}
  .it.done .tx{text-decoration:line-through;color:var(--done)}
  .ed{width:100%;font:inherit;font-size:.95rem;line-height:1.5;border:1px solid var(--ink-soft);border-radius:3px;padding:3px 5px;
    resize:none;overflow:hidden;background:#fff;color:var(--ink)}
  .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .meta:empty{display:none}
  .tag{font-size:.7rem;font-weight:700;color:#fff;background:var(--c);border-radius:3px;padding:1px 6px}
  .age{font-size:.7rem;color:var(--ink-soft)}
  .more{border:none;background:none;font-size:1.1rem;color:var(--ink-soft);cursor:pointer;height:30px;padding:0}
  .add{display:flex;gap:6px;padding:7px 8px 9px}
  .add input{flex:1 1 auto;min-width:0;font:inherit;font-size:.92rem;border:none;border-bottom:1px dashed var(--line);background:transparent;padding:6px 2px}
  .add input:focus{outline:none;border-bottom-color:var(--ink)}
  .add .ib{height:32px;font-size:.8rem}
  .empty{padding:24px 10px;text-align:center;color:var(--ink-soft);font-size:.9rem;line-height:1.7}
  footer{margin:22px 0 0;font-size:.72rem;color:var(--ink-soft);line-height:1.6;text-align:center}

  /* 넘기기 단추 */
  .fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(var(--tb,58px) + 14px);z-index:30;
    border:none;border-radius:28px;background:#23304a;color:#fdfcf8;font-size:.98rem;font-weight:700;padding:14px 20px;
    box-shadow:0 4px 14px rgba(35,48,74,.4);cursor:pointer}

  /* 아래에서 올라오는 판 */
  .veil{position:fixed;inset:0;background:rgba(30,24,14,.38);z-index:40;display:none}
  .veil.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;background:var(--paper);
    border-radius:14px 14px 0 0;border-top:2px solid var(--ink);padding:14px 14px calc(18px + env(safe-area-inset-bottom));
    max-height:86vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
  .sheet.on{transform:none;visibility:visible;transition:transform .2s ease}
  .sheet h4{margin:0 0 10px;font-family:var(--f-head);font-size:1rem}
  .sheet .q{font-size:.85rem;color:var(--ink-soft);line-height:1.5;margin:0 0 10px;white-space:pre-wrap;word-break:break-word;
    max-height:4.6em;overflow:hidden}
  .sheet label.t{display:block;font-size:.75rem;color:var(--ink-soft);margin:12px 0 5px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sheet textarea.big{width:100%;min-height:150px;font:inherit;font-size:.92rem;line-height:1.55;border:1px solid var(--ink-soft);
    border-radius:4px;padding:8px;background:#fff;color:var(--ink);resize:vertical}
  .sheet .go{width:100%;margin-top:10px;height:44px;border:none;border-radius:6px;background:#23304a;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer}
  .sheet .danger{color:var(--red);border-color:var(--red)}
  .sheet .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .free{flex:1 1 120px;min-width:0;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:14px;padding:5px 10px;background:#fff}
  .note{font-size:.75rem;color:var(--ink-soft);line-height:1.6}
  .srow{display:flex;align-items:center;gap:6px;margin:6px 0}
  .srow input{flex:1 1 auto;min-width:0;font:inherit;font-size:.9rem;border:none;border-bottom:1px dashed var(--line);background:transparent;padding:5px 2px}
  .srow input:focus{outline:none;border-bottom-color:var(--ink)}
  .cdot{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;padding:0;flex:0 0 auto}
  .mini{border:1px solid var(--line);background:var(--card);border-radius:3px;width:32px;height:30px;cursor:pointer;font-size:.8rem}
  hr.s{border:none;border-top:1px solid var(--line);margin:14px 0}

  .toast{position:fixed;left:50%;bottom:calc(var(--tb,58px) + 76px);transform:translate(-50%,20px);opacity:0;
    pointer-events:none;z-index:50;background:#2b2417;color:#fdfcf8;border-radius:20px;padding:9px 14px;font-size:.85rem;
    display:flex;gap:12px;align-items:center;transition:all .2s;max-width:92vw}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{border:none;background:none;color:#f3d27a;font-weight:700;font-size:.85rem;padding:0;cursor:pointer}

  /* ── 아래 탭: 판 / 사무실 (v0.2) ── */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--paper);border-top:2px solid var(--ink);
    display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
  .tabs button{flex:1 1 0;max-width:360px;border:none;background:none;padding:7px 0 8px;font-size:.8rem;color:var(--ink-soft);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
  .tabs button .ic{font-size:1.15rem;line-height:1.2}
  .tabs button.on{color:var(--ink);font-weight:700}
  .tabs button.on::before{content:"";position:absolute;top:-2px;left:30%;right:30%;height:3px;background:var(--red)}
  body.alt .nav, body.alt #old, body.alt #main, body.alt .fab{display:none!important}
  body.typing .tabs{display:none}
  /* 옆으로 밀어 판 ↔ 사무실 (v0.6.6) */
  #main, #office{touch-action:pan-y pinch-zoom}
  @keyframes inL{from{transform:translateX(-22%);opacity:.25}to{transform:none;opacity:1}}
  @keyframes inR{from{transform:translateX(22%);opacity:.25}to{transform:none;opacity:1}}
  .slide-inL{animation:inL .22s cubic-bezier(.2,.7,.3,1)}
  .slide-inR{animation:inR .22s cubic-bezier(.2,.7,.3,1)}

  /* ── 세희의 사무실 ── */
  #office{display:none;position:fixed;left:0;right:0;top:var(--hh,64px);bottom:var(--tb,58px);z-index:10;
    flex-direction:column;max-width:720px;margin:0 auto;background:#1d4650 url(art/bg-office.webp) center 30% / cover no-repeat}
  body.office #office{display:flex}
  body.typing #office{bottom:0}
  .log{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px}
  .log > :first-child{margin-top:auto}  /* 말이 적을 때도 세희 바로 위에 쌓이게 */
  .msg{max-width:80%;padding:9px 13px 6px;border-radius:16px;font-size:.95rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;position:relative}
  .msg time{display:block;font-size:.62rem;opacity:.55;margin-top:1px;text-align:right}
  .msg.s{align-self:flex-start;background:#fdfcf8;border:1.5px solid #2b3a55;color:#23304a;margin-left:6px}
  .msg.u{align-self:flex-end;background:#23304a;color:#fdfcf8;border:1.5px solid #23304a;margin-right:6px}
  .msg.u::after{content:"";position:absolute;right:-7px;bottom:10px;border:7px solid transparent;border-left-color:#23304a;border-right:0}
  /* 마지막 세희 말 — 꼬리가 아래 세희 쪽으로 */
  .msg.s.last{margin-bottom:12px;font-size:1rem}
  .msg.s.last::before,.msg.s.last::after{content:"";position:absolute;left:34px;top:100%;border:10px solid transparent;border-top-color:#2b3a55;border-bottom:0}
  .msg.s.last::after{left:36px;border-width:8px;border-top-color:#fdfcf8;margin-top:-1px}
  .msg.s:not(.last)::after{content:"";position:absolute;left:-7px;bottom:10px;border:7px solid transparent;border-right-color:#2b3a55;border-left:0}
  .msg.wait{display:flex;align-items:center;gap:9px;padding:10px 12px}
  .wait i{display:flex;gap:4px}
  .wait i span{width:7px;height:7px;border-radius:50%;background:#2b3a55;opacity:.3;animation:blink 1s infinite}
  .wait i span:nth-child(2){animation-delay:.2s}.wait i span:nth-child(3){animation-delay:.4s}
  .wait small{font-size:.72rem;color:var(--ink-soft)}
  .wait .stop{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:.72rem;padding:3px 9px;cursor:pointer;color:var(--red)}
  .msg.live{opacity:.92}
  .act{align-self:center;max-width:92%;font-size:.74rem;line-height:1.45;color:#33472d;background:rgba(231,236,221,.92);border:1px solid var(--green);
    border-radius:12px;padding:5px 11px;text-align:center}
  .act button{border:none;background:none;color:var(--blue);font-size:.72rem;padding:0 0 0 4px;cursor:pointer}
  .act.read{color:var(--ink-soft);background:rgba(255,255,255,.6);border-color:var(--line)}
  .act.undone{color:var(--done);border-color:var(--line);background:rgba(255,255,255,.5);text-decoration:line-through}
  .due{font-size:.72rem;color:#3a6b64;font-weight:600}
  .due.now{color:var(--red)} .due.past{color:var(--done);font-weight:400}
  .ailog{font:500 .7rem/1.6 ui-monospace,Consolas,monospace;color:var(--ink-soft);background:rgba(255,255,255,.55);border:1px solid var(--line);
    border-radius:4px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;max-height:12em;overflow:auto;margin:6px 0}
  @keyframes blink{50%{opacity:1}}
  /* 사무실 무대 — 세희(상반신) 뒤에 책상, 책상 위에 서류와 모니터 (v0.6.4) */
  .stage{--sh:min(310px,42dvh);flex:0 0 auto;position:relative;height:var(--sh);overflow:hidden;transition:height .2s}
  body.typing .stage{--sh:min(150px,22dvh)}
  .spr{position:absolute;left:50%;top:calc(var(--sh) * .03);height:calc(var(--sh) * .70);transform:translateX(-50%);
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));pointer-events:none}
  .desk{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sh) * .30);background:#5a4330 url(art/desk.webp) center top / 100% auto no-repeat;
    box-shadow:0 -2px 8px rgba(0,0,0,.25)}
  .plate{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#2b2417;color:#f3d27a;font:600 .68rem var(--f-head);
    padding:2px 10px;border-radius:2px;white-space:nowrap}
  body.typing .plate{display:none}
  .prop{position:absolute;bottom:calc(var(--sh) * .30 - 9px);pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .prop.papers{left:3%;width:min(26%,calc(var(--sh) * .42))}
  .prop.monitor{right:2%;width:min(30%,calc(var(--sh) * .48))}
  .scene{flex:0 0 auto;height:min(200px,30dvh);line-height:0;transition:height .2s}
  .scene{overflow:hidden}
  .scene svg{width:100%;height:100%;display:block;overflow:visible}
  body.typing .scene{height:min(110px,18dvh)}
  #seheeFace{transition:opacity .15s}
  .say{flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:flex-end;gap:7px}
  #office.drop{outline:3px dashed #f3d27a;outline-offset:-6px}
  /* ── v0.9 화면들: 달력 · 화이트보드 · 사람 ── */
  /* 컴퓨터·넓은 화면에서도 갤럭시 노트20 화면 비율(9:20) 그대로 — 가운데 폰 크기 틀 안에서 돈다 (v0.9.2)
     transform 을 주면 position:fixed 인 것들(머리·탭·사무실·시트·로딩)이 창이 아니라 이 틀에 붙는다 */
  @media (min-aspect-ratio: 10/19) and (hover: hover) and (pointer: fine){
    html{background:#2b2a27;height:100%}
    body{width:min(100vw, calc(100dvh * 9 / 20));height:100dvh;margin:0 auto;overflow-y:auto;overflow-x:hidden;transform:translateZ(0);
      box-shadow:0 0 0 1px #111,0 12px 50px rgba(0,0,0,.6);scrollbar-width:thin}
  }
  /* 보고서 문서 (v1.1) — A4 비율 쪽, 넘치면 아래로 다음 쪽 */
  .rv{position:fixed;inset:0;z-index:230;background:#5b564d;display:none;flex-direction:column}
  .rv.on{display:flex;animation:rvIn .28s cubic-bezier(.2,.8,.3,1)}
  @keyframes rvIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .rv-bar{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:8px 8px;background:#2b2417;color:#fff}
  .rv-bar .ib{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25);font-size:.72rem;padding:4px 8px;min-width:0}
  .rv-bar .ib.danger{color:#ffb4a6}.rv-bar .ib.armed{background:#a13b2c}
  .rv-tt{flex:1;min-width:0;display:flex;flex-direction:column}.rv-tt b{font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rv-tt small{font-size:.62rem;opacity:.7}
  .rv-scroll{flex:1;overflow:auto;padding:12px 10px 40px;touch-action:pan-x pan-y pinch-zoom}
  .rv-pages{display:flex;flex-direction:column;align-items:center;gap:14px}
  .pg{position:relative;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.35);display:flex;flex-direction:column;color:#222;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;flex:0 0 auto}
  .pg-head,.pg-foot{flex:0 0 auto;display:flex;justify-content:space-between;gap:10px;padding:calc(14px * var(--u)) calc(38px * var(--u)) 0;font-size:calc(8.5px * var(--u));color:#8a8577;letter-spacing:.02em}
  .pg-head span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
  .pg-foot{padding:0 calc(38px * var(--u)) calc(14px * var(--u))}
  .pg-body{flex:1;min-height:0;overflow:hidden;padding:calc(14px * var(--u)) calc(42px * var(--u)) calc(10px * var(--u));font-size:calc(11.5px * var(--u) * var(--fz));line-height:1.7}
  .pg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(6px * var(--u));background:linear-gradient(#a13b2c,#3a6b64)}
  .rb-title{margin-bottom:1.1em}

<script>
/* ── 개발자 로그 (v1.2.8) — 프로그램이 도는 걸 실시간으로 적는다. 설정에서 켠 기기에서만 「로그」 탭이 보인다.
   메모리에 600줄, 이 기기 localStorage 에 마지막 300줄(새로 고침해도 남게). 서버로는 안 올린다. */
const DBG = { lines:[], max:600, seq:0, paused:false, filter:'all', subs:new Set(), dirty:false };
try{ DBG.lines = JSON.parse(localStorage.getItem('sehee.dbg') || '[]'); DBG.seq = DBG.lines.length ? DBG.lines[DBG.lines.length - 1].n : 0; }catch(e){}
function dlog(cat, msg, data){
  const l = { n:++DBG.seq, t:Date.now(), c:cat, m:String(msg).slice(0, 400) };
  if (data !== undefined){ try{ l.d = typeof data === 'string' ? data.slice(0, 4000) : JSON.stringify(data, (k, v) => typeof v === 'string' && v.length > 600 ? v.slice(0, 600) + '…(' + v.length + '자)' : v).slice(0, 4000); }catch(e){ l.d = String(data); } }
  DBG.lines.push(l); if (DBG.lines.length > DBG.max) DBG.lines.splice(0, DBG.lines.length - DBG.max);
  DBG.dirty = true; for (const f of DBG.subs) try{ f(l); }catch(e){}
}
setInterval(() => { if (!DBG.dirty) return; DBG.dirty = false; DBG.up = true; try{ localStorage.setItem('sehee.dbg', JSON.stringify(DBG.lines.slice(-300))); }catch(e){} }, 2000);
/* 개발자 로그를 켠 기기는 10초마다 마지막 300줄을 계정 서버에도 올린다 — 개발자가 같이 보며 원인을 찾게(v1.3.1) */
setInterval(() => { try{ if (!DBG.up || localStorage.getItem('sehee.dev') !== '1' || typeof kvSet !== 'function') return; DBG.up = false; kvSet('dbg', { at:Date.now(), v:APP_VERSION, lines:DBG.lines.slice(-300) }); }catch(e){} }, 10000);
window.addEventListener('error', e => dlog('오류', (e.message || '스크립트 오류') + (e.filename ? ` @${e.filename.split('/').pop()}:${e.lineno}` : ''), e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => dlog('오류', '처리 안 된 실패: ' + ((e.reason && e.reason.message) || e.reason), e.reason && e.reason.stack));
for (const k of ['error', 'warn']){ const o = console[k].bind(console); console[k] = (...a) => { try{ dlog(k === 'error' ? '오류' : '경고', a.map(x => x && x.message ? x.message : typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ').slice(0, 300)); }catch(e){} o(...a); }; }
document.addEventListener('visibilitychange', () => dlog('화면', document.hidden ? '앱을 내림(숨김)' : '앱으로 돌아옴'));
window.addEventListener('online', () => dlog('네트워크', '인터넷 연결됨')); window.addEventListener('offline', () => dlog('네트워크', '인터넷 끊김'));

/* 세희 깡통 — 변경 기록
   v0.1 (2026-11-12) 첫 판. 날짜별 판 + 안 끝난 일 이어받기, 칸 5개(이름·색·순서 바꾸기),
        받은 것(붙여넣기 · 안드로이드 공유하기), 세희 한마디 · 도장, 태그, 백업 내보내기·가져오기,
        글자 크기, 새 버전 띠. AI 없음. 데이터는 이 폰의 IndexedDB 에만 있다.
   v0.2 (2026-11-12) 아래 탭으로 판 ↔ 사무실 화면 전환. 사무실 = 책상에 앉은 세희 + 말풍선 대화.
        유저는 오른쪽 말풍선, 입력칸도 말풍선. 연결 없음 — 자동응답 랜덤 + 표정 6종(임시 그림).
        대화는 이 폰에 저장(최근 300개), 설정에서 비우기. 키보드가 올라오면 장면이 작아진다.
   v0.3 (2026-11-12) 세희 머리 연결 — 사용자 API 키(Claude 또는 Gemini)로 폰에서 바로 대화. 서버 없음.
        세희는 오늘 판(안 끝난 일·받은 것·끝낸 일)을 읽고 대답하고, 답 앞 표정 태그로 얼굴이 바뀐다.
        키는 이 폰의 kv 'ai' 에만(백업 제외). 월 사용 토큰·추정 금액 표시. 키가 없으면 v0.2 자동응답.
        '판 같이 보내기' 스위치 — Claude 기본 켬, Gemini 기본 끔(무료 키에 개인정보가 가지 않게).
   v0.4 (2026-11-12) 무한로딩 대책. 글자가 오는 대로 말풍선에 뜬다(스트리밍). 기다리는 동안 초를 세고 「그만」 단추.
        45초 동안 대답이 없거나 40초 동안 글자가 멈추면 끊는다. 오류는 한국어 이유(키·한도·서버·인터넷)로 보여준다.
        Gemini 3 계열은 '조금만 생각(low)'으로 불러 빨라지게. 설정에 연결 기록(첫 글자·전체 시간·토큰·오류) + 기록 복사.
   v0.5 (2026-11-12) 세희가 대화하면서 오늘 판에 직접 적는다(도구 호출: 적기·고치기·끝냄·지우기·받은 것 담기).
        약속은 '다가오는 일정'에 날짜와 함께 먼저 적고, 시각을 모르면 비워둔 채 한 번만 묻는다. 지금 시각과 8일치 달력을 매번 같이 보낸다.
        판 작업은 대화에 📌 줄로 보이고 하나씩 되돌릴 수 있다. 판 항목에 📅 날짜·시각, '세희가 적음' 표시.
   v0.6 (2026-11-12) 세희가 판을 본다 — '세희가 판 보기' 기본 켬(두 엔진 모두). 오늘 판은 늘, 지난 판은 필요할 때 직접 찾아본다
        (read_pan 하루치 보기, search_history 지난 판 글자 찾기). 찾아볼 때마다 대화에 🔎 줄. 무료 제미나이 키 안내 문구 보강.
   v0.6.1 (2026-11-12) 긴 카톡 로그를 한 번에 정리하도록 — 대답 길이 한도 상향(Claude 2500, Gemini 4096), 도구 주고받기 최대 8번,
        로그 정리 규칙(중복 하나로, 바뀐 일정은 최종값, 로그 날짜 기준 날짜 계산, 미정은 확정 칸에 안 넣기).
   v0.6.2 (2026-11-12) 한도 대응 — 하루 한도/분당 한도/크레딧 부족을 가려 한국어 한 줄로(영어 원문은 연결 기록에만).
        분당 한도면 알려준 시간만큼 초를 세며 기다렸다 자동으로 다시(두 번까지). 하루 한도면 풀리는 시각 안내.
        '긴 글 정리' 모델 — 평소는 위 모델(Claude 기본 Haiku), 300자·6줄 넘는 글은 Sonnet 이 정리.
   v0.6.3 (2026-11-12) 키 입력칸을 보이는 글자로(비밀번호 칸이면 폰이 저장된 비밀번호를 자동으로 채울 수 있었다).

    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('pans', { keyPath:'date' }); db.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); let out;
    const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const getPan   = d => tx('pans','readonly',  s => s.get(d));
const putPan   = p => tx('pans','readwrite', s => s.put(p)).then(r => { syncMark('pan:' + p.date); return r; });
const allPans  = () => tx('pans','readonly', s => s.getAll());
const allDates = () => tx('pans','readonly', s => s.getAllKeys());
const kvGet    = k => tx('kv','readonly',  s => s.get(k));
const kvSet    = (k,v) => tx('kv','readwrite', s => s.put(v,k)).then(r => { if (SYNC_KV.includes(k)) syncMark('kv:' + k); return r; });

const S = { settings:null, today:todayStr(), date:null, pan:null, dates:[], folded:{}, persisted:null, persistAsked:false };
const $ = id => document.getElementById(id);
const secs = () => S.settings.sections;
const secById = id => secs().find(s => s.id === id);

function emptyPan(date){ return { date, line:'', face:'-_-', items:[], inbox:[], carriedFrom:null, createdAt:Date.now(), updatedAt:Date.now() }; }

/* 오늘 판이 없으면 — 가장 최근 판에서 안 끝난 일과 받은 것을 그대로 이어받아 만든다 */
async function makeToday(date){
  const prevDate = S.dates.filter(d => d < date).sort().pop();
  const p = emptyPan(date);
  if (prevDate){
    const prev = await getPan(prevDate);
    const first = secs()[0].id;
    p.items = (prev.items || []).filter(it => !it.done).map(it => ({ ...it, sec: secById(it.sec) ? it.sec : first }));
    p.inbox = (prev.inbox || []).map(x => ({ ...x }));
    p.carriedFrom = prevDate;
  }
  await putPan(p);
  S.dates = (await allDates()).sort();
  return p;
}

async function goDate(date){
  await flush();
  let p = await getPan(date);
  if (!p && date === S.today) p = await makeToday(date);
  S.date = date; S.pan = p || null;
  render();
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}

/* ── 저장 ── */
let saveT = null;
function touch(now){
  if (!S.pan) return;
  S.pan.updatedAt = Date.now();
  clearTimeout(saveT);
  if (now) return flush(true);
  saveT = setTimeout(() => flush(true), 350);
}
async function flush(force){
  if (!saveT && !force) return;
  clearTimeout(saveT); saveT = null;
  if (!S.pan) return;
  await putPan(S.pan);
  const el = $('saved'); el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1400);
  askPersist();
}
async function saveSettings(){ await kvSet('settings', S.settings); }
async function askPersist(){
  if (S.persistAsked) return; S.persistAsked = true;
  try{
    if (navigator.storage && navigator.storage.persist){
      S.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    }
  }catch(e){}
}

let toastT = null, undoFn = null;
function toast(msg, undo){
  dlog('알림', msg);

const findItem = id => S.pan.items.find(it => it.id === id);
function snapshot(){ return JSON.stringify({ items:S.pan.items, inbox:S.pan.inbox }); }
function restore(snap){ const o = JSON.parse(snap); S.pan.items = o.items; S.pan.inbox = o.inbox; touch(true); render(); }

function addItem(sec, text){
  text = text.trim(); if (!text) return;
  S.pan.items.push({ id:uid(), sec, text, tag:null, done:false, since:S.pan.date });

function startEdit(row){
  const it = findItem(row.dataset.id); if (!it) return;
  const tx = row.querySelector('.tx');
  const ta = document.createElement('textarea'); ta.className = 'ed'; ta.value = it.text; ta.rows = 1;
  tx.replaceWith(ta); grow(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener('input', () => grow(ta));
  ta.addEventListener('blur', () => {
    const v = ta.value.trim();
    if (!v){ const snap = snapshot(); S.pan.items = S.pan.items.filter(x => x.id !== it.id); touch(true); render(); toast('지웠어요', () => restore(snap)); return; }
    if (v !== it.text){ it.text = v; touch(true); }
    render();
  }, { once:true });
}

async function storageInfo(){

let impPending = null;
$('sheet').addEventListener('click', async e => {

  else if (a === 'up' && i > 0){ [list[i-1], list[i]] = [list[i], list[i-1]]; }
  else if (a === 'down' && i < list.length - 1){ [list[i+1], list[i]] = [list[i], list[i+1]]; }

    const gone = list.splice(i, 1)[0], to = list[0];
    let moved = 0;
    if (S.pan) S.pan.items.forEach(it => { if (it.sec === gone.id){ it.sec = to.id; moved++; } });
    if (moved){ touch(true); toast(`남은 ${moved}개는 '${to.label}'(으)로 옮겼어요`); }
  }
  else if (a === 'addsec'){ list.push({ id:'s' + uid(), label:'새 칸', color:PALETTE[list.length % PALETTE.length] }); }
  else if (a === 'fs'){ S.settings.fs = Number(b.dataset.v); applyFs(); }
  else if (a === 'font'){ S.settings.font = b.dataset.v; applyFont(); }
  else if (a === 'bonus'){ try{ localStorage.setItem('sehee.bonus', b.dataset.v); }catch(e){} toast(b.dataset.v === '1' ? '새로 고치면 보너스가 들어와요' : '새로 고치면 보너스가 빠져요'); settingsSheet(); return; }
  else if (a === 'bonusrun'){ const m = BONUS.menu[Number(b.dataset.i)]; closeSheet(); if (m) try{ await m.run(); }catch(e){ dlog('오류', '보너스 메뉴 ' + e.message, e.stack); toast('보너스 기능에서 문제가 났어요'); } return; }
  else if (a === 'dev'){ try{ localStorage.setItem('sehee.dev', b.dataset.v); }catch(e){} devApply(); settingsSheet(); return; }
  else if (a === 'export'){ await exportAll(); return; }
  else if (a === 'import'){
    if (impPending){ await doImport(impPending); impPending = null; return; }
    $('impFile').click(); return;
  }
  else if (a === 'check'){ checkUpdate(true); return; }
  else if (a === 'copylog'){

    catch(e){ toast('복사가 안 돼요. 화면을 캡처해 주세요'); }

  }
  else if (a === 'clearlog'){ await kvSet('ailog', []); fillAiLog(); return; }
  else if (a === 'notify'){ askNotify(); return; }
  else if (a === 'syncurl'){ const u = $('syncUrl').value.trim().replace(/\/+$/, ''); if (u && !/^https?:\/\//.test(u)){ $('syncInfo').textContent = 'https:// 로 시작하는 주소를 넣어 주세요.'; return; }
    try{ if (u){ const r = await fetch(u + '/'); const j = await r.json(); if (!j || j.name !== 'sehee-sync') throw 0; } }catch(e){ $('syncInfo').textContent = '그 주소에서 세희 서버가 대답하지 않아요. 주소를 확인해 주세요.'; return; }
    SYNC.url = u; SYNC.token = ''; syncKeep(); $('syncInfo').textContent = u ? '저장했어요. 「암호로 열기」를 누르면 암호를 물어요.' : '서버 주소를 지웠어요.'; settingsSheet(); return; }
  else if (a === 'login'){ SYNC.token = ''; syncKeep(); location.reload(); return; }
  else if (a === 'logout'){ if (!b.textContent.includes('한 번 더')){ b.textContent = '한 번 더 누르면 로그아웃'; return; } syncLogout(); return; }
  else if (a === 'syncnow'){ await syncFlush(); $('syncInfo').textContent = syncLine(); return; }
  else if (a === 'priv'){ AI.cfg.priv = b.dataset.v === '1'; await saveAi(); settingsSheet(); return; }
  else if (a === 'work'){ AI.cfg.work = b.dataset.v === '1'; await saveAi(); settingsSheet(); return; }
  else if (a === 'ask'){ AI.cfg.ask = b.dataset.v; await saveAi(); settingsSheet(); return; }
  else if (a === 'web'){ AI.cfg.web = AI.cfg.web || {}; AI.cfg.web[AI.cfg.provider] = b.dataset.v === '1'; AI.noWeb = false; await saveAi(); refreshBrain(); settingsSheet(); return; }
  else if (a === 'sendpan'){ AI.cfg.sendPan[AI.cfg.provider] = b.dataset.v === '1'; await saveAi(); refreshBrain(); settingsSheet(); return; }
  else if (a === 'prov'){ AI.cfg.provider = b.dataset.v; await saveAi(); refreshBrain(); settingsSheet(); return; }
  else if (a === 'pastekey'){
    try{ $('aiKey').value = cleanKey(await navigator.clipboard.readText()); $('keyLen').textContent = keyCheck($('aiKey').value); }
    catch(e){ $('keyLen').textContent = '붙여넣기 권한이 없어요. 칸을 길게 눌러 붙여넣어 주세요'; }
    return;
  }
  else if (a === 'savekey'){
    if (!cleanKey($('aiKey').value)){ $('aiKeyNote').textContent = '키를 붙여넣어 주세요.'; return; }

    $('aiNote').textContent = '불러오는 중…';
    try{ await loadModels(); settingsSheet(); }catch(err){ $('aiNote').textContent = '못 불러왔어요: ' + err.message; }
    return;
  }
  else if (a === 'aitest'){
    if (cleanKey($('aiKey').value)){ if (!(await saveKeyFromInput())) return; }
    if (!aiKey()){ $('aiNote').textContent = '키부터 저장해 주세요.'; return; }
    $('aiNote').textContent = '세희에게 물어보는 중…';
    try{
      const r = await aiStream([{ role:'user', content:'연결 시험이에요. 한 문장으로 인사해 주세요.' }]);
      $('aiNote').textContent = `연결됐어요 (첫 글자 ${secs1(r.rec.firstMs)} · 전체 ${secs1(r.rec.ms)}${r.rec.auth ? ' · ' + (r.rec.auth === 'bearer' ? 'Bearer' : 'x-api-key') : ''}) — ` + parseFace(r.text).t;
    }catch(err){ $('aiNote').textContent = '연결 안 됨: ' + err.message; }

  }
  else if (a === 'delkey'){

  else if (a === 'clearchat'){

    O.log = []; O.loaded = true; await kvSet('chat', []); b.classList.remove('danger'); b.textContent = '비웠어요'; return;
  }
  else return;
  await saveSettings(); render(); settingsSheet();
});

async function exportAll(){
  await flush(true);
  const data = { app:'sehee', version:APP_VERSION, exportedAt:new Date().toISOString(), settings:S.settings, pans:await allPans() };
  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `sehee-backup-${S.today}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('백업 파일을 내려받았어요');
}
async function doImport(data){
  await tx('pans','readwrite', s => s.clear());
  for (const p of data.pans) await putPan(p);
  if (data.settings && Array.isArray(data.settings.sections)){ S.settings = { ...S.settings, ...data.settings }; await saveSettings(); applyFs(); }
  S.dates = (await allDates()).sort();
  closeSheet(); await goDate(S.today);
  toast(`판 ${data.pans.length}개를 불러왔어요`);
}

/* 글꼴 (v1.2.8) — 본문·제목 짝. 기본은 폰 글꼴(인터넷 없이도). 나머지는 처음 고를 때 인터넷에서 한 번 받아 온다 */
const GF = f => 'https://fonts.googleapis.com/css2?' + f.map(x => 'family=' + x).join('&') + '&display=swap';
const FONTS = [
  { v:'sys', t:'기본', d:'폰 글꼴 + 명조 제목', body:'-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif', head:'"Noto Serif KR","Batang",serif' },

  { v:'nanum', t:'나눔', d:'익숙한 나눔고딕 + 나눔명조', body:'"Nanum Gothic",sans-serif', head:'"Nanum Myeongjo",serif', css:[GF(['Nanum+Gothic:wght@400;700', 'Nanum+Myeongjo:wght@400;700'])] },

];
function applyFont(){
  const f = FONTS.find(x => x.v === (S.settings.font || 'sys')) || FONTS[0], r = document.documentElement.style;
  for (const u of f.css || []) if (!document.querySelector(`link[data-font="${u}"]`)){ const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; l.dataset.font = u; document.head.appendChild(l); }
  r.setProperty('--f-body', f.body); r.setProperty('--f-head', f.head); r.setProperty('--f-talk', f.talk || 'inherit');
}

$('main').addEventListener('click', e => {

  if (a === 'fold'){ const id = b.closest('.sec').dataset.sec; S.folded[id] = !S.folded[id]; render(); return; }
  if (a === 'add'){ const inp = b.parentNode.querySelector('input'); addItem(inp.dataset.sec, inp.value); render(); const again = $('main').querySelector(`.add input[data-sec="${inp.dataset.sec}"]`); again && again.focus(); return; }
  const row = b.closest('.it');
  if (row){
    const it = findItem(row.dataset.id); if (!it) return;
    if (a === 'toggle'){ it.done = !it.done; it.doneAt = it.done ? Date.now() : null; touch(true); render(); return; }
    if (a === 'edit'){ startEdit(row); return; }
    if (a === 'menu'){ itemMenu(it.id); return; }
  }
  const ib = b.closest('.ibx');
  if (ib){
    const x = S.pan.inbox.find(v => v.id === ib.dataset.id); if (!x) return;
    if (a === 'ibexp'){ ib.querySelector('.ibtx').classList.toggle('open'); b.textContent = b.textContent === '펼치기' ? '접기' : '펼치기'; return; }
    const snap = snapshot();
    S.pan.inbox = S.pan.inbox.filter(v => v !== x);
    if (a === 'ibmove'){ S.pan.items.push({ id:uid(), sec:b.dataset.sec, text:x.text, tag:null, done:false, since:S.pan.date }); toast(`'${secById(b.dataset.sec).label}'에 담았어요`, () => restore(snap)); }
    else toast('버렸어요', () => restore(snap));
    touch(true); render();
  }
});

/* ── 새 버전 (v1.2.7) — 몇 개가 쌓였든 한 번에 최신으로 ──
   예전엔 새 껍데기가 '대기'하다 띠를 누르면 한 칸씩 넘어가서, 자리를 비운 사이 여러 번 올라오면 띠를 여러 번 눌러야 했다.
   이제 새 껍데기는 받자마자 바로 자리를 잡고(skipWaiting), 화면은 세희가 쉬고 있을 때 저절로 한 번만 새로 고친다.
   대답 중·작업 중·글 쓰는 중이면 기다렸다가 끝나면(또는 앱을 내렸을 때) 고친다. 띠의 「지금 적용」은 언제 눌러도 한 번이면 끝. */
let waitingSW = null, wantReload = false, pendingReload = false, reloading = false;
const hadCtrl = 'serviceWorker' in navigator && !!navigator.serviceWorker.controller;
function updIdle(){
  const say = document.getElementById('sayText'), sh = document.getElementById('sheet');
  return !O.busy && !(say && say.value.trim()) && !(sh && sh.classList.contains('on')) && !document.getElementById('pinVeil');
}
async function applyUpdate(){
  if (reloading) return; reloading = true;
  try{ await flush(true); }catch(e){}
  try{ if (typeof SYNC !== 'undefined' && SYNC.on) await syncFlush(); }catch(e){}
  location.reload();
}
function showUpdate(sw){
  dlog('업데이트', '새 버전 받음(대기)');
  waitingSW = sw;
  /* 옛 껍데기(v1.2.6 이하)는 스스로 자리를 못 잡으니 여기서 바로 밀어준다 */
  if (sw && sw.state !== 'redundant'){ wantReload = updIdle(); sw.postMessage('skip'); }
  if (!updIdle()){ pendingReload = true; $('upd').classList.add('on'); }
}
function newShellReady(){
  dlog('업데이트', '새 껍데기가 자리 잡음 · 쉬는 중=' + updIdle());
  if (!hadCtrl && !wantReload) return;          /* 처음 깔린 거면 새로 고칠 필요 없음 */
  if (wantReload || updIdle()) return applyUpdate();
  pendingReload = true; $('upd').classList.add('on');
}
$('updGo').onclick = async () => {
  wantReload = true;
  if (waitingSW && waitingSW.state !== 'redundant') waitingSW.postMessage('skip');
  else if (S.reg && S.reg.waiting) S.reg.waiting.postMessage('skip');
  setTimeout(applyUpdate, waitingSW || (S.reg && S.reg.waiting) ? 2500 : 0);   /* 무슨 일이 있어도 한 번 누르면 끝 */
};
setInterval(() => { if (pendingReload && updIdle()) applyUpdate(); }, 4000);
document.addEventListener('visibilitychange', () => { if (document.hidden && pendingReload && !O.busy) applyUpdate(); });
async function checkUpdate(manual){
  if (!S.reg){ if (manual) toast('이 화면에서는 업데이트를 확인할 수 없어요'); return; }
  try{ await S.reg.update(); }catch(e){}
  if (manual) setTimeout(() => toast(pendingReload || waitingSW || S.reg.installing ? '새 버전을 받는 중이에요 — 곧 저절로 바뀌어요' : '지금이 최신이에요'), 900);
}
if ('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange', newShellReady);
  navigator.serviceWorker.register('sw.js').then(reg => {
    S.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(nw); });
    });
  }).catch(() => {});
}



/* ── 세희 머리 (v0.3) — 사용자가 가져온 API 키(BYOK)로 폰에서 바로 부른다. 서버 없음 ──
   키·모델은 kv 'ai' 에만 둔다(백업 파일 settings 와 분리). 사용량은 kv 'usage' 에 월별로 쌓는다. */
const AI = { cfg:null };
const FACE_TAGS = { '의심':1, '생각':2, '미소':3, '당황':4, '놀람':5, '삐침':6 };
/* Claude 5.5 단가(100만 토큰당 달러, 입력/출력) — 확인한 값만. 다른 모델은 토큰만 센다 */
const PRICE = [ { re:/opus-5-5/, i:4, o:20 }, { re:/sonnet-5-5/, i:2, o:10 }, { re:/haiku-5-5/, i:0.10, o:0.50 } ];
async function loadAi(){ AI.cfg = Object.assign({ provider:'anthropic', keys:{}, models:{}, lists:{}, sendPan:{}, big:{} }, (await kvGet('ai')) || {}); AI.cfg.sendPan = AI.cfg.sendPan || {}; AI.cfg.big = AI.cfg.big || {}; }
/* 긴 글(카톡 로그 등) 정리할 때만 쓰는 모델 — 평소는 싼 모델, 큰일은 똑똑한 모델 */
function bigModel(){ const b = AI.cfg.big[AI.cfg.provider]; return b && b !== aiModel() ? b : null; }
function bigOptions(){
  const list = AI.cfg.lists[AI.cfg.provider] || [], cur = AI.cfg.big[AI.cfg.provider] || '';
  return '<option value="">같은 모델</option>' + list.map(m => `<option value="${esc(m.id)}" ${m.id === cur ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
}
/* 웹 검색 (v0.7) — 기본 켬. Claude는 검색 1번 $0.01, Gemini는 구글 검색 근거 */
const WEB_TOOL = { type:'web_search_20250305', name:'web_search', max_uses:3, user_location:{ type:'approximate', country:'KR', timezone:'Asia/Seoul' } };
function webOn(){ const v = (AI.cfg.web || {})[AI.cfg.provider]; return v === undefined ? true : v; }
/* 사적인 일·관계 (v1.2.5) — 기본 넣기. 끄면 정리·판·인간관계 판에서 업무 외 개인 일은 뺀다 */
const privOn = () => AI.cfg.priv !== false;
/* 세희가 판 보기 — v0.6 부터 두 엔진 모두 기본 켬. 끄면 판을 안 보내고 자기가 적은 것만 안다 */
function sendPanOn(){ const v = AI.cfg.sendPan[AI.cfg.provider]; return v === undefined ? true : v; }
const saveAi = () => kvSet('ai', AI.cfg);
const aiKey = () => AI.cfg && AI.cfg.keys[AI.cfg.provider];
const aiModel = () => AI.cfg && AI.cfg.models[AI.cfg.provider];
const aiReady = () => !!(aiKey() && aiModel());
/* 콘솔 키 목록과 같은 모양(앞 14자…끝 4자)으로 보여준다 — 둘을 눈으로 맞춰볼 수 있게 */
const mask = k => k.length > 22 ? k.slice(0, 14) + '…' + k.slice(-4) : /\.\.\.|…/.test(k) ? k : k.length > 8 ? k.slice(0, 4) + '…' + k.slice(-2) : '••••';
function keyNote(){
  const k = aiKey(); if (!k) return '저장된 키가 없어요.';
  const w = keyCheck(k);
  return `저장된 키: ${esc(mask(k))} (${k.length}자)` + (w.startsWith('⚠') ? ' — ' + esc(w) : '') + (AI.cfg.provider === 'anthropic' && AI.cfg.auth ? ` · 인증 방식 ${AI.cfg.auth === 'bearer' ? 'Bearer' : 'x-api-key'}` : '');
}
/* 복사할 때 딸려 오는 빈칸·줄바꿈·보이지 않는 글자·따옴표를 걷어낸다 */
const cleanKey = v => String(v || '').replace(/[\s\u200B-\u200D\uFEFF\u00A0]/g, '').replace(/^["'`]+|["'`]+$/g, '');
function keyCheck(v){
  if (!v) return '';
  if (/\.\.\.|…|•/.test(v)) return `⚠ 가운데가 가려진 키예요 (${v.length}자). 콘솔 목록에 보이는 건 진짜 키가 아니에요. 새로 만들 때 한 번만 나오는 전체 키를 복사해야 해요`;
  const bad = v.match(/[^A-Za-z0-9_\-]/);
  if (bad) return `⚠ 키에 들어갈 수 없는 글자 「${bad[0]}」가 섞였어요 (${v.length}자)`;
  if (AI.cfg.provider === 'anthropic'){
    if (/^apikey_/.test(v)) return '⚠ 이건 키 ID예요. 진짜 키는 sk-ant- 로 시작해요';
    if (!/^sk-ant-/.test(v)) return `⚠ sk-ant- 로 시작하지 않아요. 키가 아닌 걸 복사한 것 같아요 (${v.length}자)`;
    if (v.length < 60) return `⚠ ${v.length}자밖에 안 돼요. 진짜 키는 100자 안팎이에요. 일부만 복사된 것 같아요`;
  }
  return `${v.length}자 · ${mask(v)} — 콘솔 목록의 앞뒤 글자와 같으면 맞는 키예요`;
}
function modelOptions(){
  const list = (AI.cfg.lists[AI.cfg.provider] || []), cur = aiModel();
  if (!list.length) return cur ? `<option value="${esc(cur)}">${esc(cur)}</option>` : '<option value="">모델 — 키를 저장하면 불러와요</option>';
  return list.map(m => `<option value="${esc(m.id)}" ${m.id === cur ? 'selected' : ''}>${esc(m.name)} · ${esc(m.id)}</option>`).join('');
}
const shortModel = id => (id || '').replace(/^claude-/, '').replace(/-\d{8}$/, '');
function refreshBrain(){
  const b = $('brain'); if (!b) return;
  b.classList.toggle('on', aiReady());
  b.textContent = aiReady() ? '머리: ' + shortModel(aiModel()) + (bigModel() ? ' / ' + shortModel(bigModel()) : '') + (sendPanOn() ? ' · 판 봄' : ' · 판 안 봄') + (webOn() && !AI.noWeb ? ' · 검색' : '') : '머리 없음 · 깡통';
}
function errText(j, r){ return (j && j.error && (j.error.message || j.error.status)) || `HTTP ${r.status}`; }
async function fetchJson(url, opt, ms){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 60000);
  try{
    const r = await fetch(url, { ...opt, signal:ctl.signal });
    let j = null; try{ j = await r.json(); }catch(e){}
    if (!r.ok){ const e = new Error(errText(j, r)); e.status = r.status; throw e; }
    return j;
  }catch(err){ if (err.name === 'AbortError') throw new Error('시간이 너무 걸려서 끊었어요'); throw err; }
  finally{ clearTimeout(t); }
}
/* 인증: 문서 기본인 Authorization: Bearer 먼저, 401이면 예전 방식 x-api-key 로 한 번 더. 되는 쪽을 기억한다 */
const anthAuth = () => AI.cfg.auth || 'bearer';
const otherAuth = m => m === 'bearer' ? 'xkey' : 'bearer';
function anthHeaders(key, mode){
  const h = { 'content-type':'application/json', 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' };
  if ((mode || anthAuth()) === 'bearer') h.authorization = 'Bearer ' + key; else h['x-api-key'] = key;
  return h;
}
/* 칸에 있는 키를 저장하고 바로 모델 목록으로 확인. 칸 위 글씨로 결과를 알린다 */
async function saveKeyFromInput(){
  const v = cleanKey($('aiKey').value), p = AI.cfg.provider;
  if (AI.cfg.keys[p] !== v && p === 'anthropic') delete AI.cfg.auth;
  AI.cfg.keys[p] = v; await saveAi(); $('aiKey').value = ''; $('keyLen').textContent = '';
  $('aiKeyNote').textContent = '저장했어요. 키가 맞는지 확인하는 중…';
  try{ await loadModels(); settingsSheet(); $('aiNote').textContent = '키 확인 끝, 모델을 골랐어요. 「연결 시험」으로 대화까지 확인해 보세요.'; refreshBrain(); return true; }
  catch(err){ $('aiKeyNote').textContent = `키는 저장했지만 확인이 안 됐어요: ${err.message}`; refreshBrain(); return false; }
}
function keyFailText(raw){
  const k = aiKey() || '', w = keyCheck(k);
  if (w.startsWith('⚠')) return `키를 안 받아줘요(${raw || '401'}). ${w.slice(2)}`;
  return `키를 안 받아줘요(${raw || '401'}) — Bearer·x-api-key 둘 다 거절. 저장된 키 ${mask(k)} · ${k.length}자. 콘솔 목록의 키와 앞 14자·끝 4자가 다르면 콘솔에서 새 키를 만들어 그 창의 전체 키를 복사해 주세요. 같은데도 안 되면 그 키가 만료·삭제됐는지 콘솔에서 봐주세요`;
}
async function loadModels(){
  const p = AI.cfg.provider, key = aiKey(); let list;
  if (p === 'anthropic'){
    const url = 'https://api.anthropic.com/v1/models?limit=100'; let j, mode = anthAuth();
    try{ j = await fetchJson(url, { headers:anthHeaders(key, mode) }, 20000); }
    catch(err){
      if (err.status !== 401) throw err;
      mode = otherAuth(mode);
      try{ j = await fetchJson(url, { headers:anthHeaders(key, mode) }, 20000); }
      catch(err2){ if (err2.status === 401) throw new Error(keyFailText(err2.message)); throw err2; }
    }
    if (AI.cfg.auth !== mode){ AI.cfg.auth = mode; }
    list = (j.data || []).map(m => ({ id:m.id, name:m.display_name || m.id }));
  } else {
    const j = await fetchJson('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', { headers:{ 'x-goog-api-key':key } }, 20000);
    list = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => ({ id:m.name.replace(/^models\//, ''), name:m.displayName || m.name }));
  }
  if (!list.length) throw new Error('쓸 수 있는 모델이 없어요');
  AI.cfg.lists[p] = list;
  if (!list.some(m => m.id === AI.cfg.models[p])){
    const ids = list.map(m => m.id);
    const pref = p === 'anthropic' ? [/haiku/, /sonnet/, /opus/] : [/^gemini-3\.5-flash$/, /^gemini-[\d.]+-flash$/, /flash(?!.*(lite|image|tts|audio|live))/];
    AI.cfg.models[p] = (pref.map(re => ids.find(id => re.test(id))).find(Boolean)) || ids[0];
  }
  if (!(p in AI.cfg.big)){ const ids = list.map(m => m.id); AI.cfg.big[p] = p === 'anthropic' ? (ids.find(id => /sonnet/.test(id)) || '') : ''; }
  await saveAi(); refreshBrain();
}
async function addUsage(model, inTok, outTok){
  const m = todayStr().slice(0, 7), u = (await kvGet('usage')) || {};
  const row = u[m] || (u[m] = { calls:0, in:0, out:0, usd:0, priced:true });
  const pr = PRICE.find(x => x.re.test(model));
  row.calls++; row.in += inTok; row.out += outTok;
  if (pr) row.usd += (inTok * pr.i + outTok * pr.o) / 1e6; else row.priced = false;
  await kvSet('usage', u); AI.usage = u;
}
async function addSearch(provider, n){
  const m = todayStr().slice(0, 7), u = (await kvGet('usage')) || {};
  const row = u[m] || (u[m] = { calls:0, in:0, out:0, usd:0, priced:true });
  row.search = (row.search || 0) + n; if (provider === 'anthropic') row.usd += n * 0.01;
  await kvSet('usage', u); AI.usage = u;
}
function usageLine(){
  const m = todayStr().slice(0, 7), row = AI.usage && AI.usage[m];
  if (!row) return '이번 달 사용: 아직 없어요.';
  const n = x => x.toLocaleString('ko-KR');
  return `이번 달 ${row.calls}번 · 입력 ${n(row.in)} / 출력 ${n(row.out)} 토큰` + (row.search ? ` · 검색 ${row.search}번` : '') + (row.usd ? ` · 약 $${row.usd.toFixed(4)}` : '') + (row.priced ? '' : ' (단가 모르는 모델은 금액에서 빠짐)');
}

/* 오늘 판을 세희가 읽을 수 있는 글로 (항목마다 #id — 세희가 고칠 때 쓴다) */
const mdDay = d => { const x = parseYmd(d); return `${x.getMonth() + 1}/${x.getDate()}(${WD[x.getDay()]})`; };
const dueText = it => it.due ? mdDay(it.due) + (it.time ? ' ' + it.time : ' · 시간 미정') : '';
const secName = id => (secById(id) || secs()[0]).label;
function itemLine(it, date){
  const age = it.since && it.since < date ? ` (${dayDiff(it.since, date) + 1}일째)` : '';
  return `- #${it.id} [${secName(it.sec)}] ${it.text}${it.due ? ` (날짜 ${dueText(it)})` : ''}${it.tag ? ` (태그: ${it.tag})` : ''}${age}${it.done ? ' (끝냄)' : ''}`;
}
async function todayPanRef(){ if (S.date === S.today && S.pan) return S.pan; return (await getPan(S.today)) || await makeToday(S.today); }
async function panContext(){
  const p = await todayPanRef();
  const open = p.items.filter(it => !it.done).map(it => itemLine(it, p.date));
  const done = p.items.filter(it => it.done).map(it => `- [${secName(it.sec)}] ${it.text}`);
  const inbox = (p.inbox || []).map(x => `- #${x.id} ${x.text.replace(/\n/g, ' / ')}`);
  return [`지금 판 — 안 끝난 일:\n${open.join('\n') || '- 없음'}`, `받은 것(아직 칸에 안 담음):\n${inbox.join('\n') || '- 없음'}`,
          `오늘 끝낸 일:\n${done.join('\n') || '- 없음'}`, p.line ? `세희 한마디(판 위): ${p.line}` : ''].filter(Boolean).join('\n\n');
}
/* 판 보내기를 꺼도 — 이 대화에서 세희가 직접 다룬 항목만은 알려준다(보스가 말로 한 것뿐이라) */
async function touchedContext(){
  const p = await todayPanRef(), ids = [];
  for (const m of O.log) if (m.who === 'a' && m.act && !m.undone){ const id = (m.act.after || m.act.before || {}).id; if (id && !ids.includes(id)) ids.push(id); }
  const lines = ids.slice(-12).map(id => p.items.find(x => x.id === id)).filter(Boolean).map(it => itemLine(it, p.date));
  return `판 전체는 보지 못한다(보스가 판 보내기를 꺼둠). 아래는 이 대화에서 세희가 직접 다룬 항목뿐이다.\n${lines.join('\n') || '- 아직 없음'}`;
}
async function systemPrompt(){
  const now = new Date();
  const cal = [...Array(8)].map((_, i) => { const d = new Date(now); d.setDate(d.getDate() + i);
    return `${['오늘 ', '내일 ', '모레 '][i] || ''}${ymd(d)}(${WD[d.getDay()]})`; }).join(', ');
  const todayLabel = (secById('today') || secs()[0]).label, schedLabel = (secById('sched') || secs()[1] || secs()[0]).label;
  return `너는 '강세희'다. 사용자의 개인 비서이고 사용자를 '보스'라고 부른다. 앱 '세희'의 사무실 책상에 앉아 말풍선으로 대화한다.
말투: 존댓말. 짧고 건조하게, 대개 1~3문장. 과장·아부·이모지 없음. 가끔 무심한 농담. 모르는 건 모른다고 말한다.

/* 대화 기록 → API 메시지. 사용자로 시작하고, 같은 쪽이 이어지면 합친다. 판 작업 표시(a)는 빼고 */
function toMessages(log){
  const out = [], tail = log.slice(-24);
  /* 자료(해독본·문서) 전문은 보스의 최근 두 마디 안에 있을 때만. 그보다 오래되면 앞부분만 */
  const userIdx = tail.map((m, i) => m.who === 'u' ? i : -1).filter(i => i >= 0), lastTwo = userIdx.slice(-2);
  /* 오류로 답을 못 받은 말은 '그때 못 했다'고 표시 — 세희가 아직 숙제로 여겨 되묻지 않게 */
  const failed = new Set();
  userIdx.forEach((ui, k) => { const end = k + 1 < userIdx.length ? userIdx[k + 1] : tail.length, rest = tail.slice(ui + 1, end);
    if (rest.some(m => m.who === 's' && m.err) && !rest.some(m => m.who === 's' && !m.err && !m.hint)) failed.add(ui); });
  tail.forEach((m, i) => {
    if (m.err || m.hint || m.who === 'a') return;
    const role = m.who === 'u' ? 'user' : 'assistant';
    let text = role === 'user' ? userContent(m, lastTwo.includes(i) && (m.ocr !== undefined || !!m.doc)) : m.text;
    if (failed.has(i)) text += '\n(이 말은 그때 연결 오류로 처리하지 못했다. 보스가 다시 꺼내기 전에는 다시 묻지 않는다.)';
    const last = out[out.length - 1];
    if (last && last.role === role) last.content += '\n' + text; else out.push({ role, content:text });
  });
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}

function findGap(src, w, y0, y1){
  const cw = 160, k = cw / w, ch = Math.max(2, Math.round((y1 - y0) * k));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d', { willReadFrequently:true });
  x.drawImage(src, 0, y0, w, y1 - y0, 0, 0, cw, ch);
  const d = x.getImageData(0, 0, cw, ch).data, blank = [];
  for (let r = 0; r < ch; r++){

    for (let cx = 4; cx < cw - 4; cx++){ const i = (r * cw + cx) * 4, l = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10; if (l < mn) mn = l; if (l > mx) mx = l; }
    blank.push(mx - mn < 10);
  }
  for (let r = ch - 1; r >= 0; r--){
    if (!blank[r]) continue;
    let s = r; while (s > 0 && blank[s - 1]) s--;
    if (r - s + 1 >= 2) return y0 + Math.round(((s + r) / 2) / k);
    r = s;
  }

  const step = Math.max(200, Math.floor(maxH / scale)), cuts = [];
  let y = 0;
  while (y < h && cuts.length < 200){
    if (h - y <= step){ cuts.push({ y, h:h - y, ov:false }); break; }
    const gap = findGap(src, w, y + Math.floor(step * 0.62), y + step);
    if (gap > y){ cuts.push({ y, h:gap - y, ov:false }); y = gap; }
    else { cuts.push({ y, h:step, ov:true }); y = y + step - Math.floor(step * 0.14); }
  }

    // 구역(무리별 부채꼴), 등고선, 격자 좌표, 나침반

      under += `<line x1="${C}" y1="${C}" x2="${f(C + Math.cos(a0) * R)}" y2="${f(C + Math.sin(a0) * R)}" class="pp-border"/>`; });
    for (let i = 0; i < 7; i++){ const h = hs('c' + i), cx = (h % 1000) / 1000 * S, cy = ((h >> 10) % 1000) / 1000 * S;
      for (let j = 1; j <= 3; j++) under += `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(j * (18 + h % 23))}" ry="${f(j * (12 + (h >> 5) % 17))}" transform="rotate(${h % 180} ${f(cx)} ${f(cy)})" class="pp-contour"/>`; }
    for (let x = S / 8; x < S; x += S / 8) under += `<line x1="${f(x)}" y1="0" x2="${f(x)}" y2="${S}" class="pp-grid"/><line x1="0" y1="${f(x)}" x2="${S}" y2="${f(x)}" class="pp-grid"/>`;
    const cx = S - 46, cy = 46;
    under += `<g class="pp-compass" transform="translate(${cx} ${cy})"><circle r="26"/><path d="M0 -24 L5 0 L0 24 L-5 0 Z"/><path d="M-24 0 L0 -5 L24 0 L0 5 Z" class="lt"/><text y="-30">N</text></g>`;
  } else under += `<circle cx="${C}" cy="${C}" r="${S * 0.29}" class="pp-ring"/><circle cx="${C}" cy="${C}" r="${S * 0.39}" class="pp-ring"/>`;
  used.forEach(g => { const a = starts[g] + spans[g] / 2; svg += `<text x="${(C + Math.cos(a) * S * 0.47).toFixed(0)}" y="${(C + Math.sin(a) * S * 0.47).toFixed(0)}" class="pp-gl" fill="${GROUP_COLOR[g]}">${th === 'map' ? g + ' 구역' : g}</text>`; });
  const off = th === 'white' ? 54 : th === 'map' ? 30 : 0;
  for (const p of list){ const q = pos[p.id]; if (!q) continue; const d = Math.hypot(q.x - C, q.y - C) || 1; svg += path(C + (q.x - C) / d * off, C + (q.y - C) / d * off * (th === 'white' ? 0.8 : 1), q.x, q.y, 'pp-str', hs(p.id)); }
  const seen = new Set();
  for (const p of list) for (const id of (p.links || [])){ const k = [p.id, id].sort().join('-'); if (seen.has(k) || !pos[id]) continue; seen.add(k); svg += path(pos[p.id].x, pos[p.id].y, pos[id].x, pos[id].y, 'pp-lk', hs(k)); }
  if (th === 'white') svg += `<ellipse cx="${C}" cy="${C}" rx="62" ry="48" transform="rotate(-8 ${C} ${C})" class="pp-mecircle"/>`;
  $('ppMap').style.width = $('ppMap').style.height = S + 'px';
  $('ppMap').innerHTML = `<svg class="pp-svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${under}${svg}</svg>
    <div class="pp-me" style="left:${C}px;top:${C}px"><i class="pp-pin"></i><b>나</b><span>${th === 'map' ? '현위치' : '보스'}</span></div>
    ${list.map(p => { const q = pos[p.id]; return q ? `<div class="pp-node" data-pp="${p.id}" style="left:${q.x.toFixed(0)}px;top:${q.y.toFixed(0)}px;--c:${GROUP_COLOR[p.group]};--r:${((hs(p.id) % 7) - 3) * 1.4}deg"><i class="pp-pin"></i><div class="ph">${esc(p.name.slice(0, 1))}</div><b>${esc(p.name)}</b><span>${esc(p.rel || p.group)}</span></div>` : ''; }).join('')}
    ${list.length ? '' : `<div class="pp-empty" style="left:${C}px;top:${C + 70}px">아직 아무도 없어요.<br>「+ 사람」을 누르거나 세희에게 "○○을 인간관계 판에 추가해줘"라고 해 보세요.</div>`}`;
  $('ppCount').textContent = list.length ? `${list.length}명` : '';
  const sc = $('ppScroll'), fitK = sc.clientWidth > 80 ? Math.min(1, (sc.clientWidth - 8) / S, (sc.clientHeight - 8) / S) : 1;

(function panTab(){
  const t = $('panTab'); let g = null;
  t.addEventListener('pointerdown', e => { g = { x:e.clientX, t:performance.now(), moved:false }; try{ t.setPointerCapture(e.pointerId); }catch(x){} e.preventDefault(); });
  t.addEventListener('pointermove', e => {
    if (!g) return; const dx = Math.max(0, e.clientX - g.x); if (!g.moved && dx < 6) return; g.moved = true;
    const el = $('office'); el.style.transition = 'none'; el.style.transform = `translateX(${Math.round(dx)}px)`; el.style.opacity = String(Math.max(0.4, 1 - dx / 600));
  });
  const up = e => {
    if (!g) return; const dx = e.clientX - g.x, v = dx / Math.max(1, performance.now() - g.t), moved = g.moved; g = null;
    const el = $('office');
    const go = () => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); SWIPE.anim = 'slide-inL'; goView('pan'); };

/* ── 작업 중계 (v1.3.0) — 세희가 실제로 고치는 모습을 보여 준다 ──
   사무실에서 생각(… 점)하다가, 판을 고치기 시작하면 판이 밀려 들어오고, 고칠 줄에 형광펜이 그어지고, 새 줄은 한 글자씩 써진다.
   보고서는 문서가 열리고 문단이 위에서부터 차례로 나타나며, 고친 문단엔 형광펜. 설정 「작업 보여주기」로 끌 수 있다.
   질문(「작업 중 질문」): 필요할 때만(ask_boss 로 멈춰서 묻기) / 마지막에 한 번(기본) / 알아서(안 묻고 가정만 한 줄). */
const WORK = { active:false, batch:1, before:null, ask:null };
const workOn = () => AI.cfg.work !== false;
const askMode = () => AI.cfg.ask || 'end';
const PAN_TOOLS = ['add_item', 'update_item', 'complete_item', 'delete_item', 'file_inbox'];
const wpace = () => Math.max(260, Math.min(850, 2600 / Math.max(1, WORK.batch)));
const wsleep = ms => new Promise(r => setTimeout(r, ms));
function hl(el, cls = 'w-hl'){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 4200); }
async function typeInto(el, text, ms){
  if (!el) return; const t = String(text), n = t.length, step = Math.max(14, Math.min(55, ms / Math.max(1, n)));
  el.classList.add('w-caret'); el.textContent = '';
  for (let i = 1; i <= n; i += (n > 40 ? 2 : 1)){ el.textContent = t.slice(0, i); await wsleep(step); }
  el.textContent = t; el.classList.remove('w-caret');
}
async function workToPan(){
  if (curView() !== 'pan'){ setFace('talk'); SWIPE.anim = 'slide-inL'; goView('pan'); await wsleep(420); }

}
const itemEl = id => document.querySelector(`#main .it[data-id="${String(id || '').replace(/^#/, '')}"]`);
const WORK_LABEL = { add_item:'판에 적는 중', update_item:'판 고치는 중', complete_item:'끝낸 걸로 표시하는 중', delete_item:'판에서 지우는 중', file_inbox:'받은 것 정리하는 중',
  make_card:'보드에 쓰는 중', update_card:'보고서 고치는 중', add_person:'인간관계 판에 붙이는 중', update_person:'인간관계 판 고치는 중' };
async function workBefore(c){
  if (!workOn()) return;
  const a = c.args || {};
  if (O.live){ O.live.work = (WORK_LABEL[c.name] || '작업 중') + (a.text || a.title || a.name ? ' — ' + String(a.text || a.title || a.name).slice(0, 24) : ''); renderBoardTalk(); }

      if (sec){ sec.scrollIntoView({ block:'center', behavior:'smooth' }); await wsleep(180); hl(sec.querySelector('.sh') || sec, 'w-hl'); await wsleep(wpace() * 0.5); }
    } else {

    }

/* 멈춰서 묻기 — 판·사무실 대화 상자에 질문과 고를 것. 고르거나, 입력창에 쓰거나, 「알아서 해」 */

/* ── 계정·동기화 (v1.0) — 암호를 넣으면 그 사람의 판·대화·보드·설정이 어느 브라우저에서든 열린다 ──
   · 서버: sehee-sync (Cloudflare Worker + D1). 주소는 설정 → 계정에서 넣거나 ?sync=주소 로 한 번 열면 기억한다
   · 바뀐 것만 0.8초 뒤 바로 올린다(실시간 저장). 인터넷이 끊기면 모아 뒀다가 다시 올리고, 앱을 닫는 순간에도 한 번 더 보낸다
   · 한 사람은 한 기기에서만. 다른 기기에서 암호를 넣으면 여기는 다음 확인(20초 안) 때 닫힌다
   · 서버 기록으로 덮어쓰기 전에, 이 기기에 있던 기록은 'presync' 로 따로 남겨 둔다 */
const SYNC = { url:'', token:'', user:'', device:'', last:0, on:false, dead:false, busy:false, again:false, fails:0, timer:null, dirty:new Map(), gen:0 };
const SYNC_KV = ['settings', 'ai', 'usage', 'chat', 'board', 'ailog', 'people', 'dbg'];
const SYNC_LS = 'sehee-sync';
function deviceName(){
  const u = navigator.userAgent;
  const os = /Android/.test(u) ? (/Mobile/.test(u) ? '안드로이드 폰' : '안드로이드 태블릿') : /iPhone/.test(u) ? '아이폰' : /iPad/.test(u) ? '아이패드' : /Windows/.test(u) ? '윈도우 컴퓨터' : /Mac OS/.test(u) ? '맥' : /Linux/.test(u) ? '리눅스' : '기기';
  const br = /SamsungBrowser/.test(u) ? '삼성 인터넷' : /Edg\//.test(u) ? '엣지' : /Chrome\//.test(u) ? '크롬' : /Firefox\//.test(u) ? '파이어폭스' : /Safari\//.test(u) ? '사파리' : '';
  return (os + (br ? ' ' + br : '') + (matchMedia('(display-mode: standalone)').matches ? ' (앱)' : '')).trim();
}
function syncLoad(){
  try{ const o = JSON.parse(localStorage.getItem(SYNC_LS) || '{}'); Object.assign(SYNC, { url:o.url || '', token:o.token || '', user:o.user || '', device:o.device || '', last:o.last || 0 }); }catch(e){}
  try{ for (const k of JSON.parse(localStorage.getItem(SYNC_LS + '-dirty') || '[]')) SYNC.dirty.set(k, ++SYNC.gen); }catch(e){}
}
function syncKeep(){
  try{
    localStorage.setItem(SYNC_LS, JSON.stringify({ url:SYNC.url, token:SYNC.token, user:SYNC.user, device:SYNC.device, last:SYNC.last }));
    localStorage.setItem(SYNC_LS + '-dirty', JSON.stringify([...SYNC.dirty.keys()]));
  }catch(e){}
}
function syncBadge(state){
  const el = $('cloud'); if (!el) return;
  const map = { ok:['☁', '서버에 저장됨'], up:['☁…', '올리는 중'], wait:['☁!', '못 올림 — 다시 시도 중'], off:['', ''], dead:['☁✕', '다른 기기에서 열림'] };
  const [t, tip] = map[state] || map.off; el.textContent = SYNC.url && SYNC.token ? t : ''; el.title = tip; el.className = 'cloud ' + state;
}
function syncMark(key){
  if (!SYNC.on || SYNC.dead) return;
  SYNC.dirty.set(key, ++SYNC.gen); syncKeep();
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncFlush(), 800);
}
async function readLocal(k){
  if (k.startsWith('pan:')) return await getPan(k.slice(4));
  if (k.startsWith('kv:')) return await kvGet(k.slice(3));
}
const authH = () => ({ authorization:'Bearer ' + SYNC.token });
async function syncFlush(beacon){
  dlog('동기화', `↑ 올리기${beacon ? '(비콘)' : ''} · 바뀐 것 ${SYNC.dirty.size}개`);
  if (!SYNC.on || SYNC.dead || !SYNC.url || !SYNC.token || !SYNC.dirty.size) return;
  if (SYNC.busy && !beacon){ SYNC.again = true; return; }
  const snap = [...SYNC.dirty.entries()], puts = {}, dels = [];
  for (const [k] of snap){ const v = await readLocal(k); if (v === undefined || v === null) dels.push(k); else puts[k] = v; }
  const body = JSON.stringify({ puts, dels });
  if (beacon){
    /* 앱을 닫는 순간 — 작으면 한 번에 던진다(답은 못 받는다. 다음에 열 때 다시 올린다) */
    if (body.length < 60000 && navigator.sendBeacon) navigator.sendBeacon(SYNC.url + '/beacon?t=' + encodeURIComponent(SYNC.token), new Blob([body], { type:'text/plain' }));
    return;
  }
  SYNC.busy = true; syncBadge('up');
  try{
    const r = await fetch(SYNC.url + '/data', { method:'POST', headers:{ 'content-type':'application/json', ...authH() }, body });
    if (r.status === 401){ syncDead(await r.json().catch(() => ({}))); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    for (const [k, g] of snap) if (SYNC.dirty.get(k) === g) SYNC.dirty.delete(k);
    SYNC.last = Date.now(); SYNC.fails = 0; syncKeep(); syncBadge('ok');
  }catch(e){
    SYNC.fails++; syncBadge('wait');
    clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncFlush(), Math.min(30000, 1500 * 2 ** SYNC.fails));
  }finally{
    SYNC.busy = false;
    if (SYNC.again){ SYNC.again = false; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncFlush(), 300); }
  }
}
async function syncCheck(){
  try{
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(SYNC.url + '/session', { headers:authH(), signal:ctl.signal }); clearTimeout(t);
    if (r.ok) return { st:'ok' };
    if (r.status === 401){ const j = await r.json().catch(() => ({})); return { st:j.error === 'replaced' ? 'replaced' : 'out', device:j.device }; }
    return { st:'offline' };
  }catch(e){ return { st:'offline' }; }
}
/* 서버 기록 → 이 기기. 덮어쓰기 전에 이 기기 기록을 presync 로 남긴다 */
async function syncPull(){
  dlog('동기화', '↓ 서버에서 받기');
  const r = await fetch(SYNC.url + '/data', { headers:authH() });
  if (r.status === 401){ syncDead(await r.json().catch(() => ({}))); throw new Error('다른 기기에서 열렸어요'); }
  if (!r.ok) throw new Error('서버 응답 ' + r.status);
  const recs = (await r.json()).records || {}, keys = Object.keys(recs);
  if (!keys.length) return 0;
  const localPans = await allPans();
  if (localPans.length){
    const kv = {}; for (const n of SYNC_KV) kv[n] = await kvGet(n);
    const old = await kvGet('presync');
    if (!old || old.user !== SYNC.user) await tx('kv', 'readwrite', s => s.put({ at:Date.now(), user:SYNC.user, pans:localPans, kv }, 'presync'));
  }
  await tx('pans', 'readwrite', s => { s.clear(); for (const k of keys) if (k.startsWith('pan:') && recs[k].v && recs[k].v.date) s.put(recs[k].v); });
  await tx('kv', 'readwrite', s => { for (const n of SYNC_KV){ const rec = recs['kv:' + n]; if (rec) s.put(rec.v, n); else s.delete(n); } });
  SYNC.last = Date.now(); syncKeep();
  return keys.length;
}
/* 서버가 비어 있으면 이 기기 기록을 통째로 올린다 */
async function syncUploadAll(){
  for (const d of await allDates()) SYNC.dirty.set('pan:' + d, ++SYNC.gen);
  for (const n of SYNC_KV) if ((await kvGet(n)) !== undefined) SYNC.dirty.set('kv:' + n, ++SYNC.gen);
  syncKeep(); await syncFlush();
}
function syncDead(j){
  if (SYNC.dead) return;
  SYNC.dead = true; SYNC.on = false; clearTimeout(SYNC.timer); syncBadge('dead');
  const who = j && j.device ? `다른 기기(${j.device})` : '다른 기기';
  const el = document.createElement('div'); el.id = 'deadVeil';

  document.body.appendChild(el);

}
/* 화면이 보일 때마다, 그리고 20초마다 — 아직 내 차례인지 */
setInterval(async () => { if (SYNC.on && !SYNC.dead && !document.hidden){ const c = await syncCheck(); if (c.st === 'replaced' || c.st === 'out') syncDead({ error:c.st === 'replaced' ? 'replaced' : 'logged-out', device:c.device }); } }, 20000);
document.addEventListener('visibilitychange', async () => {
  if (!SYNC.on || SYNC.dead) return;
  if (document.hidden){ clearTimeout(SYNC.timer); syncFlush(true); }
  else { const c = await syncCheck(); if (c.st === 'replaced' || c.st === 'out') syncDead({ error:c.st === 'replaced' ? 'replaced' : 'logged-out', device:c.device }); else syncFlush(); }
});
window.addEventListener('pagehide', () => { if (SYNC.on && !SYNC.dead) syncFlush(true); });
window.addEventListener('online', () => { if (SYNC.on && !SYNC.dead) syncFlush(); });

/* ── 암호 화면 — 앱을 열 때 ── */
function pinScreen(note){
  return new Promise(resolve => {
    const el = document.createElement('div'); el.id = 'pinVeil';
    el.innerHTML = `<div class="pin"><div class="pin-t">세희 · 계정 열기</div><div class="pin-d" id="pinD"><i></i><i></i><i></i><i></i></div>
      <p class="pin-m" id="pinM">${esc(note || '암호 네 자리를 눌러 주세요')}</p>
      <div class="pin-k">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="skip" class="sm">이 기기만</button><button data-k="0">0</button><button data-k="del" class="sm">지우기</button></div></div>`;
    document.body.appendChild(el);
    let v = '', busy = false;
    const dots = () => $('pinD').querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < v.length));
    const msg = (t, bad) => { $('pinM').textContent = t; $('pinM').classList.toggle('bad', !!bad); };
    const done = r => { document.removeEventListener('keydown', onKey); el.remove(); resolve(r); };
    const go = async () => {
      busy = true; msg('여는 중…');
      try{
        const r = await fetch(SYNC.url + '/login', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ pin:v, device:deviceName() }) });
        const j = await r.json().catch(() => ({}));
        if (r.status === 429){ v = ''; dots(); msg(`너무 많이 틀려서 잠겼어요. ${Math.ceil((j.wait || 900) / 60)}분 뒤에 다시 해 주세요.`, true); busy = false; return; }
        if (!r.ok){ v = ''; dots(); el.querySelector('.pin').classList.add('shake'); setTimeout(() => el.querySelector('.pin').classList.remove('shake'), 400);
          msg(j.error === 'wrong' ? `암호가 틀렸어요${j.left ? ` · ${j.left}번 더 틀리면 15분 잠겨요` : ''}` : '서버가 이상해요: ' + (j.error || r.status), true); busy = false; return; }
        Object.assign(SYNC, { token:j.token, user:j.user, device:j.device, dead:false }); syncKeep();
        msg(`${j.user} 열었어요${j.prev ? ` · ${j.prev}는 닫혀요` : ''}`);
        if (j.records){ msg('기록 받는 중…'); await syncPull(); SYNC.on = true; }
        else { SYNC.on = true; msg('처음이라 이 기기 기록을 올리는 중…'); await syncUploadAll(); }
        syncBadge('ok'); done('in');
      }catch(e){ v = ''; dots(); msg('서버에 닿지 않아요. 인터넷을 확인하거나 「이 기기만」으로 열어 주세요.', true); busy = false; }
    };
    const press = k => {
      if (busy) return;
      if (k === 'skip'){ SYNC.on = false; done('local'); return; }
      if (k === 'del'){ v = v.slice(0, -1); dots(); return; }
      if (v.length >= 4) return;
      v += k; dots(); if (v.length === 4) go();
    };
    const onKey = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
    document.addEventListener('keydown', onKey);
    el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  });
}
/* 앱을 열 때 맨 먼저 — 저장소를 읽기 전에 계정을 정한다 */
async function syncStart(){

  if (!SYNC.url) return 'local';

      spStep('최신 기록 받는 중'); try{ await syncPull(); }catch(e){}

    note = c.st === 'replaced' ? `${c.device || '다른 기기'}에서 열려서 여기는 닫혔어요. 다시 열려면 암호를 눌러 주세요.` : '';

async function syncLogout(){

}
function syncLine(){

/* ── 오래 걸리는 일 (v0.7.2) — 긴 글 정리·캡처 해독 ──

   ② 얼어 있다 깨어나서 끊긴 요청은 실패로 세지 않고 다시 보내고,

const PG = { hides:0 };

async function cutTiles(files, signal, onP){

/* job.out[묶음] 에 읽은 글이 쌓인다. 이미 읽은 묶음은 건너뛴다 */
async function readTiles(job, signal, onP){

    while (k < todo.length){

}

/* PDF — 처음 쓸 때만 pdf.js 를 불러온다(앱에 같이 들어 있음) */
let PDFJS = null;
async function pdfjs(){
  if (!PDFJS){ PDFJS = await import('./lib/pdf.min.mjs'); PDFJS.GlobalWorkerOptions.workerSrc = new URL('lib/pdf.worker.min.mjs', location.href).href; }
  return PDFJS;
}
const MAX_SCAN_PAGES = 30;
async function readPdf(buf, onP){
  const lib = await pdfjs();
  const doc = await lib.getDocument({ data:new Uint8Array(buf), cMapUrl:new URL('lib/cmaps/', location.href).href, cMapPacked:true }).promise;
  const pages = [], n = doc.numPages;
  for (let i = 1; i <= n; i++){
    if (onP) onP(`글 뽑는 중 ${i}/${n}쪽`);
    const pg = await doc.getPage(i), tc = await pg.getTextContent();
    let s = '', lastY = null;
    for (const it of tc.items){ if (!('str' in it)) continue; const y = it.transform ? Math.round(it.transform[5]) : null; if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) s += '\n'; s += it.str; if (it.hasEOL) s += '\n'; lastY = y; }
    pages.push(s.replace(/\n{3,}/g, '\n\n').trim());
  }
  const chars = pages.join('').replace(/\s/g, '').length;
  if (chars >= 15 * n) return { text:pages.map((p, i) => `[${i + 1}쪽]\n${p}`).join('\n\n'), pages:n };
  /* 스캔본 — 쪽을 그림으로 */
  const imgs = [], m = Math.min(n, MAX_SCAN_PAGES);
  for (let i = 1; i <= m; i++){
    if (onP) onP(`스캔본이라 쪽을 그림으로 바꾸는 중 ${i}/${m}`);
    const pg = await doc.getPage(i), vp0 = pg.getViewport({ scale:1 }), vp = pg.getViewport({ scale:Math.min(3, 1400 / vp0.width) });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await pg.render({ canvasContext:cv.getContext('2d'), viewport:vp, canvas:cv }).promise;
    imgs.push(await new Promise(r => cv.toBlob(b => r(new File([b], `page-${i}.jpg`, { type:'image/jpeg' })), 'image/jpeg', 0.9)));
    cv.width = cv.height = 0;
  }
  return { scan:imgs, pages:n, cut:n > m };
}
/* 파일 하나 → { kind:'txt', text } 또는 { kind:'scan', files } */
async function readDocFile(f, onP){
  const r = await readDocRaw(f, onP);
  if (r.kind === 'txt') r.text = r.text.split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  return r;
}
async function readDocRaw(f, onP){
  const ext = extOf(f.name), buf = () => f.arrayBuffer();
  if (/^(txt|md|csv|tsv|json|xml)$/.test(ext) || /^text\/plain|^text\/csv|^application\/json/.test(f.type)) return { kind:'txt', text:await f.text() };
  if (/^html?$/.test(ext) || f.type === 'text/html'){ const d = new DOMParser().parseFromString(await f.text(), 'text/html'); d.querySelectorAll('script,style').forEach(x => x.remove()); return { kind:'txt', text:(d.body ? d.body.innerText || d.body.textContent : '').replace(/\n{3,}/g, '\n\n') }; }
  if (ext === 'docx') return { kind:'txt', text:await readDocx(await buf()) };
  if (ext === 'xlsx') return { kind:'txt', text:await readXlsx(await buf()) };
  if (ext === 'pptx') return { kind:'txt', text:await readPptx(await buf()) };
  if (ext === 'hwpx') return { kind:'txt', text:await readHwpx(await buf()) };
  if (ext === 'hwp') return { kind:'txt', text:await readHwp(await buf()) };
  if (ext === 'pdf' || f.type === 'application/pdf'){ const r = await readPdf(await buf(), onP); return r.scan ? { kind:'scan', files:r.scan, pages:r.pages, cut:r.cut } : { kind:'txt', text:r.text, pages:r.pages }; }
  if (OLD_EXT.test(f.name)) throw new Error('예전 형식이라 못 읽어요. 새 형식(docx·xlsx·pptx·hwpx)이나 PDF로 저장해서 주세요');
  throw new Error('읽을 수 없는 파일이에요');
}

  dlog('대화', `세희 ← [${r.f}] ${String(r.t).slice(0, 80)}`);
  O.log.push({ who:'s', text:r.t, face:r.f, at:Date.now(), ...(src && src.length ? { src } : {}) }); setFace(r.f);
  /* 적었다고 말했는데 이번 차례에 실제로 적힌 게 없으면 — 보스가 믿고 넘어가지 않게 알려 준다 */

    const acted = O.log.filter(m => m.who === 'a' && !m.read).length > O.turnActs;
    if (!acted && /(적어|넣어|올려|붙여)\s?(뒀|두었|놨|놓았|드렸)|적었|넣었|붙였|추가했/.test(r.t)) O.log.push({ who:'s', text:'⚠ 방금 말과 달리 이번엔 판·보드에 실제로 적힌 게 없어요. "적어줘"라고 한 번 더 말해 주세요.', face:5, at:Date.now(), hint:true });
    O.turnActs = undefined;

  /* 이번 대화에서 화이트보드 카드를 만들거나 고쳤으면 — 보드를 띄우고 그 카드를 반짝 */

    const id = BOARD.changed; BOARD.changed = null; CAL.changed = null;
    const isRep = ((BOARD.cards || []).find(x => x.id === id) || {}).kind === 'report';
    if (curView() === 'office') setTimeout(async () => { if (DW.open !== 'board') await dwOpen('board'); else boardRender(); setTimeout(() => { flashCard(id); if (isRep && RV.id !== id) rvOpen(id); }, 380); }, 60);
    else if (isRep && RV.id !== id) rvOpen(id);
    else toast('세희가 보드에 붙였어요 — 사무실 오른쪽 서류철');
  } else if (PPL.changed){
    const id = PPL.changed; PPL.changed = null; CAL.changed = null;
    if (curView() === 'office') setTimeout(async () => { if (DW.open !== 'people') await dwOpen('people'); else pplRender(); setTimeout(() => pplFlash(id), 380); }, 60);
  } else if (CAL.changed){
    const d = CAL.changed; CAL.changed = null;
    if (curView() === 'office') setTimeout(async () => { await dwOpen('cal'); const x = parseYmd(d); CAL.year = x.getFullYear(); calYear(); calMonth(x.getMonth(), true);
      setTimeout(() => { const c = document.querySelector(`#calSheet [data-d="${d}"]`); if (c){ c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); } }, 380); }, 60);
  }
}

  let ui = -1; for (let j = i - 1; j >= 0; j--) if (O.log[j].who === 'u'){ ui = j; break; }
  if (ui < 0) return;
  const um = O.log[ui];
  O.log.splice(i, 1);
  if (um.pics && !um.ocr){ O.log.push({ who:'s', text:'그 캡처는 읽기 전에 막혀서, 사진을 한 번 더 붙여 주셔야 해요.', face:5, at:Date.now(), err:false }); renderLog(); saveLog(); return; }
  O.turnActs = O.log.filter(x => x.who === 'a' && !x.read).length;
  O.busy = true; growSay(); setFace(2); renderLog(); await saveLog();
  const heavy = !!(um.pics || um.docs) || (um.text || '').length >= 300 || (um.text || '').split('\n').length >= 6;
  if (heavy){ const job = { at:Date.now(), msgAt:um.at, stage:'organize' }; await kvSet('job', job); await runJob(job, um); return; }

async function sendSay(src){

  if (heavy && aiReady()) askNotify();   /* 누른 순간에 물어야 폰이 허락 창을 띄워준다 */
  O.log.push(um); ta.value = ''; dlog('대화', `보스 → ${v.slice(0, 60)}${v.length > 60 ? '…(' + v.length + '자)' : ''}${um.pics ? ' · 사진 ' + um.pics : ''}${um.docs ? ' · 문서 ' + um.docs.length : ''}${heavy ? ' · 긴 작업' : ''}`);
  O.turnActs = O.log.filter(m => m.who === 'a' && !m.read).length;
  O.busy = true; growSay(); setFace(2); renderLog(); await saveLog();
  if (aiReady() && heavy){
    const job = { at:Date.now(), msgAt:um.at, stage:imgs.length ? 'read' : 'organize' };
    if (imgs.length){
      O.abort = new AbortController(); O.live = { text:'', t0:Date.now(), ocr:{ step:'사진 여는 중', done:0, total:0, chars:0 } }; renderLog();
      try{

        O.live = null; O.abort = null; O.busy = false; renderLog(); growSay(); saveLog(); return;

  else {
    await new Promise(r => setTimeout(r, 700 + Math.random() * 900));
    if (imgs.length || txts.length) seheeSays({ t:'사진이랑 파일은 머리가 있어야 읽어요. 설정에서 키부터요.', f:6 });
