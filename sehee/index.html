<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ece6d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세희">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>세희</title>
<style>
  :root{
    --paper:#ece6d4; --paper-deep:#e2dabf; --line:#c3b795; --ink:#2b2417; --ink-soft:#5c5340;
    --green:#5f7a55; --red:#a13b2c; --blue:#1B5FC1; --done:#8f8875; --card:#f8f4e8; --fs:1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:calc(15px * var(--fs))}
  body{
    margin:0; color:var(--ink);
    background:repeating-linear-gradient(var(--paper) 0,var(--paper) 30px,var(--paper-deep) 30px,var(--paper-deep) 31px);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    min-height:100vh; padding-bottom:calc(150px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit;color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 12px}

  /* 머리 — 위에 붙어 있다 */
  header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);
    padding:calc(6px + env(safe-area-inset-top)) 0 6px}
  .hrow{display:flex;align-items:center;gap:6px}
  .brand{font-family:"Noto Serif KR","Batang",serif;font-weight:700;font-size:1.15rem;letter-spacing:.5px;white-space:nowrap;flex:0 0 auto}
  .ver{font-size:.68rem;color:var(--ink-soft);margin-left:2px;white-space:nowrap;flex:0 0 auto}
  .saved{font-size:.72rem;color:var(--green);margin-left:auto;opacity:0;transition:opacity .4s}
  .saved.on{opacity:1}
  .ib{border:1px solid var(--ink-soft);background:transparent;border-radius:3px;min-width:36px;height:34px;
    padding:0 9px;font-size:.88rem;cursor:pointer}
  .ib:disabled{opacity:.3}
  .ib.on{background:var(--ink);color:var(--paper)}
  .gear{margin-left:6px;font-size:1.05rem}
  .nav{margin-top:6px}
  .day{flex:1 1 auto;min-width:0;text-align:center;border:none;background:none;font-family:"Noto Serif KR","Batang",serif;
    font-weight:700;font-size:1.08rem;cursor:pointer;padding:4px 2px;white-space:nowrap}
  .day small{font-family:-apple-system,sans-serif;font-weight:400;font-size:.7rem;color:var(--ink-soft);margin-left:4px}
  #pick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

  .band{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0;padding:8px 10px;border-radius:4px;font-size:.82rem;line-height:1.5}
  .band.on{display:flex}
  .band span{flex:1 1 180px}
  .band.old{border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--ink-soft)}
  .band.upd{border:1.5px solid var(--green);background:#e7ecdd;color:#33472d;font-weight:600}
  .band .ib{height:30px;font-size:.8rem;background:var(--paper)}

  /* 세희 */
  .sehee{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
  .fig{flex:0 0 auto;width:64px;text-align:center}
  .fig svg{display:block;margin:0 auto}
  .fig .cap{font-family:"Noto Serif KR","Batang",serif;font-size:.62rem;color:var(--ink-soft);margin-top:1px}
  .bubble{position:relative;flex:1 1 auto;min-width:0;background:#fdfcf8;border:1.5px solid #2b3a55;border-radius:16px;
    padding:10px 50px 10px 14px}
  .bubble::before,.bubble::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#2b3a55}
  .bubble::after{left:-6.5px;border-right-color:#fdfcf8}
  .bubble textarea{width:100%;border:none;background:transparent;resize:none;overflow:hidden;font:inherit;font-size:.9rem;
    line-height:1.55;color:#23304a;padding:0;min-height:1.55em}
  .bubble textarea:focus{outline:none}
  .stamp{position:absolute;right:9px;top:50%;transform:translateY(-50%) rotate(-8deg);width:34px;height:34px;border-radius:50%;
    border:1.8px solid var(--red);background:none;color:var(--red);font:600 .7rem ui-monospace,Consolas,monospace;
    letter-spacing:-.5px;padding:0;cursor:pointer}

  /* 받은 것 */
  .inbox{margin:14px 0;border:1.5px dashed var(--ink-soft);border-radius:6px;background:rgba(253,252,248,.75);padding:10px 10px 4px}
  .inbox h3{margin:0 0 6px;font-size:.92rem;display:flex;align-items:baseline;gap:6px}
  .inbox h3 small{font-weight:400;color:var(--ink-soft);font-size:.72rem}
  .ibx{border-top:1px dotted var(--line);padding:8px 0}
  .ibx:first-of-type{border-top:none}
  .ibtx{white-space:pre-wrap;word-break:break-word;font-size:.9rem;line-height:1.55;max-height:9.3em;overflow:hidden;position:relative}
  .ibtx.open{max-height:none}
  .ibmore{border:none;background:none;color:var(--blue);font-size:.75rem;padding:2px 0;cursor:pointer}
  .ibact{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:5px 9px;font-size:.76rem;cursor:pointer}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
  .chip.x{color:var(--red);border-color:transparent;background:none}

  /* 칸 */
  .sec{margin:14px 0;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:3px;
    box-shadow:0 1px 2px rgba(43,36,23,.12)}
  .sh{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .sh b{font-family:"Noto Serif KR","Batang",serif;font-size:.98rem;color:var(--c)}
  .sh .cnt{font-size:.75rem;color:var(--ink-soft)}
  .sh .fold{margin-left:auto;font-size:.75rem;color:var(--ink-soft)}
  .sec.folded .list,.sec.folded .add{display:none}
  .it{display:grid;grid-template-columns:34px 1fr 34px;align-items:start;gap:2px;padding:6px 6px 6px 4px;border-bottom:1px dotted var(--line)}
  .ck{width:26px;height:26px;margin:2px 4px 0;border-radius:50%;border:1.6px solid var(--ink-soft);background:#fff;cursor:pointer;padding:0;font-size:.85rem;line-height:1}
  .it.done .ck{background:var(--green);border-color:var(--green);color:#fff}
  .body{min-width:0;padding-top:3px}
  .tx{white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:.95rem;min-height:1.5em;cursor:text}
  .it.done .tx{text-decoration:line-through;color:var(--done)}
  .ed{width:100%;font:inherit;font-size:.95rem;line-height:1.5;border:1px solid var(--ink-soft);border-radius:3px;padding:3px 5px;
    resize:none;overflow:hidden;background:#fff;color:var(--ink)}
  .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .meta:empty{display:none}
  .tag{font-size:.7rem;font-weight:700;color:#fff;background:var(--c);border-radius:3px;padding:1px 6px}
  .age{font-size:.7rem;color:var(--ink-soft)}
  .more{border:none;background:none;font-size:1.1rem;color:var(--ink-soft);cursor:pointer;height:30px;padding:0}
  .add{display:flex;gap:6px;padding:7px 8px 9px}
  .add input{flex:1 1 auto;min-width:0;font:inherit;font-size:.92rem;border:none;border-bottom:1px dashed var(--line);background:transparent;padding:6px 2px}
  .add input:focus{outline:none;border-bottom-color:var(--ink)}
  .add .ib{height:32px;font-size:.8rem}
  .empty{padding:24px 10px;text-align:center;color:var(--ink-soft);font-size:.9rem;line-height:1.7}
  footer{margin:22px 0 0;font-size:.72rem;color:var(--ink-soft);line-height:1.6;text-align:center}

  /* 넘기기 단추 */
  .fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(var(--tb,58px) + 14px);z-index:30;
    border:none;border-radius:28px;background:#23304a;color:#fdfcf8;font-size:.98rem;font-weight:700;padding:14px 20px;
    box-shadow:0 4px 14px rgba(35,48,74,.4);cursor:pointer}

  /* 아래에서 올라오는 판 */
  .veil{position:fixed;inset:0;background:rgba(30,24,14,.38);z-index:40;display:none}
  .veil.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;background:var(--paper);
    border-radius:14px 14px 0 0;border-top:2px solid var(--ink);padding:14px 14px calc(18px + env(safe-area-inset-bottom));
    max-height:86vh;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
  .sheet.on{transform:none;visibility:visible;transition:transform .2s ease}
  .sheet h4{margin:0 0 10px;font-family:"Noto Serif KR","Batang",serif;font-size:1rem}
  .sheet .q{font-size:.85rem;color:var(--ink-soft);line-height:1.5;margin:0 0 10px;white-space:pre-wrap;word-break:break-word;
    max-height:4.6em;overflow:hidden}
  .sheet label.t{display:block;font-size:.75rem;color:var(--ink-soft);margin:12px 0 5px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sheet textarea.big{width:100%;min-height:150px;font:inherit;font-size:.92rem;line-height:1.55;border:1px solid var(--ink-soft);
    border-radius:4px;padding:8px;background:#fff;color:var(--ink);resize:vertical}
  .sheet .go{width:100%;margin-top:10px;height:44px;border:none;border-radius:6px;background:#23304a;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer}
  .sheet .danger{color:var(--red);border-color:var(--red)}
  .sheet .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .free{flex:1 1 120px;min-width:0;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:14px;padding:5px 10px;background:#fff}
  .note{font-size:.75rem;color:var(--ink-soft);line-height:1.6}
  .srow{display:flex;align-items:center;gap:6px;margin:6px 0}
  .srow input{flex:1 1 auto;min-width:0;font:inherit;font-size:.9rem;border:none;border-bottom:1px dashed var(--line);background:transparent;padding:5px 2px}
  .srow input:focus{outline:none;border-bottom-color:var(--ink)}
  .cdot{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;padding:0;flex:0 0 auto}
  .mini{border:1px solid var(--line);background:var(--card);border-radius:3px;width:32px;height:30px;cursor:pointer;font-size:.8rem}
  hr.s{border:none;border-top:1px solid var(--line);margin:14px 0}

  .toast{position:fixed;left:50%;bottom:calc(var(--tb,58px) + 76px);transform:translate(-50%,20px);opacity:0;
    pointer-events:none;z-index:50;background:#2b2417;color:#fdfcf8;border-radius:20px;padding:9px 14px;font-size:.85rem;
    display:flex;gap:12px;align-items:center;transition:all .2s;max-width:92vw}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{border:none;background:none;color:#f3d27a;font-weight:700;font-size:.85rem;padding:0;cursor:pointer}

  /* ── 아래 탭: 판 / 사무실 (v0.2) ── */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--paper);border-top:2px solid var(--ink);
    display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom)}
  .tabs button{flex:1 1 0;max-width:360px;border:none;background:none;padding:7px 0 8px;font-size:.8rem;color:var(--ink-soft);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
  .tabs button .ic{font-size:1.15rem;line-height:1.2}
  .tabs button.on{color:var(--ink);font-weight:700}
  .tabs button.on::before{content:"";position:absolute;top:-2px;left:30%;right:30%;height:3px;background:var(--red)}
  body.alt .nav, body.alt #old, body.alt #main, body.alt .fab{display:none!important}
  body.typing .tabs{display:none}
  /* 옆으로 밀어 판 ↔ 사무실 (v0.6.6) */
  #main, #office{touch-action:pan-y pinch-zoom}
  @keyframes inL{from{transform:translateX(-22%);opacity:.25}to{transform:none;opacity:1}}
  @keyframes inR{from{transform:translateX(22%);opacity:.25}to{transform:none;opacity:1}}
  .slide-inL{animation:inL .22s cubic-bezier(.2,.7,.3,1)}
  .slide-inR{animation:inR .22s cubic-bezier(.2,.7,.3,1)}

  /* ── 세희의 사무실 ── */
  #office{display:none;position:fixed;left:0;right:0;top:var(--hh,64px);bottom:var(--tb,58px);z-index:10;
    flex-direction:column;max-width:720px;margin:0 auto;background:#1d4650 url(art/bg-office.webp) center 30% / cover no-repeat}
  body.office #office{display:flex}
  body.typing #office{bottom:0}
  .log{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px}
  .log > :first-child{margin-top:auto}  /* 말이 적을 때도 세희 바로 위에 쌓이게 */
  .msg{max-width:80%;padding:9px 13px 6px;border-radius:16px;font-size:.95rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;position:relative}
  .msg time{display:block;font-size:.62rem;opacity:.55;margin-top:1px;text-align:right}
  .msg.s{align-self:flex-start;background:#fdfcf8;border:1.5px solid #2b3a55;color:#23304a;margin-left:6px}
  .msg.u{align-self:flex-end;background:#23304a;color:#fdfcf8;border:1.5px solid #23304a;margin-right:6px}
  .msg.u::after{content:"";position:absolute;right:-7px;bottom:10px;border:7px solid transparent;border-left-color:#23304a;border-right:0}
  /* 마지막 세희 말 — 꼬리가 아래 세희 쪽으로 */
  .msg.s.last{margin-bottom:12px;font-size:1rem}
  .msg.s.last::before,.msg.s.last::after{content:"";position:absolute;left:34px;top:100%;border:10px solid transparent;border-top-color:#2b3a55;border-bottom:0}
  .msg.s.last::after{left:36px;border-width:8px;border-top-color:#fdfcf8;margin-top:-1px}
  .msg.s:not(.last)::after{content:"";position:absolute;left:-7px;bottom:10px;border:7px solid transparent;border-right-color:#2b3a55;border-left:0}
  .msg.wait{display:flex;align-items:center;gap:9px;padding:10px 12px}
  .wait i{display:flex;gap:4px}
  .wait i span{width:7px;height:7px;border-radius:50%;background:#2b3a55;opacity:.3;animation:blink 1s infinite}
  .wait i span:nth-child(2){animation-delay:.2s}.wait i span:nth-child(3){animation-delay:.4s}
  .wait small{font-size:.72rem;color:var(--ink-soft)}
  .wait .stop{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:.72rem;padding:3px 9px;cursor:pointer;color:var(--red)}
  .msg.live{opacity:.92}
  .act{align-self:center;max-width:92%;font-size:.74rem;line-height:1.45;color:#33472d;background:rgba(231,236,221,.92);border:1px solid var(--green);
    border-radius:12px;padding:5px 11px;text-align:center}
  .act button{border:none;background:none;color:var(--blue);font-size:.72rem;padding:0 0 0 4px;cursor:pointer}
  .act.read{color:var(--ink-soft);background:rgba(255,255,255,.6);border-color:var(--line)}
  .act.undone{color:var(--done);border-color:var(--line);background:rgba(255,255,255,.5);text-decoration:line-through}
  .due{font-size:.72rem;color:#3a6b64;font-weight:600}
  .due.now{color:var(--red)} .due.past{color:var(--done);font-weight:400}
  .ailog{font:500 .7rem/1.6 ui-monospace,Consolas,monospace;color:var(--ink-soft);background:rgba(255,255,255,.55);border:1px solid var(--line);
    border-radius:4px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;max-height:12em;overflow:auto;margin:6px 0}
  @keyframes blink{50%{opacity:1}}
  /* 사무실 무대 — 세희(상반신) 뒤에 책상, 책상 위에 서류와 모니터 (v0.6.4) */
  .stage{--sh:min(310px,42dvh);flex:0 0 auto;position:relative;height:var(--sh);overflow:hidden;transition:height .2s}
  body.typing .stage{--sh:min(150px,22dvh)}
  .spr{position:absolute;left:50%;top:calc(var(--sh) * .03);height:calc(var(--sh) * .70);transform:translateX(-50%);
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));pointer-events:none}
  .desk{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sh) * .30);background:#5a4330 url(art/desk.webp) center top / 100% auto no-repeat;
    box-shadow:0 -2px 8px rgba(0,0,0,.25)}
  .plate{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#2b2417;color:#f3d27a;font:600 .68rem "Noto Serif KR","Batang",serif;
    padding:2px 10px;border-radius:2px;white-space:nowrap}
  body.typing .plate{display:none}
  .prop{position:absolute;bottom:calc(var(--sh) * .30 - 9px);pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .prop.papers{left:3%;width:min(26%,calc(var(--sh) * .42))}
  .prop.monitor{right:2%;width:min(30%,calc(var(--sh) * .48))}
  .scene{flex:0 0 auto;height:min(200px,30dvh);line-height:0;transition:height .2s}
  .scene{overflow:hidden}
  .scene svg{width:100%;height:100%;display:block;overflow:visible}
  body.typing .scene{height:min(110px,18dvh)}
  #seheeFace{transition:opacity .15s}
  .say{flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:flex-end;gap:7px}
  #office.drop{outline:3px dashed #f3d27a;outline-offset:-6px}
  /* ── v0.9 화면들: 달력 · 화이트보드 · 사람 ── */
  /* 컴퓨터·넓은 화면에서도 갤럭시 노트20 화면 비율(9:20) 그대로 — 가운데 폰 크기 틀 안에서 돈다 (v0.9.2)
     transform 을 주면 position:fixed 인 것들(머리·탭·사무실·시트·로딩)이 창이 아니라 이 틀에 붙는다 */
  @media (min-aspect-ratio: 10/19){
    html{background:#2b2a27;height:100%}
    body{width:min(100vw, calc(100dvh * 9 / 20));height:100dvh;margin:0 auto;overflow-y:auto;overflow-x:hidden;transform:translateZ(0);
      box-shadow:0 0 0 1px #111,0 12px 50px rgba(0,0,0,.6);scrollbar-width:thin}
  }
  /* 사무실 오른쪽 서류철 (v0.9.2) — 견출지가 튀어나와 있고, 누르거나 끌면 서류가 빠져나온다 */
  .log{padding-right:40px}
  .dw-tabs{position:absolute;right:0;top:7%;width:30px;z-index:14;display:flex;flex-direction:column;gap:7px;touch-action:none}
  .dw-tabs button{height:clamp(64px,12dvh,104px);border:1px solid rgba(0,0,0,.4);border-right:none;border-radius:9px 0 0 9px;background:var(--c);color:#fff;
    writing-mode:vertical-rl;font-size:.74rem;font-weight:700;letter-spacing:3px;cursor:grab;padding:0;transition:transform .15s,filter .15s;
    box-shadow:2px 3px 0 -1px #efe7d2,4px 6px 0 -1px #d9cfb4,-3px 3px 7px rgba(0,0,0,.35)}
  .dw-tabs button:hover{transform:translateX(-3px)}
  .dw-tabs button.on{transform:translateX(-5px);filter:brightness(1.15)}
  body.typing .dw-tabs{display:none}
  .dw{position:absolute;top:0;left:3%;right:30px;bottom:var(--sayh,64px);z-index:13;display:none;flex-direction:column;background:#fbf8ef;
    border:1px solid rgba(0,0,0,.4);border-right:none;border-radius:9px 0 0 9px;box-shadow:-12px 0 26px rgba(0,0,0,.4);transform:translateX(calc(100% + 40px));overflow:hidden}
  .dw.open{display:flex}
  .dw::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(#efe7d2 0 2px,#cfc4a6 2px 3px);opacity:.8;pointer-events:none}
  .dw-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 12px;background:var(--c);color:#fff;cursor:grab;touch-action:none;user-select:none}
  .dw-head b{font-size:.9rem;white-space:nowrap}.dw-head .dw-hint{font-size:.62rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dw-head .dw-x{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4)}
  .dw-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
  .cs-c.flash{animation:dayFlash 1.6s ease 2}
  @keyframes dayFlash{50%{background:#ffe08a}}
  .log{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
  .log::-webkit-scrollbar{width:6px}.log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:3px}.log::-webkit-scrollbar-track{background:transparent}
  /* 달력 — 책상 위 서류철 */
  #cal{max-width:960px;background:linear-gradient(#cdbf9c,#bfae86)}
  .cal-year{flex:1;overflow:auto;padding:10px 44px 14px 12px}
  .cy-head{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
  .cy-head b{font:700 1.15rem "Noto Serif KR","Batang",serif}
  .cy-head small{margin-left:auto;font-size:.72rem;color:var(--ink-soft)}
  .cy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .cy-m{background:#fbf8ef;border:1px solid #a89a76;border-radius:3px;padding:7px 7px 6px;cursor:pointer;box-shadow:0 2px 0 #a89a76}
  .cy-m:active{transform:translateY(1px)}
  .cy-t{font-weight:700;font-size:.82rem;margin-bottom:4px}
  .cy-d{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .cy-d i{font-style:normal;font-size:.56rem;text-align:center;line-height:1.55;color:var(--ink-soft);border-radius:50%}
  .cy-d i.ev{background:var(--c);color:#fff;font-weight:700}
  .cy-d i.today{outline:1.5px solid var(--red)}
  .cal-tabs{position:absolute;right:0;top:8px;bottom:8px;width:38px;display:flex;flex-direction:column;gap:2px;z-index:4;touch-action:none}
  .cal-tabs button{flex:1;border:1px solid #8c7d5a;border-right:none;border-radius:6px 0 0 6px;background:#e9dfc4;font-size:.62rem;color:var(--ink);padding:0;cursor:pointer;writing-mode:vertical-rl;letter-spacing:-1px}
  .cal-tabs button:nth-child(3n+2){background:#d9e3d2}.cal-tabs button:nth-child(3n){background:#ead6cf}
  .cal-tabs button.on{background:#fbf8ef;font-weight:700;margin-left:-6px}
  .cal-sheet{position:absolute;top:6px;bottom:6px;left:5%;right:38px;background:#fbf8ef;border:1px solid #8c7d5a;border-radius:4px 0 0 4px;box-shadow:-6px 4px 14px rgba(0,0,0,.25);
    transform:translateX(110%);transition:transform .3s cubic-bezier(.2,.8,.3,1);z-index:3;display:flex;flex-direction:column;padding:8px 10px;overflow:hidden}
  .cal-sheet.on{transform:none}
  .cal-sheet.flipR{animation:inR .25s ease}.cal-sheet.flipL{animation:inL .25s ease}
  .cs-ear{position:absolute;left:-1px;top:-1px;background:#a13b2c;color:#fff;font-size:.68rem;padding:2px 9px;border-radius:0 0 6px 0}
  .cs-head{display:flex;align-items:center;gap:8px;justify-content:center;margin:4px 0 6px}
  .cs-head b{font:700 1rem "Noto Serif KR","Batang",serif;min-width:8em;text-align:center}
  .cs-head [data-cal="close"]{position:absolute;right:8px;top:6px}
  .cs-wd,.cs-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cs-wd span{text-align:center;font-size:.7rem;color:var(--ink-soft);padding-bottom:3px}
  .cs-wd .sun{color:var(--red)}.cs-wd .sat{color:var(--blue)}
  .cs-grid{flex:1;grid-auto-rows:1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:0}
  .cs-c{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 2px 0;overflow:hidden;cursor:pointer;min-height:0;display:flex;flex-direction:column;gap:1px}
  .cs-c.off{background:rgba(0,0,0,.03);cursor:default}
  .cs-c.today{background:#fff4e8}.cs-c.today .n{color:var(--red);font-weight:700}
  .cs-c .n{font-size:.68rem}
  .cs-c .chip{display:block;font-size:.58rem;line-height:1.35;background:var(--c);color:#fff;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cs-c .chip.done{opacity:.45;text-decoration:line-through}
  .cs-c .more{font-size:.56rem;color:var(--ink-soft)}
  .cs-hint{font-size:.66rem;color:var(--ink-soft);text-align:center;margin:5px 0 0}
  .cal-day{position:absolute;left:5%;right:38px;bottom:6px;max-height:62%;background:#fffdf6;border:1px solid #8c7d5a;border-bottom:none;border-radius:10px 10px 0 0;
    box-shadow:0 -6px 16px rgba(0,0,0,.2);transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.3,1);z-index:5;display:flex;flex-direction:column;padding:10px 12px}
  .cal-day.on{transform:none}
  .cd-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}.cd-head b{font-size:.95rem}.cd-head .tg{font-size:.66rem;background:var(--red);color:#fff;border-radius:8px;padding:1px 7px}
  .cd-head [data-cal="dclose"]{margin-left:auto}
  .cd-list{overflow:auto;flex:1}
  .cd-it{display:grid;grid-template-columns:auto 1fr;gap:0 8px;border-left:4px solid var(--c);padding:5px 8px;margin-bottom:5px;background:#fff;border-radius:3px}
  .cd-it .t{font-size:.74rem;font-weight:700;color:var(--ink-soft)}.cd-it .x{font-size:.86rem}.cd-it .s{grid-column:2;font-size:.66rem;color:var(--ink-soft)}
  .cd-it.done .x{text-decoration:line-through;color:var(--done)}
  .cd-add{display:flex;gap:6px;margin-top:6px}.cd-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:.82rem;background:#fff}
  /* 화이트보드 */
  #board{max-width:1100px;background:#6b6257}
  .wb{flex:1;min-height:0;margin:8px 10px 0 8px;background:#f7f7f3;border:6px solid #c9ccd1;border-radius:6px;box-shadow:inset 0 0 30px rgba(0,0,0,.06);display:flex;flex-direction:column}
  .wb-head{display:flex;align-items:center;gap:8px;padding:6px 10px 2px}
  .wb-head b{font:700 .95rem "Noto Serif KR","Batang",serif}.wb-head span{font-size:.7rem;color:var(--ink-soft)}
  .wb-head button{margin-left:auto;border:1px dashed #8a8f99;background:transparent;border-radius:12px;font-size:.72rem;padding:3px 10px;cursor:pointer}
  .wb-grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px 12px;align-content:start}
  .wb-empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);font-size:.82rem;line-height:1.7;padding:30px 10px}
  .card{position:relative;background:#fffef9;border:1px solid #dad6c8;box-shadow:0 2px 5px rgba(0,0,0,.12);padding:12px 9px 6px;transform:rotate(calc(var(--r) * .35));cursor:pointer;min-width:0}
  .card.k-note{background:#fff7b8}.card.k-file{background:#eef3f7}.card.k-report{background:#fff;border-top:4px solid #a13b2c}
  .rp{font-size:.9rem;line-height:1.7}.rp-meta{font-size:.7rem;color:#777}.rp-t{font:700 1.15rem "Noto Serif KR","Batang",serif;margin:4px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b2417}
  .rp-sum{background:#f3efe2;border-left:4px solid #a13b2c;padding:7px 11px;margin:0 0 12px}.rp-sum b{font-size:.75rem;color:#a13b2c}.rp-sum p{margin:2px 0 0}
  .rp-s h3{font-size:.92rem;margin:12px 0 4px}.rp-s p{margin:0 0 6px}.rp-s ul{margin:2px 0 6px;padding-left:18px}
  .card .tape{position:absolute;top:-8px;left:50%;width:56px;height:16px;background:rgba(230,220,170,.75);transform:translateX(-50%) rotate(var(--r));box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .card .ch{font-weight:700;font-size:.8rem;margin-bottom:5px;line-height:1.35}
  .card .cm{font-size:.6rem;color:var(--ink-soft);margin-top:5px}
  .card.new{animation:cardIn .9s ease}
  @keyframes cardIn{0%{transform:scale(.6) rotate(-8deg);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:rotate(calc(var(--r) * .35))}}
  .ct{border-collapse:collapse;width:100%;font-size:.66rem}
  .ct th,.ct td{border:1px solid #d5d0bf;padding:2px 4px;text-align:left;vertical-align:top;word-break:break-all}
  .ct th{background:#efe9d6}
  .cl{margin:0;padding-left:16px;font-size:.7rem;line-height:1.5}
  .cn{font-size:.72rem;line-height:1.5;margin:0;white-space:pre-wrap;word-break:break-word}
  .cfile{font-size:.74rem;font-weight:600;margin-bottom:3px}
  .cc{width:100%;height:auto;display:block}
  .card small.more,.card-full small.more{display:block;font-size:.6rem;color:var(--ink-soft);margin-top:3px}
  .card-full{max-height:60vh;overflow:auto}
  .card-full .ct{font-size:.8rem}.card-full .cl{font-size:.88rem}
  .cf{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.82rem;line-height:1.55;margin:0}
  .bt{flex:0 0 auto;display:flex;align-items:flex-end;gap:6px;padding:8px 8px 0;max-height:34%}
  .bt-bub{flex:1;position:relative;background:#fdfcf8;border:1.5px solid #2b3a55;border-radius:14px;padding:8px 12px;max-height:100%;overflow:auto;margin-bottom:14px;font-size:.9rem;line-height:1.55}
  .bt-bub::after{content:"";position:absolute;right:-9px;bottom:18px;border:8px solid transparent;border-left-color:#2b3a55;border-right:0}
  .bt-u{font-size:.7rem;color:var(--ink-soft);margin-bottom:3px}
  .bt-s{white-space:pre-wrap;word-break:break-word}.bt-s.err{color:var(--red)}
  .bt-s.wait{display:flex;align-items:center;gap:8px}.bt-s.wait i{display:flex;gap:4px}
  .bt-s.wait i span{width:7px;height:7px;border-radius:50%;background:#2b3a55;opacity:.3;animation:blink 1s infinite}
  .bt-s.wait i span:nth-child(2){animation-delay:.2s}.bt-s.wait i span:nth-child(3){animation-delay:.4s}
  .bt-s.wait small{font-size:.72rem;color:var(--ink-soft)}
  .bt-s .src{display:block;margin-top:4px;font-size:.7rem;color:var(--ink-soft)}.bt-s .src a{color:var(--blue);text-decoration:none}
  .bt-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
  .bt-side img{height:clamp(84px,15dvh,140px);display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  .bt-side button{border:none;background:none;color:#f3d27a;font-size:.64rem;cursor:pointer;padding:2px 0 4px}
  body.typing .bt-side img{height:60px}
  .bt-say{display:none!important;flex:0 0 auto;gap:6px;align-items:flex-end;padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
  .bt-say textarea{flex:1;min-width:0;border:1.5px solid #23304a;border-radius:16px;padding:7px 12px;resize:none;font:inherit;font-size:.92rem;line-height:1.45;max-height:6.5em;background:#fff}
  .bt-say button{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:none;background:#23304a;color:#fff;font-size:1.05rem;cursor:pointer}
  .bt-say button:disabled{opacity:.35}
  /* 인간관계 판 — 아직 깡통 */
  #people{max-width:960px;background:#a97a4c radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.5px) 0 0/7px 7px}
  .pp{flex:1;overflow:auto;padding:16px 14px}
  .pp h3{margin:0 0 4px;font:700 1.05rem "Noto Serif KR","Batang",serif;color:#fff7e6;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .pp p{margin:0 0 14px;font-size:.78rem;color:#ffefd6}
  .pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
  .pp-c{position:relative;background:#fffdf6;padding:14px 10px 10px;text-align:center;box-shadow:0 3px 6px rgba(0,0,0,.25);transform:rotate(var(--r))}
  .pp-c::before{content:"";position:absolute;top:-5px;left:50%;width:12px;height:12px;border-radius:50%;background:#c0392b;transform:translateX(-50%);box-shadow:0 1px 2px rgba(0,0,0,.4)}
  .pp-c .face{width:56px;height:56px;border-radius:50%;background:#e6dcc6;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#a89a76}
  .pp-c .ln{height:7px;background:#ece5d3;border-radius:3px;margin:5px 8px}
  .pp-c .ln.s{margin:5px 24px}
  /* 첨부 줄 (v0.7) */
  .tray{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;width:min(88%,560px)}
  .tray[hidden]{display:none}
  .att{position:relative;display:inline-flex;align-items:center;border:1.5px solid #23304a;border-radius:8px;background:#fff;overflow:hidden}
  .att img{width:44px;height:58px;object-fit:cover;object-position:top;display:block}
  .att.doc{font-size:.74rem;padding:5px 26px 5px 9px;color:var(--ink)}
  .att.doc.reading{opacity:.7;font-style:italic}
  .att button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(35,48,74,.85);color:#fff;font-size:.6rem;line-height:18px;padding:0;cursor:pointer}
  .tray small{flex-basis:100%;text-align:right;font-size:.68rem;color:var(--ink-soft)}
  .saybub .clip{background:transparent;color:var(--ink);font-size:1.15rem;width:30px;margin-left:-8px}
  .msg .pics{display:flex;gap:4px;margin:2px 0 6px;flex-wrap:wrap}
  .msg .pics img{width:40px;height:54px;object-fit:cover;object-position:top;border-radius:5px;border:1px solid rgba(255,255,255,.4)}
  .msg .tag{display:block;font-size:.78rem;opacity:.85;margin-bottom:2px}
  .msg details.ocr{margin-top:6px;font-size:.8rem}
  .msg details.ocr summary{cursor:pointer;opacity:.85}
  .msg details.ocr pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.76rem;line-height:1.5;max-height:42vh;overflow:auto;
    background:rgba(255,255,255,.08);border-radius:8px;padding:7px 9px;margin:6px 0 4px}
  .msg details.ocr button{border:1px solid rgba(255,255,255,.4);background:transparent;color:inherit;border-radius:8px;font-size:.7rem;padding:2px 9px;cursor:pointer}
  .msg .src{display:block;margin-top:5px;font-size:.7rem;color:var(--ink-soft);white-space:normal}
  .msg .src a{color:var(--blue);text-decoration:none}
  /* 로딩 화면 (v0.7) — 그림 아래쪽(책상)을 기준으로 맞추고, 그 위 점 세 개를 깜빡인다 */
  #splash{position:fixed;inset:0;z-index:200;background:#10292f;overflow:hidden;transition:opacity .4s ease}
  #splash.out{opacity:0;pointer-events:none}
  .sp-wrap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);aspect-ratio:941/1672;height:100dvh;container-type:inline-size}  /* 폰은 양옆이 잘리고, 넓은 화면은 양옆이 어둡게 남는다 — 세희 얼굴은 늘 보인다 */
  .sp-wrap img{display:block;width:100%;height:100%}
  .sp-dots{position:absolute;left:49.97%;top:94.11%;transform:translate(-50%,-50%);display:flex;gap:2.15cqw}
  .sp-dots i{width:1.1cqw;height:1.1cqw;border-radius:50%;background:#ead5c5;opacity:.15;animation:spBlink 1.2s infinite ease-in-out}
  .sp-dots i:nth-child(2){animation-delay:.2s}.sp-dots i:nth-child(3){animation-delay:.4s}
  @keyframes spBlink{0%,100%{opacity:.15}35%{opacity:1}}
  .sp-status{position:absolute;left:0;right:0;top:96.3%;text-align:center;font-size:max(11px,2.5cqw);color:rgba(234,213,197,.72);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 9cqw;letter-spacing:.02em}
  .saybub{position:relative;display:flex;align-items:flex-end;gap:6px;width:min(88%,560px);background:#fff;border:1.5px dashed #23304a;
    border-radius:18px;padding:6px 6px 6px 14px}
  .saybub.has{border-style:solid}
  .saybub::after{content:"";position:absolute;right:-8px;bottom:12px;border:8px solid transparent;border-left-color:#23304a;border-right:0}
  .saybub textarea{flex:1 1 auto;min-width:0;border:none;background:transparent;resize:none;font:inherit;font-size:.95rem;line-height:1.5;
    padding:5px 0;max-height:7.5em;color:var(--ink)}
  .saybub textarea:focus{outline:none}
  .saybub button{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:none;background:#23304a;color:#fff;font-size:1.05rem;cursor:pointer}
  .saybub button:disabled{opacity:.35}
  .brain{margin-left:6px;border:1px solid var(--line);background:rgba(253,252,248,.9);border-radius:12px;
    padding:4px 9px;font-size:.72rem;color:var(--ink-soft);cursor:pointer;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  body:not(.office):not(.v-board) .brain{display:none}
  .brain.on{color:#33472d;border-color:var(--green);background:#e7ecdd}
  .msg.s.err{border-color:var(--red);color:var(--red)}
  .sheet select.free{border-radius:6px;padding:6px 8px}
  .keyin{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;border-radius:6px}
</style>
</head>
<body>
<div id="splash" aria-live="polite"><div class="sp-wrap"><img src="art/loading.webp" alt=""><div class="sp-dots"><i></i><i></i><i></i></div><div class="sp-status" id="spStatus">껍데기 여는 중</div></div></div>
<header>
  <div class="wrap">
    <div class="hrow">
      <span class="brand">세희</span><span class="ver" id="ver"></span>
      <span class="saved" id="saved">저장됨</span>
      <button class="brain" id="brain">머리 없음 · 깡통</button>
      <button class="ib gear" id="gear" aria-label="설정">⚙</button>
    </div>
    <div class="hrow nav">
      <button class="ib" id="prev" aria-label="이전 판">‹</button>
      <button class="day" id="day"></button>
      <input type="date" id="pick">
      <button class="ib" id="next" aria-label="다음 판">›</button>
      <button class="ib" id="today">오늘</button>
      <button class="ib" id="open" title="끝난 일 숨기기">열린 것만</button>
    </div>
    <div class="band upd" id="upd"><span>새 버전이 준비됐어요. 지금 쓰던 내용은 그대로 남아요.</span><button class="ib" id="updGo">업데이트</button></div>
    <div class="band old" id="old"><span>지난 판이에요. 여기서 고쳐도 오늘 판은 그대로예요.</span><button class="ib" id="oldGo">오늘 판으로</button></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fab">넘기기</button>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>

<section id="office" aria-label="세희의 사무실">
  <div class="log" id="log"></div>
  <div class="stage" id="stage">
    <img class="spr" id="seheeSpr" src="art/s-lean.webp" alt="강세희">
    <div class="desk"><span class="plate">강세희</span></div>
    <img class="prop papers" src="art/papers.webp" alt="">
    <img class="prop monitor" src="art/monitor.webp" alt="">
  </div>
  <div class="dw-tabs noswipe" id="dwTabs"><button data-dw="cal" style="--c:#3a6b64">달력</button><button data-dw="board" style="--c:#8a6d3b">보드</button><button data-dw="people" style="--c:#a13b2c">사람</button></div>
  <div class="dw noswipe" id="dw-cal" style="--c:#3a6b64"><div class="dw-head"><b>📅 달력</b><span class="dw-hint">머리를 잡고 오른쪽으로 끌면 닫혀요</span><button class="ib dw-x" aria-label="닫기">✕</button></div><div class="dw-body" id="cal">
  <div class="cal-year" id="calYear"></div>
  <div class="cal-tabs noswipe" id="calTabs"></div>
  <div class="cal-sheet noswipe" id="calSheet"></div>
  <div class="cal-day noswipe" id="calDay"></div>
</div></div>
  <div class="dw noswipe" id="dw-board" style="--c:#8a6d3b"><div class="dw-head"><b>📌 화이트보드</b><span class="dw-hint">머리를 잡고 오른쪽으로 끌면 닫혀요</span><button class="ib dw-x" aria-label="닫기">✕</button></div><div class="dw-body" id="board">
  <div class="wb"><div class="wb-head"><b>보드</b><span id="wbCount"></span><button id="wbMemo">+ 메모</button></div><div class="wb-grid" id="wbGrid"></div></div>
  <div class="bt"><div class="bt-bub" id="btBub"></div><div class="bt-side"><img id="btSpr" src="art/s-lean.webp" alt="강세희"><button id="btAll">대화 보기 ›</button></div></div>

const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dayDiff = (a,b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const WD = '일월화수목금토';
const dayLabel = s => { const d = parseYmd(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; };
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 저장소 (이 폰 안) ── */
let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open('sehee', 1);
    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('pans', { keyPath:'date' }); db.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); let out;
    const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const getPan   = d => tx('pans','readonly',  s => s.get(d));
const putPan   = p => tx('pans','readwrite', s => s.put(p));
const allPans  = () => tx('pans','readonly', s => s.getAll());
const allDates = () => tx('pans','readonly', s => s.getAllKeys());
const kvGet    = k => tx('kv','readonly',  s => s.get(k));
const kvSet    = (k,v) => tx('kv','readwrite', s => s.put(v,k));

/* ── 상태 ── */
const S = { settings:null, today:todayStr(), date:null, pan:null, dates:[], folded:{}, persisted:null, persistAsked:false };
const $ = id => document.getElementById(id);
const secs = () => S.settings.sections;
const secById = id => secs().find(s => s.id === id);

function emptyPan(date){ return { date, line:'', face:'-_-', items:[], inbox:[], carriedFrom:null, createdAt:Date.now(), updatedAt:Date.now() }; }

/* 오늘 판이 없으면 — 가장 최근 판에서 안 끝난 일과 받은 것을 그대로 이어받아 만든다 */
async function makeToday(date){
  const prevDate = S.dates.filter(d => d < date).sort().pop();
  const p = emptyPan(date);
  if (prevDate){
    const prev = await getPan(prevDate);
    const first = secs()[0].id;
    p.items = (prev.items || []).filter(it => !it.done).map(it => ({ ...it, sec: secById(it.sec) ? it.sec : first }));
    p.inbox = (prev.inbox || []).map(x => ({ ...x }));
    p.carriedFrom = prevDate;
  }
  await putPan(p);
  S.dates = (await allDates()).sort();
  return p;
}

async function goDate(date){
  await flush();
  let p = await getPan(date);
  if (!p && date === S.today) p = await makeToday(date);
  S.date = date; S.pan = p || null;
  render();
  window.scrollTo(0, 0); document.body.scrollTop = 0;
}

/* ── 저장 ── */
let saveT = null;
function touch(now){
  if (!S.pan) return;
  S.pan.updatedAt = Date.now();
  clearTimeout(saveT);
  if (now) return flush(true);
  saveT = setTimeout(() => flush(true), 350);
}
async function flush(force){
  if (!saveT && !force) return;
  clearTimeout(saveT); saveT = null;
  if (!S.pan) return;
  await putPan(S.pan);
  const el = $('saved'); el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1400);
  askPersist();
}
async function saveSettings(){ await kvSet('settings', S.settings); }
async function askPersist(){
  if (S.persistAsked) return; S.persistAsked = true;
  try{
    if (navigator.storage && navigator.storage.persist){
      S.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    }
  }catch(e){}
}

  $('day').innerHTML = esc(dayLabel(S.date)) + (S.date === S.today ? '<small>오늘</small>' : '');
  $('prev').disabled = !S.dates.some(d => d < S.date);
  $('next').disabled = S.date >= S.today;
  $('today').disabled = S.date === S.today;
  $('open').classList.toggle('on', !!S.settings.openOnly);
  $('old').classList.toggle('on', S.date !== S.today);
  $('fab').style.display = S.pan ? '' : 'none';

  const m = $('main');
  if (!S.pan){
    m.innerHTML = '<div class="empty">이 날은 판이 없어요.<br>세희가 쉬었거나, 아직 앱을 쓰기 전이에요.</div>' + footer();
    return;
  }
  m.innerHTML = seheeBlock() + inboxBlock() + secs().map(sectionBlock).join('') + footer();
  const ta = m.querySelector('#line'); if (ta) grow(ta);
}

function sectionBlock(s, i){
  /* 지운 칸에 있던 지난 판 항목은 첫 칸에 보여준다 — 안 보이게 사라지면 안 된다 */
  const known = new Set(secs().map(x => x.id));
  const all = S.pan.items.filter(it => it.sec === s.id || (i === 0 && !known.has(it.sec)));
  const open = all.filter(it => !it.done), done = all.filter(it => it.done);
  const shown = S.settings.openOnly ? open : open.concat(done);
  const folded = S.folded[s.id];
  return `<section class="sec ${folded ? 'folded' : ''}" style="--c:${s.color}" data-sec="${s.id}">
    <div class="sh" data-act="fold"><b>${esc(s.label)}</b><span class="cnt">${open.length}${done.length ? ' · 끝남 ' + done.length : ''}</span><span class="fold">${folded ? '펼치기' : '접기'}</span></div>
    <div class="list">${shown.map(itemRow).join('')}</div>
    <div class="add"><input placeholder="+ 적기" enterkeyhint="enter" data-sec="${s.id}"><button class="ib" data-act="add">넣기</button></div>
  </section>`;
}

function itemRow(it){

  return `<div class="it ${it.done ? 'done' : ''}" data-id="${it.id}">

}

function grow(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

/* ── 알림 ── */
let toastT = null, undoFn = null;
function toast(msg, undo){
  $('toastMsg').textContent = msg; undoFn = undo || null;
  $('toastUndo').style.display = undo ? '' : 'none';
  $('toast').classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => { $('toast').classList.remove('on'); undoFn = null; }, undo ? 5000 : 2200);
}
$('toastUndo').onclick = () => { const f = undoFn; undoFn = null; $('toast').classList.remove('on'); if (f) f(); };

/* ── 항목 다루기 ── */
const findItem = id => S.pan.items.find(it => it.id === id);
function snapshot(){ return JSON.stringify({ items:S.pan.items, inbox:S.pan.inbox }); }
function restore(snap){ const o = JSON.parse(snap); S.pan.items = o.items; S.pan.inbox = o.inbox; touch(true); render(); }

function addItem(sec, text){
  text = text.trim(); if (!text) return;
  S.pan.items.push({ id:uid(), sec, text, tag:null, done:false, since:S.pan.date });
  touch(true);
}

function startEdit(row){
  const it = findItem(row.dataset.id); if (!it) return;
  const tx = row.querySelector('.tx');
  const ta = document.createElement('textarea'); ta.className = 'ed'; ta.value = it.text; ta.rows = 1;
  tx.replaceWith(ta); grow(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener('input', () => grow(ta));
  ta.addEventListener('blur', () => {
    const v = ta.value.trim();
    if (!v){ const snap = snapshot(); S.pan.items = S.pan.items.filter(x => x.id !== it.id); touch(true); render(); toast('지웠어요', () => restore(snap)); return; }
    if (v !== it.text){ it.text = v; touch(true); }
    render();
  }, { once:true });
}

$('sheet').addEventListener('click', e => {
  const b = e.target.closest('[data-mact]'); if (!b) return;
  const it = findItem($('sheet').dataset.item); if (!it) return closeSheet();
  const a = b.dataset.mact;
  if (a === 'tag'){ it.tag = b.dataset.v || null; }
  else if (a === 'nodue'){ it.due = null; it.time = null; }
  else if (a === 'freetag'){ const v = $('freeTag').value.trim(); it.tag = v || null; }
  else if (a === 'move'){ const snap = snapshot(); it.sec = b.dataset.v; touch(true); closeSheet(); render(); toast(`'${secById(b.dataset.v).label}'(으)로 옮겼어요`, () => restore(snap)); return; }
  else if (a === 'del'){ const snap = snapshot(); S.pan.items = S.pan.items.filter(x => x !== it); touch(true); closeSheet(); render(); toast('지웠어요', () => restore(snap)); return; }
  touch(true); closeSheet(); render();
});

  setTimeout(() => $('passText').focus(), 220);

    receive(parts);
    closeSheet();
  };

/* 받은 것은 언제나 오늘 판에 들어간다 */
async function receive(parts){
  if (S.date !== S.today) await goDate(S.today);
  for (const t of parts) S.pan.inbox.push({ id:uid(), text:t, at:Date.now() });
  touch(true); render();
  toast(parts.length > 1 ? `받은 것에 ${parts.length}개 들어왔어요` : '받은 것에 들어왔어요');
}

/* ── 세희 머리 (v0.3) — 사용자가 가져온 API 키(BYOK)로 폰에서 바로 부른다. 서버 없음 ──

const WEB_TOOL = { type:'web_search_20250305', name:'web_search', max_uses:3, user_location:{ type:'approximate', country:'KR', timezone:'Asia/Seoul' } };
function webOn(){ const v = (AI.cfg.web || {})[AI.cfg.provider]; return v === undefined ? true : v; }

const saveAi = () => kvSet('ai', AI.cfg);
const aiKey = () => AI.cfg && AI.cfg.keys[AI.cfg.provider];
const aiModel = () => AI.cfg && AI.cfg.models[AI.cfg.provider];
const aiReady = () => !!(aiKey() && aiModel());
/* 콘솔 키 목록과 같은 모양(앞 14자…끝 4자)으로 보여준다 — 둘을 눈으로 맞춰볼 수 있게 */
const mask = k => k.length > 22 ? k.slice(0, 14) + '…' + k.slice(-4) : /\.\.\.|…/.test(k) ? k : k.length > 8 ? k.slice(0, 4) + '…' + k.slice(-2) : '••••';
function keyNote(){
  const k = aiKey(); if (!k) return '저장된 키가 없어요.';
  const w = keyCheck(k);
  return `저장된 키: ${esc(mask(k))} (${k.length}자)` + (w.startsWith('⚠') ? ' — ' + esc(w) : '') + (AI.cfg.provider === 'anthropic' && AI.cfg.auth ? ` · 인증 방식 ${AI.cfg.auth === 'bearer' ? 'Bearer' : 'x-api-key'}` : '');
}
/* 복사할 때 딸려 오는 빈칸·줄바꿈·보이지 않는 글자·따옴표를 걷어낸다 */
const cleanKey = v => String(v || '').replace(/[\s\u200B-\u200D\uFEFF\u00A0]/g, '').replace(/^["'`]+|["'`]+$/g, '');
function keyCheck(v){
  if (!v) return '';
  if (/\.\.\.|…|•/.test(v)) return `⚠ 가운데가 가려진 키예요 (${v.length}자). 콘솔 목록에 보이는 건 진짜 키가 아니에요. 새로 만들 때 한 번만 나오는 전체 키를 복사해야 해요`;
  const bad = v.match(/[^A-Za-z0-9_\-]/);
  if (bad) return `⚠ 키에 들어갈 수 없는 글자 「${bad[0]}」가 섞였어요 (${v.length}자)`;
  if (AI.cfg.provider === 'anthropic'){
    if (/^apikey_/.test(v)) return '⚠ 이건 키 ID예요. 진짜 키는 sk-ant- 로 시작해요';
    if (!/^sk-ant-/.test(v)) return `⚠ sk-ant- 로 시작하지 않아요. 키가 아닌 걸 복사한 것 같아요 (${v.length}자)`;
    if (v.length < 60) return `⚠ ${v.length}자밖에 안 돼요. 진짜 키는 100자 안팎이에요. 일부만 복사된 것 같아요`;
  }
  return `${v.length}자 · ${mask(v)} — 콘솔 목록의 앞뒤 글자와 같으면 맞는 키예요`;
}
function modelOptions(){
  const list = (AI.cfg.lists[AI.cfg.provider] || []), cur = aiModel();

  return list.map(m => `<option value="${esc(m.id)}" ${m.id === cur ? 'selected' : ''}>${esc(m.name)} · ${esc(m.id)}</option>`).join('');
}

function errText(j, r){ return (j && j.error && (j.error.message || j.error.status)) || `HTTP ${r.status}`; }
async function fetchJson(url, opt, ms){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 60000);
  try{
    const r = await fetch(url, { ...opt, signal:ctl.signal });
    let j = null; try{ j = await r.json(); }catch(e){}
    if (!r.ok){ const e = new Error(errText(j, r)); e.status = r.status; throw e; }
    return j;
  }catch(err){ if (err.name === 'AbortError') throw new Error('시간이 너무 걸려서 끊었어요'); throw err; }
  finally{ clearTimeout(t); }
}
/* 인증: 문서 기본인 Authorization: Bearer 먼저, 401이면 예전 방식 x-api-key 로 한 번 더. 되는 쪽을 기억한다 */
const anthAuth = () => AI.cfg.auth || 'bearer';
const otherAuth = m => m === 'bearer' ? 'xkey' : 'bearer';
function anthHeaders(key, mode){
  const h = { 'content-type':'application/json', 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' };
  if ((mode || anthAuth()) === 'bearer') h.authorization = 'Bearer ' + key; else h['x-api-key'] = key;
  return h;
}
/* 칸에 있는 키를 저장하고 바로 모델 목록으로 확인. 칸 위 글씨로 결과를 알린다 */
async function saveKeyFromInput(){

    const role = m.who === 'u' ? 'user' : 'assistant';
    const text = role === 'user' ? userContent(m, recentHeavy.includes(i)) : m.text;

function findGap(src, w, y0, y1){
  const cw = 160, k = cw / w, ch = Math.max(2, Math.round((y1 - y0) * k));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;

  const d = x.getImageData(0, 0, cw, ch).data, blank = [];
  for (let r = 0; r < ch; r++){

    for (let cx = 4; cx < cw - 4; cx++){ const i = (r * cw + cx) * 4, l = (d[i] * 3 + d[i + 1] * 6 + d[i + 2]) / 10; if (l < mn) mn = l; if (l > mx) mx = l; }
    blank.push(mx - mn < 10);
  }
  for (let r = ch - 1; r >= 0; r--){
    if (!blank[r]) continue;
    let s = r; while (s > 0 && blank[s - 1]) s--;

    r = s;
  }

    if (gap > y){ cuts.push({ y, h:gap - y, ov:false }); y = gap; }

async function readPdf(buf, onP){
  const lib = await pdfjs();

  const pages = [], n = doc.numPages;

    if (onP) onP(`글 뽑는 중 ${i}/${n}쪽`);
    const pg = await doc.getPage(i), tc = await pg.getTextContent();
    let s = '', lastY = null;
    for (const it of tc.items){ if (!('str' in it)) continue; const y = it.transform ? Math.round(it.transform[5]) : null; if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) s += '\n'; s += it.str; if (it.hasEOL) s += '\n'; lastY = y; }

  if (chars >= 15 * n) return { text:pages.map((p, i) => `[${i + 1}쪽]\n${p}`).join('\n\n'), pages:n };
  /* 스캔본 — 쪽을 그림으로 */

    if (onP) onP(`스캔본이라 쪽을 그림으로 바꾸는 중 ${i}/${m}`);
    const pg = await doc.getPage(i), vp0 = pg.getViewport({ scale:1 }), vp = pg.getViewport({ scale:Math.min(3, 1400 / vp0.width) });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);

    imgs.push(await new Promise(r => cv.toBlob(b => r(new File([b], `page-${i}.jpg`, { type:'image/jpeg' })), 'image/jpeg', 0.9)));

  if (ext === 'docx') return { kind:'txt', text:await readDocx(await buf()) };
  if (ext === 'xlsx') return { kind:'txt', text:await readXlsx(await buf()) };
  if (ext === 'pptx') return { kind:'txt', text:await readPptx(await buf()) };
  if (ext === 'hwpx') return { kind:'txt', text:await readHwpx(await buf()) };
  if (ext === 'hwp') return { kind:'txt', text:await readHwp(await buf()) };

    <h2 class="rp-t">${esc(c.title)}</h2>${c.summary ? `<div class="rp-sum"><b>요약</b><p>${esc(c.summary)}</p></div>` : ''}
    ${(c.sections || []).map((x, i) => `<section class="rp-s"><h3>${i + 1}. ${esc(x.heading)}</h3>${x.text ? x.text.split(/\n+/).map(t => `<p>${esc(t)}</p>`).join('') : ''}
      ${x.points && x.points.length ? `<ul>${x.points.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${x.rows && x.rows.length ? tableHtml({ columns:x.cols, rows:x.rows }, 0) : ''}</section>`).join('')}</article>`;
}
function reportText(c){
  const L = [c.title, ''];
  if (c.summary) L.push('요약', c.summary, '');
  (c.sections || []).forEach((x, i) => { L.push(`${i + 1}. ${x.heading}`); if (x.text) L.push(x.text); for (const t of x.points || []) L.push('· ' + t);
    if (x.rows && x.rows.length) for (const r of [x.cols || [], ...x.rows].filter(r => r.length)) L.push(r.join('\t')); L.push(''); });
  if (c.basis) L.push('근거: ' + c.basis);
  return L.join('\n').trim();
}
function cardBody(c, full){
  if (c.kind === 'report') return full ? reportHtml(c) : `<p class="cn rp-pv">${esc((c.summary || '').slice(0, 150))}</p><small class="more">보고서 · 섹션 ${(c.sections || []).length}개</small>`;
  if (c.kind === 'table') return tableHtml(c, full ? 0 : 5);
  if (c.kind === 'list') return `<ul class="cl">${(full ? c.items || [] : (c.items || []).slice(0, 6)).map(x => `<li>${esc(x)}</li>`).join('')}</ul>${!full && (c.items || []).length > 6 ? `<small class="more">${c.items.length}개</small>` : ''}`;
  if (c.kind === 'chart') return chartSvg(c, full ? 340 : 200, full ? 200 : 120);
  if (c.kind === 'file') return full ? `<pre class="cf">${esc(c.text || '')}</pre>` : `<div class="cfile">📄 ${esc(c.name || c.title)}</div><p class="cn">${esc((c.text || '').slice(0, 140))}</p><small class="more">${(c.text || '').length.toLocaleString('ko-KR')}자${c.pages ? ` · ${c.pages}쪽` : ''}</small>`;
  return full ? `<pre class="cf">${esc(c.text || '')}</pre>` : `<p class="cn">${esc((c.text || '').slice(0, 200))}</p>`;
}
async function boardOpen(){
  await boardLoad();
  if (!O.loaded){ O.log = (await kvGet('chat')) || []; O.loaded = true; }
  boardRender(); renderBoardTalk(); bdGrow();
}
function boardRender(){
  const cs = BOARD.cards || [];
  $('wbCount').textContent = cs.length ? `카드 ${cs.length}장` : '';
  $('wbGrid').innerHTML = cs.length ? cs.map(c => `<div class="card k-${c.kind}" data-card="${c.id}" style="--r:${tapeRot(c.id)}deg"><i class="tape"></i><div class="ch">${esc(c.title)}</div>${cardBody(c, false)}<div class="cm">${c.by === 'boss' ? '보스' : c.kind === 'file' ? '받은 문서' : '세희'} · ${new Date(c.edited || c.at).getMonth() + 1}/${new Date(c.edited || c.at).getDate()}</div></div>`).join('')
    : `<div class="wb-empty">아직 붙은 게 없어요.<br>세희에게 "이번 주 일정 표로 정리해줘" 같은 걸 시키거나, 문서를 넘기면 여기 붙어요.</div>`;
}
function flashCard(id){ const el = document.querySelector(`[data-card="${id}"]`); if (!el) return; el.scrollIntoView({ block:'nearest', behavior:'smooth' }); el.classList.remove('new'); void el.offsetWidth; el.classList.add('new'); }
function renderBoardTalk(){
  if (DW.open !== 'board') return;
  const lastU = [...O.log].reverse().find(m => m.who === 'u'), lastS = [...O.log].reverse().find(m => m.who === 's');
  let h = '';
  if (lastU) h += `<div class="bt-u">보스 · ${esc((lastU.text || (lastU.pics ? '📷 사진 ' + lastU.pics + '장' : lastU.docs ? '📄 ' + lastU.docs.join(', ') : '')).slice(0, 90))}</div>`;
  if (O.busy && O.live) h += O.live.text ? `<div class="bt-s">${esc(parseFace(O.live.text).t)}</div>` : `<div class="bt-s wait"><i><span></span><span></span><span></span></i><small>${esc(waitText())}</small></div>`;
  else if (lastS) h += `<div class="bt-s${lastS.err ? ' err' : ''}">${esc(lastS.text)}${lastS.src && lastS.src.length ? `<span class="src">출처 ${lastS.src.map(x => `<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t || hostOf(x.u))}</a>`).join(' · ')}</span>` : ''}</div>`;
  else h += '<div class="bt-s">카드를 누르면 크게 보여요. 물어보시면 브리핑할게요.</div>';
  $('btBub').innerHTML = h; $('btBub').scrollTop = $('btBub').scrollHeight;
  const f = O.busy ? (O.live && O.live.faced ? 'talk' : 2) : (lastS ? lastS.face : 0), src = FACE(f);
  if ($('btSpr').getAttribute('src') !== src) $('btSpr').setAttribute('src', src);
}
setInterval(() => { if (O.busy && DW.open === 'board' && !(O.live && O.live.text)) renderBoardTalk(); }, 1000);
const tsvOf = c => c.kind === 'report' ? reportText(c) : c.kind === 'table' ? [c.columns || [], ...(c.rows || [])].filter(r => r.length).map(r => r.map(x => String(x).replace(/[\t\n]/g, ' ')).join('\t')).join('\n')
  : c.kind === 'list' ? (c.items || []).map(x => '• ' + x).join('\n') : c.kind === 'chart' ? (c.labels || []).map((l, i) => `${l}\t${(c.values || [])[i] ?? ''}`).join('\n') : (c.text || '');
function csvOf(c){
  const rows = c.kind === 'table' ? [c.columns || [], ...(c.rows || [])].filter(r => r.length) : c.kind === 'chart' ? (c.labels || []).map((l, i) => [l, (c.values || [])[i]]) : (c.items || [c.text || '']).map(x => [x]);
  return '﻿' + rows.map(r => r.map(x => { const s = String(x ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
}
function cardSheet(id){
  const c = (BOARD.cards || []).find(x => x.id === id); if (!c) return;
  openSheet(`<h4>${esc(c.title)}</h4><div class="card-full k-${c.kind}">${cardBody(c, true)}</div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:6px">
      <button class="chip" data-bact="copy" data-id="${c.id}">${c.kind === 'table' ? '표 복사 (엑셀에 붙여넣기)' : '글 복사'}</button>
      ${c.kind === 'report' ? `<button class="chip" data-bact="print" data-id="${c.id}">인쇄 · PDF로 저장</button>` : ''}
      ${c.kind === 'table' || c.kind === 'chart' ? `<button class="chip" data-bact="csv" data-id="${c.id}">엑셀 파일(CSV) 받기</button>` : ''}
      <button class="chip" data-bact="brief" data-id="${c.id}">세희 브리핑</button>
      <button class="chip danger" data-bact="del" data-id="${c.id}">떼기</button>
    </div><p class="note" id="bnote"></p>`);
}
$('wbGrid').addEventListener('click', e => { const el = e.target.closest('[data-card]'); if (el) cardSheet(el.dataset.card); });
$('sheet').addEventListener('click', async e => {
  const b = e.target.closest('[data-bact]'); if (!b) return;
  const c = (BOARD.cards || []).find(x => x.id === b.dataset.id); if (!c) return;
  const a = b.dataset.bact;
  if (a === 'copy') navigator.clipboard.writeText(tsvOf(c)).then(() => { $('bnote').textContent = '복사했어요. 엑셀·시트·카톡에 붙여넣으면 돼요.'; }, () => { $('bnote').textContent = '복사가 막혔어요.'; });
  else if (a === 'csv'){ const u = URL.createObjectURL(new Blob([csvOf(c)], { type:'text/csv;charset=utf-8' })), l = document.createElement('a'); l.href = u; l.download = (c.title.replace(/[\\/:*?"<>|]/g, '') || 'sehee') + '.csv'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
  else if (a === 'print'){
    const w = window.open('', '_blank'); if (!w){ $('bnote').textContent = '새 창이 막혔어요.'; return; }
    w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(c.title)}</title><style>${REPORT_CSS}body{margin:28px auto;max-width:720px;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#222}</style></head><body>${reportHtml(c)}<script>setTimeout(()=>print(),300)<\/script></body></html>`);
    w.document.close();
  }
  else if (a === 'brief'){ closeSheet(); $('sayText').value = `'${c.title}' 카드 브리핑해줘`; sendSay(); }
  else if (a === 'del'){
    if (!b.textContent.includes('한 번 더')){ b.textContent = '한 번 더 누르면 떼요'; return; }
    BOARD.cards = BOARD.cards.filter(x => x !== c); await boardSave(); closeSheet(); boardRender();
  }
});
$('wbMemo').onclick = () => {
  openSheet(`<h4>메모 붙이기</h4><input class="free" id="memoT" placeholder="제목"><textarea class="big" id="memoX" placeholder="내용"></textarea><div class="row" style="margin-top:8px"><button class="chip" data-bact2="memo">붙이기</button></div>`);
};
$('sheet').addEventListener('click', async e => {
  const b = e.target.closest('[data-bact2="memo"]'); if (!b) return;
  const t = $('memoT').value.trim(), x = $('memoX').value.trim(); if (!t && !x) return;
  const c = cardFrom({ kind:'note', title:t || x.slice(0, 20), text:x }, 'boss'); await boardAdd(c, false); closeSheet(); boardRender(); flashCard(c.id);
});
/* 보드 아래 입력칸 — 사무실과 같은 대화로 보낸다 */
const bdGrow = () => { const t = $('bdText'); if (t.offsetParent){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 100) + 'px'; } $('bdGo').disabled = !t.value.trim() || O.busy; };
$('bdText').addEventListener('input', bdGrow);
$('bdText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); if ($('bdText').value.trim()) sendSay($('bdText')); } });
$('bdText').addEventListener('focus', () => document.body.classList.add('typing'));
$('bdText').addEventListener('blur', () => document.body.classList.remove('typing'));
$('bdGo').addEventListener('pointerdown', e => e.preventDefault());
$('bdGo').onclick = () => { if ($('bdText').value.trim()) sendSay($('bdText')); };
$('btAll').onclick = () => dwClose('board');
(function measure(){
  const set = () => {
    $('office').style.setProperty('--sayh', $('say').offsetHeight + 'px');
    document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
    document.documentElement.style.setProperty('--tb', $('tabs').offsetHeight + 'px');
  };
  set(); if (window.ResizeObserver){ const ro = new ResizeObserver(set); ro.observe(document.querySelector('header')); ro.observe($('tabs')); ro.observe($('say')); }
})();

/* ── 시작 ── */
(async function boot(){
  try{
    spStep('저장소 여는 중');
    const st = await kvGet('settings');
    S.settings = Object.assign({ sections:DEFAULT_SECTIONS.map(s => ({ ...s })), fs:1, openOnly:false }, st || {});
    if (!st) await saveSettings();
    applyFs();
    spStep('세희 머리 설정 읽는 중');
    await loadAi(); AI.usage = (await kvGet('usage')) || {}; refreshBrain();
    spStep('판 불러오는 중');
    S.dates = (await allDates()).sort();
    await goDate(S.today);
    spStep(`판 ${S.dates.length}개 · 사무실 그림 거는 중`);
    await Promise.race([preloadArt((n, t) => spStep(`판 ${S.dates.length}개 · 사무실 그림 거는 중 ${n}/${t}`)), tickMs(4000)]);
    spStep('세희 머리 확인 중');
    const brain = await pingBrain();
    spStep(brain);

    /* 공유하기로 들어온 것 — 예전 방식(주소에 글이 붙어 옴)과 새 방식(일꾼이 받아 둠) 둘 다 */
    const q = new URLSearchParams(location.search);
    const title = (q.get('title') || '').trim(), text = (q.get('text') || '').trim(), url = (q.get('url') || '').trim();
    let got = text;
    if (title && !text.includes(title)) got = title + (got ? '\n' + got : '');
    if (url && !got.includes(url)) got = got ? got + '\n' + url : url;
    if (q.has('share') || q.has('shared') || got){
      history.replaceState(null, '', location.pathname + location.hash);
      if (got) await receive([got]);
      if (q.has('shared')){ spStep('공유받은 것 꺼내는 중'); await takeShared(); }
    }
    if (hashView() !== 'pan') showView(hashView());
    spStep('준비 끝 · ' + brain);
    setTimeout(() => resumeJob().catch(() => {}), 1200);
  }catch(e){
    SP.hold = 1500; spStep('여는 중 문제가 생겼어요: ' + (e && e.message || e));
  }finally{ spDone(); }
})();
