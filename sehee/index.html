<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ece6d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세희">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>세희</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash" aria-live="polite"><div class="sp-wrap"><img src="art/loading.webp" alt=""><div class="sp-dots"><i></i><i></i><i></i></div><div class="sp-status" id="spStatus">껍데기 여는 중</div></div></div>
<header>
  <div class="wrap">
    <div class="hrow">
      <span class="brand">세희</span><span class="ver" id="ver"></span>
      <span class="saved" id="saved">저장됨</span><span class="cloud" id="cloud"></span>
      <button class="brain" id="brain">머리 없음 · 깡통</button>
      <button class="ib gear" id="gear" aria-label="설정">⚙</button>
    </div>
    <div class="hrow nav">
      <button class="ib" id="prev" aria-label="이전 판">‹</button>
      <button class="day" id="day"></button>
      <input type="date" id="pick">
      <button class="ib" id="next" aria-label="다음 판">›</button>
      <button class="ib" id="today">오늘</button>
      <button class="ib" id="open" title="끝난 일 숨기기">열린 것만</button>
    </div>
    <div class="band upd" id="upd"><span>새 버전이 있어요. 지금 업데이트할까요?</span><button class="ib" id="updGo">업데이트</button><button class="ib" id="updNo">지금 버전으로 계속</button></div>
    <div class="band old" id="old"><span>지난 판이에요. 여기서 고쳐도 오늘 판은 그대로예요.</span><button class="ib" id="oldGo">오늘 판으로</button></div>
  </div>
</header>

<div class="pdr" id="panDrawer"><div class="dw-head pdr-head" id="panHead"><b>🗒️ 판</b><span class="dw-hint">머리나 옆면을 왼쪽으로 끌면 닫혀요</span><button class="ib dw-x" id="panX" aria-label="닫기">✕</button></div><div class="pdr-nav" id="panNav"></div>
<main class="wrap" id="main"></main>
</div>
<div class="pan-grip noswipe" id="panGrip" aria-hidden="true"></div>
<div class="dw-tabs pan-dw noswipe" id="panDw"><button data-pdw="cal" style="--c:#3a6b64">달력</button><button data-pdw="board" style="--c:#8a6d3b">보드</button><button data-pdw="people" style="--c:#a13b2c">사람</button></div>

<button class="fab" id="fab" hidden>넘기기</button>
<div class="pt" id="panTalk"><div class="pt-box"><div class="pt-side"><img id="ptSpr" src="art/s-lean.webp" alt="강세희"></div>
  <div class="bt-name pt-name"><b id="ptName">강세희 ▾</b><button id="ptAll">대화 보기 ›</button></div><div class="bt-bub pt-bub" id="ptBub"></div></div><div id="ptSay"></div></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>

<section id="office" aria-label="세희의 사무실">
  <div class="log" id="log"></div>
  <div class="stage" id="stage">
    <img class="spr" id="seheeSpr" src="art/s-lean.webp" alt="강세희">
    <div class="desk"><span class="plate">강세희</span></div>
    <img class="prop papers" src="art/papers.webp" alt="">
    <img class="prop monitor" src="art/monitor.webp" alt="">
  </div>
  <button class="pan-tab noswipe" id="panTab" aria-label="판으로">판</button>
  <div class="dw-tabs noswipe" id="dwTabs"><button data-dw="cal" style="--c:#3a6b64">달력</button><button data-dw="board" style="--c:#8a6d3b">보드</button><button data-dw="people" style="--c:#a13b2c">사람</button></div>
  <div class="dw noswipe" id="dw-cal" style="--c:#3a6b64"><div class="dw-head"><b>📅 달력</b><span class="dw-hint">옆면이나 머리를 오른쪽으로 끌면 닫혀요</span><button class="ib dw-x" aria-label="닫기">✕</button></div><div class="dw-body" id="cal">
  <div class="cal-year" id="calYear"></div>
  <div class="cal-tabs noswipe" id="calTabs"></div>
  <div class="cal-sheet noswipe" id="calSheet"></div>
  <div class="cal-day noswipe" id="calDay"></div>
</div></div>
  <div class="dw noswipe" id="dw-board" style="--c:#8a6d3b"><div class="dw-head"><b>📌 화이트보드</b><span class="dw-hint">옆면이나 머리를 오른쪽으로 끌면 닫혀요</span><button class="ib dw-x" aria-label="닫기">✕</button></div><div class="dw-body" id="board">
  <div class="wb"><div class="wb-head"><span class="seg" id="wbSeg"><button data-mode="board" class="on">보드</button><button data-mode="reports">보고서함</button></span><span id="wbCount"></span><span class="seg sm" id="rlSeg" hidden><button data-v="gallery">갤러리</button><button data-v="list">목록</button></span><button id="wbMemo">+ 메모</button></div><div class="wb-grid" id="wbGrid"></div></div>
  <div class="bt"><div class="bt-side"><img id="btSpr" src="art/s-lean.webp" alt="강세희"></div><div class="bt-name"><b>강세희</b><button id="btAll">대화 보기 ›</button></div><div class="bt-bub" id="btBub"></div></div>
  <div class="bt-say"><textarea id="bdText" rows="1" placeholder="세희에게 말하기" enterkeyhint="send"></textarea><button id="bdGo" aria-label="보내기" disabled>↑</button></div>
</div></div>
  <div class="dw noswipe" id="dw-people" style="--c:#a13b2c"><div class="dw-head"><b>👥 인간관계 판</b><span class="dw-hint">옆면이나 머리를 오른쪽으로 끌면 닫혀요</span><button class="ib dw-x" aria-label="닫기">✕</button></div><div class="dw-body" id="people"><div class="pp-bar"><b>수사판</b><span id="ppCount"></span><button id="ppAdd">+ 사람</button><button id="ppTheme">꾸밈</button><button id="ppCenter">크게 보기</button></div><div class="pp-scroll noswipe" id="ppScroll"><div class="pp-map" id="ppMap"></div></div></div></div>
  <div class="say" id="say"><div class="tray" id="tray" hidden></div><div class="saybub" id="saybub">
    <button id="sayClip" class="clip" aria-label="사진·파일 붙이기">📎</button>
    <textarea id="sayText" rows="1" placeholder="세희에게 말하기" enterkeyhint="send"></textarea>
    <button id="sayGo" aria-label="보내기" disabled>↑</button>
  </div><input type="file" id="sayFile" accept="image/*,.txt,.md,.csv,.tsv,.json,.html,.htm,.xml,.pdf,.docx,.xlsx,.pptx,.hwp,.hwpx,text/plain,application/pdf" multiple hidden></div>
</section>

<nav class="tabs" id="tabs">
  <button id="tabPan" class="on"><span class="ic">🗒️</span>판</button>
  <button id="tabOffice"><span class="ic">☕</span>사무실</button>
  <button id="tabDev" class="dev-tab" hidden><span class="ic">🛠</span>로그</button>
</nav>
<div class="dev" id="dev"><div class="dev-bar"><b>개발자 로그</b><span id="devN"></span><button data-dv="pause">멈춤</button><button data-dv="copy">복사</button><button data-dv="clear">지우기</button><button data-dv="close" aria-label="닫기">✕</button></div><div class="dev-f" id="devF"></div><div class="dev-list noswipe" id="devList"></div></div>
<div class="pd" id="pd"><div class="rv-bar pd-bar"><button class="ib" data-pd="close" aria-label="닫기">‹</button><div class="rv-tt"><b id="pdT"></b><small>인간관계 판</small></div><button class="ib" id="pdEdit">고치기</button></div><div class="pd-body noswipe" id="pdBody"></div></div>
<div class="rv" id="rv"><div class="rv-bar"><button class="ib" data-rv="close" aria-label="닫기">‹</button><div class="rv-tt"><b id="rvT"></b><small id="rvN"></small></div><button class="ib" data-rv="small">가-</button><button class="ib" data-rv="big">가+</button><button class="ib" data-rv="copy">복사</button><button class="ib" data-rv="print">인쇄</button><button class="ib danger" data-rv="del">떼기</button></div><div class="rv-scroll noswipe" id="rvScroll"><div class="rv-pages" id="rvPages"></div></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">되돌리기</button></div>

<script>const APP_VERSION = 'v1.5.3';</script>
<script src="js/dev.js"></script>
<script src="js/base.js"></script>
<script src="js/settings.js"></script>
<script src="js/update.js"></script>
<script src="js/ai.js"></script>
<script src="js/ocr.js"></script>
<script src="js/report.js"></script>
<script src="js/people.js"></script>
<script src="js/work.js"></script>
<script src="js/bonus-api.js"></script>
<script src="js/sync.js"></script>
<script src="js/job.js"></script>
<script src="js/docs.js"></script>
<script src="js/office.js"></script>
<script src="js/views.js"></script>
<script src="js/calendar.js"></script>
<script src="js/board.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
