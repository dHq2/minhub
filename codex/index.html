<title>굴의 도감</title>
<!-- codex v1.55 — 굴의 프롤로그 그림 도감 (체크 · 메모 · 백업) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 배치: 위에 고정된 장부 띠 (분류 · 체크 수 · 백업), 아래로 분류별 진열장. 그림 칸마다 번호표 (스샷으로 집어 말할 수 있게) */
:root{
  --bg:#141116; --panel:#1d1920; --well:#25202a; --line:#3a3240; --fg:#ece4d6; --dim:#a39a8c;
  --accent:#d9a94e; --check:#e8564a; --in:#3fbf6a; --out:#d8443a; --relic:#2f7f78; --relic-edge:#6fe0d0; --boss:#7a1f22; --boss-edge:#ff8a70;
  --display:"Nanum Myeongjo","Batang",serif; --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3efe8; --panel:#fbf8f3; --well:#e8e2d8; --line:#d3c9b9; --fg:#231d24; --dim:#6c6255;
  --accent:#9a6a12; --check:#c2352a; --in:#2e9a52; --out:#c2352a; --relic:#2f7f78; --relic-edge:#2f9c90; --boss:#7a1f22; --boss-edge:#c0453a; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f3efe8; --panel:#fbf8f3; --well:#e8e2d8; --line:#d3c9b9; --fg:#231d24; --dim:#6c6255;
  --accent:#9a6a12; --check:#c2352a; --in:#2e9a52; --out:#c2352a; --relic:#2f7f78; --relic-edge:#2f9c90; --boss:#7a1f22; --boss-edge:#c0453a; color-scheme:light; }
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--body);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font:800 34px/1.1 var(--display);margin:0;letter-spacing:1px;text-wrap:balance}
.lede{color:var(--dim);margin:0;max-width:62ch;font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto;min-width:0}
.tab{font:500 13px var(--body);color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.tab b{font:500 11px var(--mono);color:var(--dim);margin-left:4px}
.tab[aria-pressed="true"]{color:var(--fg);border-color:var(--accent);background:var(--panel)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:500 13px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover,.tab:hover{border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.tile:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.warn{color:var(--check)}
.count{font:500 13px var(--mono);color:var(--check);padding-inline:4px;font-variant-numeric:tabular-nums}
.only{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);cursor:pointer}
.status{font-size:12px;color:var(--dim);width:100%}
.status.err{color:var(--check)}
section.cat{margin-top:34px}
section.cat > h2{font:700 22px/1.2 var(--display);margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
section.cat > h2 small{font:500 12px var(--mono);color:var(--dim)}
.cat-note{color:var(--dim);font-size:13px;margin:0 0 12px;max-width:70ch}
h3{font:600 13px var(--body);color:var(--dim);letter-spacing:.06em;margin:20px 0 8px;display:flex;gap:8px;align-items:center}
h3 .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.grid{--z:var(--zoom,1);display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(118px*var(--z)),1fr));gap:calc(10px*min(var(--z),1))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(250px*var(--z))),1fr))}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(calc(140px*var(--z)),1fr))}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0}
.tile .pic{aspect-ratio:1/1;max-width:100%;border-radius:4px;background:var(--well);display:grid;place-items:center;overflow:hidden}
.grid.wide .pic{aspect-ratio:16/10}
.grid.cards .pic{aspect-ratio:3/4}
.grid.anim .pic{aspect-ratio:468/328}
.grid.anim img{object-fit:contain}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(calc(150px*var(--z)),1fr))} .grid.tall .pic{aspect-ratio:3/4}
.tile img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.grid.wide img,.grid.cards img{width:100%;height:100%;object-fit:cover}
.tile.relic .pic{background:radial-gradient(circle at 50% 45%,var(--relic) 0%,#123a3a 75%);box-shadow:inset 0 0 0 1px var(--relic-edge)}
.tile.boss .pic{background:radial-gradient(circle at 50% 45%,var(--boss) 0%,#2a0a0c 78%);box-shadow:inset 0 0 0 1px var(--boss-edge)}
.meta{display:flex;align-items:baseline;gap:6px;min-width:0}
.id{font:500 11px var(--mono);color:var(--accent);flex:none}
.nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.memo-dot{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:5px;border:2px solid var(--dim);background:var(--bg);display:grid;place-items:center;font:700 15px var(--body);color:transparent;cursor:pointer}
.tile.on{border-color:var(--check);box-shadow:0 0 0 1px var(--check)}
.st{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.st.out{background:var(--out)} .st.in{background:var(--in)}
.trash{position:absolute;top:8px;right:38px;width:26px;height:26px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0;opacity:.55}
.trash svg{width:16px;height:16px}
.tile:hover .trash,.trash:focus-visible{opacity:1;border-color:var(--line);background:var(--bg)}
.trash.del{opacity:1;color:#fff;background:var(--check);border-color:var(--check)}
.tile.on .box{background:var(--check);border-color:var(--check);color:#fff}
.tile.on .id{color:var(--check)}
.fold{position:absolute;left:10px;bottom:34px;font:600 12px var(--body);color:#fff;background:var(--accent);border:0;border-radius:999px;padding:4px 10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.fold.on{background:var(--fg);color:var(--bg)}
.tile.folder .pic{box-shadow:4px 4px 0 -1px var(--panel),4px 4px 0 0 var(--line),8px 8px 0 -1px var(--panel),8px 8px 0 0 var(--line)}
.tile.kid{border-style:dashed;border-color:var(--accent)}
.tile.kid.keep{border-style:solid}
.pnav{display:flex;flex-direction:column;gap:10px;margin:6px 0 18px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.prow > b{display:block;font:600 12px var(--body);color:var(--dim);margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(62px*var(--zoom,1)),1fr));gap:6px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;padding:2px;cursor:pointer;color:var(--fg);min-width:0}
.pbtn .pp{width:100%;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--well);border:1px solid var(--line);display:grid;place-items:center}
.pbtn img{width:100%;height:100%;object-fit:cover;display:block}
.pbtn:hover .pp,.pbtn:focus-visible .pp{border-color:var(--accent)}
.pn{font-size:10.5px;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cat-char h3,.pnav{scroll-margin-top:var(--barH,120px)}
.toNav{margin-left:auto;font:500 11px var(--body);color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 8px;cursor:pointer}
h3.hit,.pnav.hit{animation:hit 1.2s}
@keyframes hit{0%{background:color-mix(in srgb,var(--accent) 35%,transparent)}100%{background:transparent}}
.renamed{display:inline-block;font:600 10.5px var(--body);color:#fff;background:#b06a12;border-radius:4px;padding:1px 6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.namein{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:15px var(--body)}
.namein:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{display:flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0}
.search input{flex:1;min-width:0;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:14px var(--body)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#qn{font:500 12px var(--mono);color:var(--accent);white-space:nowrap}
.empty{color:var(--dim);font-size:14px;padding:20px 0}
/* 크게 보기 */
.view{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);display:grid;place-items:center;padding:16px}
.view .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:min(920px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:16px}
.view .big{background:var(--well);border-radius:6px;display:grid;place-items:center;min-height:260px}
.view .big img{max-height:70vh;object-fit:contain}
.view .side{display:flex;flex-direction:column;gap:10px;min-width:0}
.view .side .id{font-size:14px}
.view .side h4{font:700 22px/1.25 var(--display);margin:0}
.view .side p{margin:0;color:var(--dim);font-size:13.5px}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:14px/1.5 var(--body)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sheet{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--panel);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sheet p{margin:0;flex:1 1 260px}
pre.copy{white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:200px;overflow:auto;width:100%;margin:0}
/* 크기 조절 */
.zoom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.zoom button{font:600 15px var(--body);color:var(--fg);background:var(--panel);border:0;width:34px;height:32px;cursor:pointer}
.zoom span{font:500 11px var(--mono);color:var(--dim);min-width:38px;text-align:center}
.toolsBtn{display:none}
main{touch-action:pan-x pan-y}
.tiny .trash,.tiny .nm,.tiny .memo-dot{display:none!important} .tiny .box{width:20px;height:20px;top:5px;left:5px;border-width:1.5px} .tiny .st{width:14px;height:14px;top:6px;right:6px} .tiny .tile{padding:3px}
.view .big{position:relative;overflow:auto;touch-action:pan-x pan-y}
.view .big.zoomed{display:block}
.view .big.zoomed img{max-height:none;max-width:none;width:220%}
.view .hint{font-size:11px;color:var(--dim)}
/* 휴대폰 */
@media (max-width:640px){
  .search{flex:1 1 100%} .search input{font-size:16px;padding:8px 10px}
  .wrap{padding-block:12px 90px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(calc(100px*var(--z)),1fr))}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(165px*var(--z))),1fr))}
  .grid.cards,.grid.tall{grid-template-columns:repeat(auto-fill,minmax(calc(110px*var(--z)),1fr))}
  .status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h1{font-size:24px}
  .lede{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lede.open{display:block}
  .bar{padding:8px 16px;gap:6px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1 1 100%;scroll-snap-type:x proximity;margin-inline:-16px;padding-inline:16px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:7px 12px;scroll-snap-align:start}
  .toolsBtn{display:inline-block}
  .tools{width:100%;gap:6px}
  .tools .more{display:none;width:100%;flex-wrap:wrap;gap:6px}
  .bar.open .tools .more{display:flex}
  .status{font-size:11px}
  section.cat{margin-top:22px}
  section.cat > h2{font-size:19px}
  .cat-note{font-size:12px}
  h3{margin:14px 0 6px}
  .tile{padding:4px;gap:3px}
  .nm{font-size:11.5px}
  .box{top:7px;left:7px;width:26px;height:26px}
  .st{top:9px;right:9px;width:20px;height:20px}
  .trash{top:6px;right:34px;width:28px;height:28px;opacity:.85;background:color-mix(in srgb,var(--bg) 70%,transparent)}
  /* 크게 보기: 전체 화면, 아래 버튼 고정, 좌우로 밀어 넘김 */
  .view{padding:0;place-items:stretch}
  .view .card{grid-template-columns:1fr;grid-template-rows:auto 1fr;border-radius:0;border:0;max-height:100%;height:100%;padding:0;gap:0;overflow:hidden}
  .view .big{min-height:0;height:52vh;border-radius:0}
  .view .big img{max-height:52vh;max-width:100%}
  .view .side{overflow:auto;padding:12px 16px calc(120px + env(safe-area-inset-bottom,0px));gap:8px}
  .view .side h4{font-size:19px}
  .view .side .acts{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;z-index:2}
  .view .side .acts .btn{padding:10px 6px;font-size:14px}
  .view .side .acts #vDel{grid-column:1 / -1}
  textarea{min-height:80px;font-size:16px}
}
@media (prefers-reduced-motion:no-preference){ .tile{transition:border-color .15s,box-shadow .15s} }
</style>

<div class="wrap">
  <header class="top">
    <h1>굴의 도감</h1>
    <p class="lede">굴의 프롤로그에 들어갈, 지금까지 받은 그림 전부. 그림을 누르면 크게 보고 메모를 남길 수 있고, 왼쪽 위 네모로 체크합니다. 오른쪽 위 동그라미는 등장 표시예요 (초록 = 등장 확정, 빨강 = 미등장, 누르면 바뀜). 체크 · 등장 표시 · 메모는 누르거나 쓰는 즉시 자동 저장되고 Claude가 바로 읽을 수 있어요.</p>
  </header>

  <div class="bar" id="bar">
    <div class="tabs" id="tabs" role="toolbar" aria-label="분류"></div>
    <div class="search"><input id="q" type="search" placeholder="찾기: 번호 (h076) · 이름 · 메모 · 묶음" autocomplete="off" aria-label="찾기"><span id="qn"></span></div>
    <div class="tools">
      <span class="zoom" aria-label="그림 크기"><button type="button" id="zOut" aria-label="작게">−</button><span id="zVal">100%</span><button type="button" id="zIn" aria-label="크게">+</button></span>
      <span class="count" id="count">체크 0</span>
      <button class="btn toolsBtn" id="toolsBtn" type="button" aria-expanded="false">도구 ▾</button>
      <span class="more">
      <label class="only" for="onlyChecked"><input type="checkbox" id="onlyChecked"> 체크한 것만</label>
      <select class="btn" id="stFilter" aria-label="등장 표시로 거르기"><option value="all">등장 · 전체</option><option value="in">● 등장 확정만</option><option value="out">○ 미등장만</option><option value="ren">이름 바뀐 것만</option></select>
      <button class="btn" id="copyBtn" type="button">체크 목록 복사</button>
      <button class="btn" id="saveBtn" type="button">백업 저장</button>
      <button class="btn" id="loadBtn" type="button">백업 불러오기</button>
      <input type="file" id="loadFile" accept="application/json,.json" hidden>
      <button class="btn warn" id="clearBtn" type="button">체크 모두 해제</button>
      </span>
    </div>
    <div class="status" id="status">저장소에 연결하는 중…</div>
  </div>

  <main id="main"></main>
</div>

<div class="view" id="view" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="vName">
    <div class="big"><img id="vImg" alt=""></div>
    <div class="side">
      <span class="id" id="vId"></span>
      <h4 id="vName"></h4>
      <label for="vNameIn" class="memo-dot">이름 (고치면 바로 저장 · 원래 이름과 다르면 '이름 바뀜' 표시)</label>
      <input id="vNameIn" class="namein" type="text" autocomplete="off">
      <span class="renamed" id="vOrig" hidden></span>
      <p id="vSub"></p>
      <p id="vNote"></p>
      <label class="only" for="vCheck"><input type="checkbox" id="vCheck"> 체크</label>
      <label class="only" for="vSt"><input type="checkbox" id="vSt"> 등장 확정 (초록)</label>
      <label for="vMemo" class="memo-dot">메모 (어떻게 할지: 지우기 · 이름 · 다듬기 …)</label>
      <textarea id="vMemo" placeholder="예: 배경 지우고 유물로. 이름은 ‘녹슨 종’"></textarea>
      <div class="row acts"><button class="btn" id="vPrev" type="button">← 이전</button><button class="btn" id="vClose" type="button">닫기</button><button class="btn" id="vNext" type="button">다음 →</button>
      <button class="btn warn" id="vDel" type="button">삭제 표시 (체크 + 메모)</button></div>
      <span class="hint">메모 · 이름에서 엔터 = 저장하고 다음 그림 (줄바꿈은 Shift + 엔터) · 그림을 좌우로 밀면 넘어가요 · 두 번 누르면 확대</span>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden></div>

<script src="catalog.js"></script>
<script src="packs.js"></script>
<script>
'use strict';
// 분류 (도감 번호 = 사용자가 정한 순서). 3 재료는 따로 분류가 아니어서 뺌 (받은 그림 모음을 부르던 이름)
const CATS = [
  { key:'relic', no:'1', name:'유물', note:'청록 바탕 = 유물. 이름 있는 것은 2D판에서 이미 쓰는 유물, 나머지는 받은 유물 그림 54장.' },
  { key:'equip', no:'2', name:'장비', note:'핏빛 바탕 = 보스 등급 장비 (세자르 · 적뢰). 나머지는 기본으로 얻을 수 있는 장비 후보: 2D판 무기 10종과 받은 장비 그림 55장 (무기 17 · 방어구 · 옷 24 · 장신구 14).' },
  { key:'scene', no:'4', name:'컷씬 · 인카운터 · 배경', note:'장면 그림을 한곳에: 컷씬 (로딩 · 장면 전환) · 인카운터 그림과 카드 · 배경 (장소). 인카운터를 맵으로 만드는 계획은 cave-3d/ENCOUNTER_MAPS.md.' },
  { key:'card', no:'6', name:'스킬 · 이야기 그림', note:'흑백 이야기 그림 120장, 스킬 아이콘.' },
  { key:'char', no:'8', name:'인물', note:'모든 인물을 한곳에. 맨 위 초상화 버튼 (동료 · NPC · 적 · 역할 미정 · 미등장 NPC)을 누르면 그 인물 묶음으로 내려감. 묶음마다 초상화가 맨 앞, 그 뒤로 새 그림 · 2D판 그림. 묶음 제목의 ↑ 초상화로 다시 위로. 묶음 이름 끝은 게임에서 쓰는 방식 — 동작 그림 / 원화 + 연출 (기본 이미지만 있어서 움직임은 연출로) / 2D 몸 · 로직 그대로 (카리우스). 초상화를 따로 받지 않은 인물은 스탠딩에서 정사각형으로 자른 그림이 기본 초상화.' },
  { key:'prop', no:'11', name:'가구 · 소품', note:'맵에 놓을 가구 · 소품 (받은 시트를 하나씩 잘라 배경을 지움). 분류만 해 둠, 전부 빨강 (미등장). 쳐낼 것은 체크 · 동그라미로.' },
  { key:'item', no:'12', name:'일반 에셋', note:'게임 곳곳에 쓰는 일반 아이템 아이콘 (현대 물건 · 무기 · 방어구 · 물약 · 음식 · 재료 · 열쇠 · 책 · 상자 · 표지판 · 조명). 받은 아이콘 시트를 하나씩 잘라 배경을 지움.' },
];
const BY_ID = Object.fromEntries(CATALOG.map(e => [e.id, e]));
const $ = id => document.getElementById(id);
let marks = {};             // id → { checked, memo, at }
let cat = 'all', onlyChecked = false, store = null, viewing = null, synced = false, showSt = 'all';

/* ---------- 저장: db (Claude가 읽음) · 안 되면 이 브라우저에만 ---------- */
const LS = 'codex-marks-v1';
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } }
function lsWrite(){ try { localStorage.setItem(LS, JSON.stringify(marks)); } catch (e) {} }
function status(msg, err){ const s = $('status'); s.textContent = msg; s.classList.toggle('err', !!err); }
async function connect(){
  marks = lsRead(); render();
  let db = null;
  try { db = window.claude && claude.use ? await claude.use('db') : null; } catch (e) { db = null; }
  if (!db){ status('이 화면에서는 공유 저장소를 쓸 수 없어 이 브라우저에만 저장됩니다. 백업 저장으로 파일을 남겨 두세요.'); return; }
  store = db.collection('marks');
  let first = true;
  store.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && (v.checked || v.memo || v.status || v.name)) next[d.id] = { checked: !!v.checked, memo: v.memo || '', status: v.status || '', name: v.name || '', inAt: v.inAt || '', at: v.at || '' }; });
    // 처음 한 번: 이 브라우저에만 있고 저장소에 못 올라간 것 (끊겼을 때 등)을 올려 보냄 → 날아가지 않게
    if (!synced){ synced = true; for (const [id, v] of Object.entries(marks)) if (BY_ID[id] && (!next[id] || (v.at || '') > (next[id].at || ''))){ next[id] = v; store.doc(id).set(docOf(v)).catch(() => {}); } }
    // 아직 저장소에 올라가는 중인 내 수정은 저장소 내용으로 덮지 않음 (예전엔 여기서 방금 고친 게 날아갈 수 있었음)
    for (const [id, v] of Object.entries(pending)){ if (v) next[id] = v; else delete next[id]; }
    marks = next; lsWrite(); render(); if (viewing) fillView();
    if (first){ first = false; flushAll(); }
    for (const [id, v] of Object.entries(marks)) if (v.memo && !v.checked && !v.autoChk){ v.autoChk = true; put(id, { checked: true }, true); }   // 예전에 메모만 하고 체크 안 한 것도 체크
    status('자동 저장됨 ' + new Date().toLocaleTimeString() + ' · 체크 · 등장 표시 · 메모는 누르는 즉시 저장되고 Claude가 바로 읽을 수 있어요');
  }, e => status('저장소 오류: ' + (e && e.message || e) + '. 이 브라우저에는 계속 저장됩니다.', true));
}
const docOf = v => ({ checked: !!v.checked, memo: v.memo || '', status: v.status || '', name: v.name || '', inAt: v.inAt || '', at: v.at || new Date().toISOString() });
const empty = v => !v.checked && !v.memo && !v.status && !v.name;
// 이름 바꾸기: 바꾼 이름은 marks에 (원래 이름은 catalog 그대로). 바뀐 칸은 '이름 바뀜' 표시 → Claude가 나중에 catalog에 적용
const nameOf = e => (marks[e.id] && marks[e.id].name) || e.name;
const renamed = e => !!(marks[e.id] && marks[e.id].name && marks[e.id].name !== e.name);
async function put(id, patch, quiet){
  const cur = marks[id] || { checked:false, memo:'', status:'' };
  const now = new Date().toISOString();
  if (patch.status === 'in' && cur.status !== 'in') patch = { ...patch, inAt: now };   // 등장 확정을 누른 때 → 다음 판에 이 순서로 분류 맨 위
  if (patch.status === 'out') patch = { ...patch, inAt: '' };
  if (patch.memo && patch.memo !== (cur.memo || '') && patch.checked === undefined) patch = { ...patch, checked: true };   // 메모를 쓰면 자동으로 체크
  const v = { ...cur, ...patch, at: now };
  if (empty(v)) delete marks[id]; else marks[id] = v;
  if (viewing === id && $('vCheck')) $('vCheck').checked = !!v.checked;
  lsWrite(); if (!quiet) render();
  pending[id] = empty(v) ? null : v; lsPending();
  if (!store){ status('이 브라우저에 자동 저장됨 ' + new Date().toLocaleTimeString()); return; }
  send(id);
}
/* 저장 대기열: 고친 것은 저장소에 올라갈 때까지 pending에 (이 브라우저에도 기록). 한 칸씩 차례로 올리고, 실패하면 2 · 4 · 8 … 초 뒤 다시 */
const LSP = LS + '-pending';
let pending = (() => { try { return JSON.parse(localStorage.getItem(LSP) || '{}'); } catch (e) { return {}; } })();
const sending = {};
function lsPending(){ try { localStorage.setItem(LSP, JSON.stringify(pending)); } catch (e) {} }
function saveState(){ const n = Object.keys(pending).length; if (n) status('저장 중… (' + n + ')'); else status('자동 저장됨 ' + new Date().toLocaleTimeString()); }
async function send(id, tries){
  if (!store || !(id in pending)) return;

  const v = pending[id]; sending[id] = { again:false };
  saveState();
  let ok = true;
  try { if (v) await store.doc(id).set(docOf(v)); else await store.doc(id).delete(); }
  catch (e){ ok = false; status('저장소에 못 올림: ' + (e && e.message || e) + '. 이 브라우저에는 남아 있고, 곧 다시 올려요.', true); }
  const again = sending[id].again; delete sending[id];
  if (ok && pending[id] === v){ delete pending[id]; lsPending(); }
  if (again || (ok && id in pending)) return send(id, 0);
  if (!ok){ const n = (tries || 0) + 1; setTimeout(() => send(id, n), Math.min(30000, 2000 * 2 ** (n - 1))); return; }
  saveState();
}
function flushAll(){ for (const id of Object.keys(pending)) send(id, 0); }
// 등장 표시: 초록 = 등장 확정, 빨강 = 미등장. 바꾸지 않았으면 지금 게임에 들어가 있는지 (catalog의 on)로
const stOf = e => (marks[e.id] && marks[e.id].status) || (e.on ? 'in' : 'out');

/* ---------- 묶음 그림: 게시 파일 수 한도 (511) 때문에 작은 그림은 pack/*.webp에서 잘라 씀 (packs.js, tools/pack.py) ---------- */
const PK = typeof PACKED === 'object' ? PACKED : {};
const sheetP = {}, cutP = {};
let seen = null;
function packImg(i){ return sheetP[i] || (sheetP[i] = new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = PACKS[i]; })); }
function picUrl(src){
  const p = PK[src]; if (!p) return Promise.resolve(src);
  return cutP[src] || (cutP[src] = packImg(p[0]).then(im => {
    const c = document.createElement('canvas'); c.width = p[3]; c.height = p[4];
    c.getContext('2d').drawImage(im, p[1], p[2], p[3], p[4], 0, 0, p[3], p[4]);
    return c.toDataURL('image/webp', 0.92);
  }).catch(() => src));
}
function setPic(img, src){ img.dataset.k = src; picUrl(src).then(u => { if (img.dataset.k === src) img.src = u; }); }

/* ---------- 그리기 ---------- */
/* 표정 묶음: parent가 있는 그림 (표정)은 대표 초상화 밑에 접어 둠. 대표 칸의 '표정 n'을 누르면 바로 뒤에 펴짐 */
const KIDS = {}; for (const e of CATALOG) if (e.parent) (KIDS[e.parent] = KIDS[e.parent] || []).push(e.id);
let opened = {}; try { opened = JSON.parse(localStorage.getItem('codex-open') || '{}'); } catch (e) {}
function shown(e){ return visible(e) && (!e.parent || opened[e.parent] || !BY_ID[e.parent] || !visible(BY_ID[e.parent])); }
/* 찾기: 번호는 하이픈 · 대소문자 무시 (h076 = H-076). 찾는 동안은 모든 분류에서 */
let q = '';
const norm = t => String(t || '').toLowerCase().replace(/[-\s]/g, '');
function hitQ(e){ if (!q) return true; const n = norm(q), m = marks[e.id] || {}; return norm(e.id).includes(n) || norm(e.name).includes(n) || norm(m.name).includes(n) || norm(m.memo).includes(n) || norm(e.sub).includes(n) || norm(e.note).includes(n); }
function visible(e){ return hitQ(e) && (q || cat === 'all' || e.cat === cat) && (!onlyChecked || (marks[e.id] && marks[e.id].checked)) && (showSt === 'all' || (showSt === 'ren' ? renamed(e) : stOf(e) === showSt)); }
function tile(e){
  const m = marks[e.id], on = m && m.checked;
  const memo = m && m.memo ? `<span class="memo-dot">✎ ${esc(m.memo)}</span>` : '';
  return `<div class="tile ${e.rank} ${on ? 'on' : ''} ${e.parent ? 'kid' : ''} ${e.parent && keepKid(e) ? 'keep' : ''} ${KIDS[e.id] ? 'folder' : ''}" data-id="${e.id}" tabindex="0" role="button" aria-label="${esc(e.id + ' ' + e.name)} 크게 보기">
    <span class="box" data-check="${e.id}" role="checkbox" aria-checked="${on ? 'true' : 'false'}" aria-label="${esc(e.id)} 체크">✓</span>
    <button class="trash ${isDel(e.id) ? 'del' : ''}" type="button" data-del="${e.id}" title="${isDel(e.id) ? '삭제 표시 풀기 (체크 해제 · 메모의 삭제 지움)' : '삭제 표시 (체크 + 메모에 삭제)'}" aria-label="${esc(e.id)} 삭제 표시" aria-pressed="${isDel(e.id)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button>
    <span class="st ${stOf(e)}" data-st="${e.id}" role="button" title="${stOf(e) === 'in' ? '등장 확정 (누르면 미등장)' : '미등장 (누르면 등장 확정)'}" aria-label="${esc(e.id)} ${stOf(e) === 'in' ? '등장 확정' : '미등장'}"></span>
    <div class="pic"><img ${PK[e.src] ? `data-pk="${esc(e.src)}"` : `loading="lazy" src="${e.src}"`} alt="${esc(e.name)}"></div>
    ${KIDS[e.id] ? `<button class="fold ${opened[e.id] ? 'on' : ''}" type="button" data-fold="${e.id}" aria-expanded="${!!opened[e.id]}">${BY_ID[KIDS[e.id][0]].name.includes('색 변형') ? '색' : '표정'} ${KIDS[e.id].length} ${opened[e.id] ? '▴' : '▾'}</button>` : ''}
    <div class="meta"><span class="id">${e.id}</span><span class="nm">${esc(nameOf(e))}</span></div>${renamed(e) ? `<span class="renamed" title="원래 이름: ${esc(e.name)}">이름 바뀜 · 원래 ${esc(e.name)}</span>` : ''}${memo}</div>`;
}
/* 인물 위의 초상화 버튼: 누르면 그 인물 묶음 (초상화 + 스프라이트)으로 내려감. 버튼일 뿐, 초상화 칸은 묶음 안에 있음 */
const isFace = e => e.id.startsWith('F-') || e.id.endsWith('-face');
function roleOf(sub){ if (sub.includes('미등장 NPC')) return '미등장 NPC'; for (const r of ['동료', 'NPC', '적 · 보스', '역할 미정']) if (sub.includes(' · ' + r + ' · ')) return r; return '기타'; }
function peopleNav(subs){
  const by = {};
  subs.forEach((s, i) => {
    const ms = CATALOG.filter(e => e.cat === 'char' && e.sub === s); if (!ms.length) return;
    const f = ms.find(isFace) || ms[0], role = roleOf(s);
    (by[role] = by[role] || []).push(`<button class="pbtn" type="button" data-jump="who-${i}" title="${esc(s)}"><span class="pp"><img ${PK[f.src] ? `data-pk="${esc(f.src)}"` : `loading="lazy" src="${f.src}"`} alt=""></span><span class="pn">${esc(s.split(' · ')[0])}</span></button>`);
  });
  return `<nav class="pnav" id="pnav" aria-label="인물 초상화">${Object.entries(by).map(([r, bs]) => `<div class="prow"><b>${esc(r)} · ${bs.length}</b><div class="pgrid">${bs.join('')}</div></div>`).join('')}</nav>`;
}
function jumpTo(id){ const el = $(id); if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
/* 묶음 안 순서: (인물은 초상화 먼저) → 등장 확정 (판을 낼 때 누른 순서로 매긴 pin) → 나머지 원래 순서.
   표정 · 색 변형 (parent 있음)은 대표 바로 뒤, 펴 놓았을 때만. 크게 보기의 이전 · 다음도 이 순서 (FLAT) */
let FLAT = [];
// 체크 · 등장 확정한 변형은 접혀 있어도 라인업에 남김 (실선)
const keepKid = k => !!(marks[k.id] && (marks[k.id].checked || marks[k.id].status === 'in'));
function arrange(list, ck){
  const inL = new Set(list);
  const tops = list.filter(e => !e.parent || !inL.has(BY_ID[e.parent]));
  const key = e => [ck === 'char' && isFace(e) ? 0 : 1, e.pin ? 0 : 1, e.pin || 0, CATALOG.indexOf(e)];
  tops.sort((a, b) => { const x = key(a), y = key(b); for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; });
  const out = [];
  for (const e of tops){ out.push(e); if (KIDS[e.id]) out.push(...KIDS[e.id].map(id => BY_ID[id]).filter(k => inL.has(k) && (opened[e.id] || keepKid(k)))); }
  return out;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
function render(){
  const checked = CATALOG.filter(e => marks[e.id] && marks[e.id].checked).length;
  $('count').textContent = `체크 ${checked}`;
  $('tabs').innerHTML = [{ key:'all', no:'', name:'전체' }, ...CATS].map(c => {
    const n = c.key === 'all' ? CATALOG.length : CATALOG.filter(e => e.cat === c.key).length;
    return `<button class="tab" type="button" data-cat="${c.key}" aria-pressed="${cat === c.key}">${c.no ? c.no + '. ' : ''}${c.name}<b>${n}</b></button>`;
  }).join('');
  let html = ''; FLAT = [];
  for (const c of CATS){
    if (!q && cat !== 'all' && cat !== c.key) continue;
    if (q && !CATALOG.some(e => e.cat === c.key && visible(e))) continue;
    const items = CATALOG.filter(e => e.cat === c.key && visible(e));
    const subs0 = [...new Set(CATALOG.filter(e => e.cat === c.key).map(e => e.sub))];
    const subs = subs0;
    const cls = c.key === 'anim' ? 'grid wide anim' : c.key === 'char' ? 'grid tall' : c.key === 'scene' || c.key === 'bg' ? 'grid wide' : 'grid';
    html += `<section class="cat" id="cat-${c.key}"><h2>${c.no}. ${c.name} <small>${CATALOG.filter(e => e.cat === c.key).length}</small></h2><p class="cat-note">${c.note}</p>`;
    if (c.key === 'char' && !q) html += peopleNav(subs0);
    let any = false;
    for (const s of subs){
      const list = arrange(items.filter(e => e.sub === s), c.key); if (!list.length) continue; any = true; FLAT.push(...list);
      const sw = list[0].rank === 'relic' ? 'var(--relic)' : list[0].rank === 'boss' ? 'var(--boss)' : 'var(--line)';
      const g = s === '인카운터 카드' ? 'grid cards' : s.startsWith('초상화') ? 'grid' : cls;
      const gi = c.key === 'char' && subs0.includes(s) ? ` id="who-${subs0.indexOf(s)}"` : '';
      html += `<h3${gi}><span class="sw" style="background:${sw}"></span>${esc(s)} · ${list.length}${c.key === 'char' ? '<button class="toNav" type="button" data-tonav aria-label="초상화 버튼으로">↑ 초상화</button>' : ''}</h3><div class="${g}">${list.map(tile).join('')}</div>`;
    }
    if (!any) html += `<p class="empty">${onlyChecked ? '이 분류에 체크한 그림이 없어요.' : '그림이 없어요.'}</p>`;
    html += `</section>`;
  }
  $('main').innerHTML = html;
  if (seen) seen.disconnect();
  seen = 'IntersectionObserver' in window ? new IntersectionObserver(es => { for (const x of es) if (x.isIntersecting){ seen.unobserve(x.target); setPic(x.target, x.target.dataset.pk); } }, { rootMargin:'600px' }) : null;

/* ---------- 크게 보기 ---------- */
function order(){ return FLAT; }
function openView(id){ viewing = id; $('view').hidden = false; fillView(); $('vMemo').focus({ preventScroll:true }); }
function fillView(){
  const bg = document.querySelector('.view .big'); if (bg) bg.classList.remove('zoomed');
  const e = BY_ID[viewing]; if (!e) return; const m = marks[e.id] || {};
  setPic($('vImg'), e.src); $('vImg').alt = e.name; $('vId').textContent = e.id; $('vName').textContent = nameOf(e);
  if (document.activeElement !== $('vNameIn')) $('vNameIn').value = nameOf(e);
  $('vOrig').hidden = !renamed(e); $('vOrig').textContent = '이름 바뀜 · 원래 이름: ' + e.name;
  $('vSub').textContent = (CATS.find(c => c.key === e.cat) || {}).name + ' · ' + e.sub; $('vNote').textContent = e.note || '';
  $('vCheck').checked = !!m.checked; $('vSt').checked = stOf(e) === 'in';
  $('vDel').textContent = isDel(e.id) ? '삭제 표시 풀기' : '삭제 표시 (체크 + 메모)';
  if (document.activeElement !== $('vMemo')) $('vMemo').value = m.memo || '';
}
function step(d){ saveMemo(); const o = order(), i = o.findIndex(e => e.id === viewing); const n = o[(i + d + o.length) % o.length]; if (n){ viewing = n.id; $('vMemo').value = (marks[n.id] || {}).memo || ''; $('vNameIn').value = nameOf(n); fillView(); if (enterNext) $(enterNext).focus({ preventScroll:true }); } }
function saveName(){ if (!viewing) return; const e = BY_ID[viewing], v = $('vNameIn').value.trim(), want = v && v !== e.name ? v : ''; if (want !== ((marks[viewing] || {}).name || '')) put(viewing, { name: want }); }
function saveMemo(){ if (!viewing) return; saveName(); const v = $('vMemo').value.trim(), cur = (marks[viewing] || {}).memo || ''; if (v !== cur) put(viewing, { memo: v }); }
function closeView(){ saveMemo(); $('view').hidden = true; viewing = null; render(); }

/* ---------- 목록 복사 · 백업 ---------- */
function listText(){
  const rows = CATALOG.filter(e => marks[e.id] && (marks[e.id].checked || marks[e.id].memo || renamed(e)));
  if (!rows.length) return '체크하거나 메모한 그림이 없어요.';
  return rows.map(e => `${marks[e.id].checked ? '[v]' : '[ ]'} ${stOf(e) === 'in' ? '●등장' : '○미등장'} ${e.id}  ${e.name}${renamed(e) ? '  → 이름: ' + marks[e.id].name : ''}${marks[e.id].memo ? '  — ' + marks[e.id].memo : ''}`).join('\n');
}
function sheet(html){ const s = $('sheet'); s.innerHTML = html; s.hidden = false; }
function closeSheet(){ $('sheet').hidden = true; }
async function copyList(){
  const t = listText();
  try { await navigator.clipboard.writeText(t); status('체크 목록을 복사했어요'); }
  catch (e){ sheet(`<p>복사가 막혀 있어요. 아래 글을 직접 선택해 복사하세요.</p><button class="btn" type="button" data-close>닫기</button><pre class="copy" id="copyText"></pre>`); $('copyText').textContent = t; const r = document.createRange(); r.selectNodeContents($('copyText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}
async function saveBackup(){
  const data = JSON.stringify({ kind:'codex-marks', version:1, savedAt:new Date().toISOString(), marks }, null, 1);
  let dl = null; try { dl = window.claude && claude.use ? await claude.use('downloads') : null; } catch (e) {}
  const name = 'codex-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  if (dl){ try { await dl.save({ filename:name, data }); status('백업 파일을 저장했어요: ' + name); return; } catch (e){ if (e && e.code === 'declined'){ status('백업 저장을 취소했어요'); return; } } }
  sheet(`<p>파일 저장이 막혀 있어요. 아래 내용을 복사해 메모장에 ${name} 로 저장하면 그게 백업이에요.</p><button class="btn" type="button" data-close>닫기</button><pre class="copy" id="copyText"></pre>`); $('copyText').textContent = data;
}
function loadBackup(file){
  const r = new FileReader();
  r.onload = async () => {
    let j; try { j = JSON.parse(r.result); } catch (e){ status('백업 파일을 읽지 못했어요. 이 도감에서 저장한 .json 파일인지 확인해 주세요.', true); return; }
    const m = j && j.marks; if (!m || typeof m !== 'object'){ status('백업 파일에 체크 정보가 없어요.', true); return; }
    const ids = Object.keys(m).filter(id => BY_ID[id]);
    for (const id of ids) await put(id, { checked: !!m[id].checked, memo: m[id].memo || '', status: m[id].status || '', name: m[id].name || '' }, true); render();
    status(`백업에서 ${ids.length}개를 되살렸어요`);
  };
  r.readAsText(file);
}
function askClear(){
  const n = Object.keys(marks).filter(id => marks[id].checked).length;
  if (!n){ status('해제할 체크가 없어요'); return; }
  sheet(`<p>체크 ${n}개를 모두 해제할까요? 메모는 남아요.</p><button class="btn warn" type="button" id="doClear">모두 해제</button><button class="btn" type="button" data-close>그만두기</button>`);
  $('doClear').onclick = async () => { closeSheet(); for (const id of Object.keys(marks)) if (marks[id].checked) await put(id, { checked:false }); status('체크를 모두 해제했어요'); };
}

/* ---------- 쓰레기통: 한 번에 체크 + 메모에 '삭제'. 다시 누르면 풀림 (원래 메모는 남김) ---------- */
const DEL = '삭제';
function isDel(id){ const m = marks[id]; return !!(m && m.checked && (m.memo || '').startsWith(DEL)); }
function toggleDel(id){
  const memo = ((marks[id] || {}).memo || '').trim();
  if (isDel(id)){ const rest = memo.slice(DEL.length).replace(/^\s*·\s*/, '').trim(); put(id, { checked:false, memo:rest }); if (viewing === id) $('vMemo').value = rest; }
  else { const m = memo.startsWith(DEL) ? memo : memo ? DEL + ' · ' + memo : DEL; put(id, { checked:true, memo:m }); if (viewing === id) $('vMemo').value = m; }
  if (viewing === id) fillView();
}

/* ---------- 이벤트 ---------- */
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; render(); try { localStorage.setItem('codex-tab', cat); } catch (er) {} });
$('main').addEventListener('click', e => {
  const jb = e.target.closest('[data-jump]'); if (jb){ e.stopPropagation(); jumpTo(jb.dataset.jump); return; }
  if (e.target.closest('[data-tonav]')){ e.stopPropagation(); jumpTo('pnav'); return; }
  const fo = e.target.closest('[data-fold]'); if (fo){ e.stopPropagation(); const id = fo.dataset.fold; opened[id] = !opened[id]; try { localStorage.setItem('codex-open', JSON.stringify(opened)); } catch (er) {} render(); return; }
  const d = e.target.closest('[data-del]'); if (d){ e.stopPropagation(); toggleDel(d.dataset.del); return; }
  const st = e.target.closest('[data-st]'); if (st){ e.stopPropagation(); const it = BY_ID[st.dataset.st]; put(it.id, { status: stOf(it) === 'in' ? 'out' : 'in' }); return; }
  const c = e.target.closest('[data-check]'); if (c){ e.stopPropagation(); const id = c.dataset.check; put(id, { checked: !(marks[id] && marks[id].checked) }); return; }
  const t = e.target.closest('.tile'); if (t) openView(t.dataset.id);
});
$('main').addEventListener('keydown', e => { const t = e.target.closest('.tile'); if (!t) return; if (e.key === 'Enter'){ openView(t.dataset.id); } if (e.key === ' '){ e.preventDefault(); put(t.dataset.id, { checked: !(marks[t.dataset.id] && marks[t.dataset.id].checked) }); } });
let qT = 0;
$('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { q = $('q').value.trim(); render(); const n = q ? CATALOG.filter(visible).length : 0; $('qn').textContent = q ? `${n}개` : ''; if (q) scrollTo({ top: $('main').offsetTop - $('bar').offsetHeight - 8 }); }, 150); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); const f = CATALOG.find(visible); if (f) openView(f.id); } if (e.key === 'Escape'){ $('q').value = ''; q = ''; $('qn').textContent = ''; render(); } });
$('onlyChecked').addEventListener('change', e => { onlyChecked = e.target.checked; render(); });
$('copyBtn').onclick = copyList; $('saveBtn').onclick = saveBackup; $('clearBtn').onclick = askClear;
$('loadBtn').onclick = () => $('loadFile').click();
$('loadFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadBackup(f); e.target.value = ''; });
$('sheet').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
$('vDel').addEventListener('click', () => { saveMemo(); toggleDel(viewing); });
$('vCheck').addEventListener('change', e => put(viewing, { checked: e.target.checked }));
$('vSt').addEventListener('change', e => put(viewing, { status: e.target.checked ? 'in' : 'out' }));
$('vMemo').addEventListener('blur', saveMemo);
let memoT = null;
// 엔터 = 저장하고 다음 (Shift + 엔터는 줄바꿈). 한글 조합 중 엔터는 무시
let enterNext = null;
for (const id of ['vMemo', 'vNameIn']) $(id).addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  e.preventDefault(); enterNext = id; step(1); enterNext = null;
});
$('vNameIn').addEventListener('change', saveName);
let nameT = null; $('vNameIn').addEventListener('input', () => { clearTimeout(nameT); nameT = setTimeout(saveName, 600); });   // 이름도 쓰는 도중 자동 저장
$('vMemo').addEventListener('input', () => { clearTimeout(memoT); memoT = setTimeout(() => { if (!viewing) return; const v = $('vMemo').value.trim(); if (v !== ((marks[viewing] || {}).memo || '')) put(viewing, { memo: v }, true); }, 500); });   // 쓰는 도중에도 0.5초마다 자동 저장
addEventListener('pagehide', () => { saveMemo(); flushAll(); }); document.addEventListener('visibilitychange', () => { if (document.hidden){ saveMemo(); flushAll(); } });
addEventListener('online', flushAll);
addEventListener('beforeunload', e => { if (Object.keys(pending).length){ flushAll(); e.preventDefault(); e.returnValue = ''; } });
$('stFilter').addEventListener('change', e => { showSt = e.target.value; render(); });
/* ---------- 크기 조절: + − 버튼 · 두 손가락 오므리기/벌리기 · 기억 ---------- */
let zoom = 1;
try { const z = parseFloat(localStorage.getItem('codex-zoom')); if (z) zoom = z; } catch (e) {}
function setZoom(z, save){
  zoom = Math.min(2.6, Math.max(0.55, Math.round(z * 100) / 100));
  document.documentElement.style.setProperty('--zoom', zoom);
  $('zVal').textContent = Math.round(zoom * 100) + '%';
  document.documentElement.classList.toggle('tiny', zoom < 0.75);
  if (save !== false) try { localStorage.setItem('codex-zoom', zoom); } catch (e) {}
}
setZoom(zoom, false);
$('zIn').onclick = () => setZoom(zoom * 1.2);
$('zOut').onclick = () => setZoom(zoom / 1.2);
(() => {
  let d0 = 0, z0 = 1, raf = 0, nz = 1, anchor = null;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  $('main').addEventListener('touchstart', e => {
    if (e.touches.length !== 2) return;
    d0 = dist(e.touches); z0 = zoom;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const el = document.elementFromPoint(innerWidth / 2, my); anchor = el && el.closest('.tile');
  }, { passive:true });
  $('main').addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || !d0) return;
    e.preventDefault(); nz = z0 * dist(e.touches) / d0;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; const y = anchor && anchor.getBoundingClientRect().top; setZoom(nz, false); if (anchor) scrollBy(0, anchor.getBoundingClientRect().top - y); });
  }, { passive:false });
  $('main').addEventListener('touchend', e => { if (d0 && e.touches.length < 2){ d0 = 0; setZoom(zoom); } }, { passive:true });
  // 컴퓨터: Ctrl + 휠
  $('main').addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive:false });
})();
$('toolsBtn').onclick = () => { const o = $('bar').classList.toggle('open'); $('toolsBtn').setAttribute('aria-expanded', o); $('toolsBtn').textContent = o ? '도구 ▴' : '도구 ▾'; };
document.querySelector('.lede').addEventListener('click', e => e.currentTarget.classList.toggle('open'));
/* 크게 보기: 좌우로 밀어 넘기기 · 두 번 눌러 확대 */
(() => {
  const big = document.querySelector('.view .big'); let sx = 0, sy = 0, st = 0, last = 0;
  big.addEventListener('touchstart', e => { if (e.touches.length !== 1) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive:true });
  big.addEventListener('touchend', e => {
    if (!st) return; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st; st = 0;
    if (big.classList.contains('zoomed')) { if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && Date.now() - last < 320) { big.classList.remove('zoomed'); last = 0; } else if (Math.abs(dx) < 8) last = Date.now(); return; }
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 700){ step(dx < 0 ? 1 : -1); return; }
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8){ if (Date.now() - last < 320){ big.classList.add('zoomed'); big.scrollLeft = (big.scrollWidth - big.clientWidth) / 2; last = 0; } else last = Date.now(); }
  }, { passive:true });
  big.addEventListener('dblclick', () => big.classList.toggle('zoomed'));
})();
$('vPrev').onclick = () => step(-1); $('vNext').onclick = () => step(1); $('vClose').onclick = closeView;
$('view').addEventListener('click', e => { if (e.target === $('view')) closeView(); });
addEventListener('keydown', e => { if ($('view').hidden) return; if (e.key === 'Escape') closeView(); if (document.activeElement === $('vMemo')) return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
try { const t = localStorage.getItem('codex-tab'); if (t && (t === 'all' || CATS.some(c => c.key === t))) cat = t; } catch (e) {}
render(); connect();
</script>
