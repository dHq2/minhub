<meta charset="utf-8">
<title>굴의 프롤로그</title>
<!--
  굴의 프롤로그 — 프롤로그 : 노말모드
  version v1.4
  변경 기록은 README.md 참고
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0d0a0f;
    --ink:#eadfcb;
    --ink-dim:#8d8374;
    --fire:#ff9d3c;
    --panel:#17121a;
    --line:#342b36;
    --ruby:#c2253f;
    --blue:#6fb8e8;
    --green:#5cc26a;
    --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --mono:"Nanum Gothic Coding","D2Coding",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--mono);}
  [hidden]{display:none!important;}
  button{font:inherit;cursor:pointer;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--fire);outline-offset:2px;}

  /* ---------- 1. 텍스트 캐릭터 생성 ---------- */
  #creator{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;}
  #creator h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--fire);letter-spacing:1px;}
  #creator .sub{color:var(--ink-dim);font-size:12px;margin:2px 0 14px;letter-spacing:1px;}
  #log{flex:1;overflow-y:auto;font-size:15px;line-height:1.75;white-space:pre-wrap;padding-right:6px;}
  #log .sys{color:var(--ink-dim);}
  #log .q{color:var(--fire);}
  #log .me{color:#9fd3ff;}
  #log .ok{color:#8ee08e;}
  #opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
  #opts button{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px 12px;border-radius:4px;}
  #opts button:hover{border-color:var(--fire);color:var(--fire);}
  #inrow{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px;}
  #inrow span{color:var(--fire);padding-top:8px;}
  #cin{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font:inherit;font-size:16px;padding:8px 0;}

  /* ---------- 2. 굴 ---------- */
  #game{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  .hud{position:absolute;pointer-events:none;font-size:12px;}
  #hud-tl{top:calc(10px + env(safe-area-inset-top,0px));left:12px;color:var(--ink-dim);line-height:1.5;}
  #hud-tl b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--fire);}
  #hud-tr{top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;flex-direction:column;align-items:stretch;gap:5px;pointer-events:auto;}
  #hud-tr button{background:rgba(23,18,26,.88);color:var(--ink);border:1px solid var(--line);padding:5px 9px;border-radius:4px;font-size:12px;}

  /* 림월드식 캐릭터 바 */
  #bar{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;}
  .pi{width:78px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px 4px;background:rgba(23,18,26,.8);border:1px solid var(--line);border-radius:3px;transition:border-color .2s;cursor:pointer;}
  .pi:hover{border-color:#6a5a6e;}
  .pi.near{border-color:var(--fire);}
  .pi canvas{width:40px;height:40px;}
  .pi .nm{font-size:11px;color:var(--ink);}
  .pi .job{font-size:10px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  @media (max-width:640px){ #hud-tr button{padding:4px 7px;font-size:11px;} #bar{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));} .pi{width:64px;} #hud-tl{font-size:11px;} }

  #prompt{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:1px solid var(--line);padding:4px 10px;border-radius:3px;}
  #ver{bottom:calc(6px + env(safe-area-inset-bottom,0px));right:10px;color:#4f4652;font-size:10px;}

  #dialog{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 32px));
    background:rgba(18,14,20,.95);border:1px solid var(--line);border-top:3px solid var(--fire);border-radius:4px;padding:12px 16px 16px;}
  #dialog .who{font-family:var(--display);font-size:18px;margin-bottom:4px;}
  #dialog .txt{font-size:15px;line-height:1.65;min-height:48px;}
  #dialog .nx{position:absolute;right:12px;bottom:6px;font-size:11px;color:var(--ink-dim);}

  #inv{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));
    background:rgba(18,14,20,.97);border:1px solid var(--line);border-radius:4px;padding:14px 16px;font-size:14px;}
  #inv h3{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:20px;color:var(--fire);}
  #inv .slot{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:6px 0;}
  #inv .slot span:first-child{color:var(--ink-dim);}
  #inv .stat{margin-top:10px;color:var(--ink-dim);font-size:12px;line-height:1.6;}

  /* 턴 · 속도 */
  #mapline{color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums;}
  #nextdrop{color:var(--ink-dim);font-size:11px;}
  #turnbar{width:150px;height:3px;background:var(--line);margin:5px 0 6px;border-radius:2px;overflow:hidden;}
  #turnbar i{display:block;height:100%;width:0;background:var(--fire);}
  #speed{display:flex;gap:4px;pointer-events:auto;}
  #speed button{background:rgba(23,18,26,.88);color:var(--ink-dim);border:1px solid var(--line);padding:3px 8px;border-radius:3px;font-size:11px;}
  #speed button.on{color:var(--fire);border-color:var(--fire);}

  /* 이벤트 창 (화면 가운데) */
  #event{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:min(80%,640px);
    display:flex;flex-direction:column;background:rgba(14,11,16,.97);border:1px solid var(--line);border-top:3px solid var(--fire);border-radius:4px;padding:14px 16px;z-index:5;}
  #event .ev-narr{font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:10px;text-wrap:balance;}
  #event .ev-box{flex:1;overflow-y:auto;background:#0a080c;border:1px solid var(--line);border-radius:3px;padding:6px 10px;}
  #event .ev-tag{font-size:11px;color:var(--ink-dim);letter-spacing:1px;padding:4px 0 6px;border-bottom:1px dashed var(--line);}
  #event .ev-row{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed #221c25;}
  #event .ev-row:last-child{border-bottom:none;}
  #event .ev-em{font-size:22px;text-align:center;}
  #event .ev-name{font-size:14px;color:var(--ink);}
  #event .ev-desc{font-size:12px;color:var(--ink-dim);line-height:1.5;}
  #event .ev-chips{font-size:12px;color:#9fe0a8;text-align:right;white-space:nowrap;}
  #event .ev-row.relic .ev-name{color:#ffd76a;}
  #event .ev-row.weather .ev-name{color:#9fd3ff;}
  #event .ev-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--ink-dim);}
  #event .ev-foot button{background:var(--fire);color:#1a1008;border:none;border-radius:3px;padding:7px 14px;font-size:13px;}

  /* 창고 */
  #store{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));max-height:80%;overflow-y:auto;
    background:rgba(14,11,16,.97);border:1px solid var(--line);border-radius:4px;padding:14px 16px;font-size:13px;z-index:4;}
  #store h3{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:20px;color:var(--fire);}
  #store h4{margin:12px 0 6px;font-weight:400;font-size:12px;color:var(--ink-dim);letter-spacing:1px;}
  #store .res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  #store .res div{background:#0a080c;border:1px solid var(--line);border-radius:3px;padding:5px 6px;font-variant-numeric:tabular-nums;}
  #store .res small{display:block;font-size:10px;color:var(--ink-dim);}
  #store .list div{padding:3px 0;}
  #store .relic{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line);color:#ffd76a;padding:5px 0;}
  #store .info{margin-top:8px;background:#0a080c;border:1px solid var(--line);border-radius:3px;padding:8px 10px;white-space:pre-wrap;line-height:1.6;font-size:12px;}
  #store .src{margin-top:12px;font-size:10px;color:#5d5361;}
  @media (max-width:640px){ #store .res{grid-template-columns:repeat(3,1fr);} }

  /* 공용 창 */
  .panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:82%;overflow-y:auto;
    background:rgba(14,11,16,.97);border:1px solid var(--line);border-radius:4px;padding:14px 16px;font-size:13px;z-index:6;}
  .panel h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:22px;color:var(--fire);}
  .panel .sub{color:var(--ink-dim);font-size:12px;margin-bottom:10px;}
  .panel .close{position:absolute;top:10px;right:12px;background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:3px;padding:2px 8px;font-size:12px;}
  .tabs{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 10px;}
  .tabs button{background:#0a080c;border:1px solid var(--line);color:var(--ink-dim);border-radius:3px;padding:5px 10px;font-size:12px;}
  .tabs button.on{color:var(--fire);border-color:var(--fire);}
  .tbl{overflow-x:auto;}
  .tbl table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;}
  .tbl th,.tbl td{padding:6px 6px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:top;}
  .tbl th{color:var(--ink-dim);font-weight:400;white-space:nowrap;}
  .tbl td.em{font-size:18px;width:28px;text-align:center;}
  .tbl td .d{color:var(--ink-dim);font-size:11px;line-height:1.5;}
  .tbl tr.click{cursor:pointer;} .tbl tr.click:hover td{background:#1a151d;}
  .tbl .num{text-align:right;white-space:nowrap;}
  .grade{color:#ffd76a;font-size:12px;letter-spacing:1px;}
  .grade.sp{border:1px solid #ffd76a;border-radius:3px;padding:0 5px;font-size:10px;letter-spacing:2px;}
  .sh-head{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;}
  .sh-head canvas{width:64px;height:64px;background:#0a080c;border:1px solid var(--line);border-radius:3px;}
  .sh-name{font-family:var(--display);font-size:22px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
  .chips span{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:#ffc2cc;}
  .hpbar{height:8px;background:#2a1f26;border-radius:2px;overflow:hidden;margin:4px 0 10px;}
  .hpbar i{display:block;height:100%;background:#5cc26a;}
  .srow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .srow small{display:block;color:var(--ink-dim);font-size:11px;}
  .srow b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums;}
  .trait{margin-top:10px;color:var(--ink-dim);font-size:12px;line-height:1.6;}

  /* 전투 테스트 */
  #bt-ui{position:absolute;inset:0;pointer-events:none;}
  #bt-panel{pointer-events:auto;position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;width:240px;max-height:calc(100% - 20px);overflow-y:auto;
    background:rgba(18,14,20,.94);border:1px solid var(--line);border-top:3px solid var(--fire);border-radius:4px;padding:10px 12px;font-size:12px;}
  .bt-title{font-family:var(--display);font-size:21px;color:var(--fire);cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .bt-title small{font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
  #bt-panel.collapsed > :not(.bt-title){display:none;}
  .bt-sec{color:var(--ink-dim);font-size:11px;letter-spacing:1px;margin:10px 0 5px;}
  .bt-tools{display:flex;flex-wrap:wrap;gap:5px;}
  .bt-tools button{background:#0a080c;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:5px 7px;font-size:12px;display:flex;align-items:center;gap:5px;}
  .bt-tools button i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .bt-tools button small{color:#ffd76a;font-size:10px;}
  .bt-tools button.on{border-color:var(--fire);color:var(--fire);}
  .bt-hint{color:var(--ink-dim);font-size:11px;line-height:1.55;margin:10px 0 4px;}
  .bt-row{display:flex;gap:6px;margin-top:6px;}
  .bt-row button{flex:1;background:#0a080c;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:7px 6px;font-size:12px;}
  .bt-row button.primary{background:var(--fire);color:#1a1008;border-color:var(--fire);}
  #bt-log{pointer-events:auto;position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(300px,40%);max-height:34%;overflow-y:auto;
    background:rgba(10,8,12,.86);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:11px;line-height:1.6;}
  #bt-log .crit{color:#ffd35a;} #bt-log .miss{color:#8d8374;} #bt-log .dead{color:#ff8f8f;} #bt-log .sys{color:#9fd3ff;} #bt-log .heal{color:#8ee08e;}
  @media (max-width:640px){ #bt-panel{width:calc(100% - 24px);max-height:44%;} #bt-log{left:12px;right:12px;width:auto;max-height:20%;} }

  #pad{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:16px;display:none;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;}
  #pad button,#act{background:rgba(23,18,26,.72);border:1px solid var(--line);color:var(--ink);border-radius:6px;font-size:17px;touch-action:none;}
  #act{position:absolute;right:20px;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;display:none;font-size:14px;}
  @media (pointer:coarse){ #pad{display:grid;} #act{display:block;} #prompt{bottom:auto;top:calc(110px + env(safe-area-inset-top,0px));} }
</style>

<!-- 1. 텍스트 캐릭터 생성 -->
<section id="creator">
  <h1>굴의 프롤로그</h1>
  <div class="sub">프롤로그 · 노말모드 · 캐릭터 생성</div>
  <div id="log"></div>
  <div id="opts"></div>
  <div id="inrow"><span>&gt;</span><input id="cin" autocomplete="off" placeholder="번호나 텍스트 입력 후 Enter"></div>
</section>

<!-- 2. 굴 (로비) -->
<section id="game" hidden>
  <canvas id="cv"></canvas>
  <div class="hud" id="hud-tl"><b>프롤로그</b> · 노말모드
    <div id="mapline"></div>
    <div id="nextdrop"></div>
    <div id="turnbar"><i></i></div>
    <div id="speed"><button data-s="0" aria-label="일시정지">⏸</button><button data-s="1" aria-label="보통 속도">▶</button><button data-s="4" aria-label="빠르게">▶▶</button></div>
  </div>
  <div class="hud" id="bar"></div>
  <div class="hud" id="hud-tr">
    <button id="btn-store">창고 [C]</button>
    <button id="btn-codex">낙하 목록 [L]</button>
    <button id="btn-stats">스탯 [P]</button>
    <button id="btn-inv">장비 [I]</button>
    <button id="btn-battle">전투 테스트 [B]</button>
    <button id="btn-drop">낙하 테스트</button>
    <button id="btn-remake">캐릭터 다시</button>
  </div>
  <div class="hud" id="prompt" hidden>[Space] 말걸기</div>
  <div class="hud" id="ver"></div>
  <div id="dialog" hidden><div class="who"></div><div class="txt"></div><div class="nx">Space ▶</div></div>
  <div id="inv" hidden></div>
  <div id="store" hidden></div>
  <div id="event" hidden></div>
  <div id="sheet" class="panel" hidden></div>
  <div id="stats" class="panel" hidden></div>
  <div id="codex" class="panel" hidden></div>
  <div id="bt-ui" hidden>
    <div id="bt-panel">
      <div class="bt-title" id="bt-title">전투 테스트 <small>자동 · 접기</small></div>
      <div class="bt-sec">아군 (한 명씩)</div><div class="bt-tools" id="bt-allies"></div>
      <div class="bt-sec">적</div><div class="bt-tools" id="bt-enemies"></div>
      <div class="bt-sec">도구</div>
      <div class="bt-tools" id="bt-misc"><button data-tool="select">🔍 살펴보기</button><button data-tool="erase">🧹 지우기</button></div>
      <div class="bt-hint">유닛을 고르고 바닥을 누르면 그 자리에 소환돼요. 영웅은 다시 누르면 자리를 옮겨요. 방향키로 주인공을 직접 움직일 수 있어요 (공격은 자동).</div>
      <div class="bt-row"><button id="bt-run" class="primary">▶ 전투 시작</button><button id="bt-speed">속도 x1</button></div>
      <div class="bt-row"><button id="bt-reset">↺ 기본 배치</button><button id="bt-clear">비우기</button></div>
      <div class="bt-row"><button id="bt-stats">스탯표 [P]</button><button id="bt-exit">굴로 [B]</button></div>
    </div>
    <div id="bt-log"></div>
  </div>
  <div id="pad">
    <span></span><button data-k="up" aria-label="위">▲</button><span></span>
    <button data-k="left" aria-label="왼쪽">◀</button><span></span><button data-k="right" aria-label="오른쪽">▶</button>
    <span></span><button data-k="down" aria-label="아래">▼</button><span></span>
  </div>
  <button id="act">대화</button>
</section>

<script>
/* =========================================================
   설정
   ========================================================= */
const VERSION = 'v1.4';
const SAVE_KEY = 'cave-game.character.v1';
const ROWS = 5;          // 모든 맵 공통: 세로 5칸
const LOBBY_COLS = 14;   // 굴(로비) 가로 길이 — 우물 같은 굴이라 한 화면에 다 보임
const BATTLE_COLS = 12;  // 전투 테스트 맵 가로 길이
let mode = 'lobby', curCols = LOBBY_COLS;
const OUT = '#16111a';   // 림월드식 외곽선 색

document.getElementById('ver').textContent = VERSION;

/* =========================================================
   1. 텍스트 캐릭터 생성
   ========================================================= */
const GENDERS = [ { id:'f', name:'여자 (단발)' }, { id:'m', name:'남자 (대머리)' } ];
const RACES = [
  { id:'human',  name:'인간',   skin:'#eec39a', scale:1.0,  w:1.0 },
  { id:'goblin', name:'고블린', skin:'#78b84e', scale:0.78, w:1.0 },
  { id:'elf',    name:'엘프',   skin:'#f4dcc2', scale:1.07, w:0.9 },
  { id:'dwarf',  name:'드워프', skin:'#dca47c', scale:0.8,  w:1.3 },
];
const JOBS = [
  { id:'knight', name:'기사',   weapon:{ name:'녹슨 롱소드', icon:'🗡️' }, body:'낡은 사슬갑옷', stat:{힘:6,민첩:3,지능:2} },
  { id:'miner',  name:'광부',   weapon:{ name:'곡괭이',      icon:'⛏️' }, body:'가죽 앞치마',   stat:{힘:5,민첩:3,지능:3} },
  { id:'mage',   name:'마법사', weapon:{ name:'나무 지팡이', icon:'🪄' }, body:'해진 로브',     stat:{힘:2,민첩:3,지능:6} },

const STEPS = [
  { key:'name',   q:'이름이 뭐야?', free:true, def:'무명' },

const logEl = document.getElementById('log');
const optsEl = document.getElementById('opts');
const cin = document.getElementById('cin');
let stepIdx = 0, draft = {}, onAnswer = null;

function say(text, cls='sys'){
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
function setOptions(list, cb){
  optsEl.innerHTML = '';
  list.forEach((label, i) => {
    const b = document.createElement('button'); b.textContent = `${i+1}. ${label}`;
    b.onclick = () => cb(String(i+1)); optsEl.appendChild(b);
  });
}
function visibleSteps(){ return STEPS.filter(s => !s.when || s.when(draft)); }
function ask(){
  while (stepIdx < STEPS.length && STEPS[stepIdx].when && !STEPS[stepIdx].when(draft)) stepIdx++;
  if (stepIdx >= STEPS.length) return summary();
  const s = STEPS[stepIdx];
  const vs = visibleSteps();
  say('');
  say(`[${vs.indexOf(s)+1}/${vs.length}] ${s.q}`, 'q');
  if (s.list){
    s.list.forEach((o,i) => say(`  ${i+1}. ${o.name}`));
    setOptions(s.list.map(o=>o.name), handle);
  } else {
    optsEl.innerHTML = '';
    if (s.def) say(`  (그냥 Enter 치면 "${s.def}")`);
  }
  cin.focus();
}
function handle(raw){
  const v = raw.trim();
  if (onAnswer) return onAnswer(v);
  const s = STEPS[stepIdx];
  if (!s) return;
  if (s.list){
    let idx = parseInt(v,10) - 1;
    if (isNaN(idx)) idx = s.list.findIndex(o => o.name.startsWith(v) && v);
    if (idx < 0 || idx >= s.list.length){ say(`  1~${s.list.length} 중에서 골라줘.`); return; }
    say(`> ${s.list[idx].name}`, 'me');
    draft[s.key] = idx;
  } else {
    const val = (v || s.def).slice(0, 16);
    say(`> ${val || '(없음)'}`, 'me');
    draft[s.key] = val;
  }
  stepIdx++;
  ask();
}
function describe(c){
  const r = RACES[c.race], j = JOBS[c.job], female = c.gender === 0;
  return [
    `  이름   : ${c.name}`,
    `  성별   : ${female ? '여자' : '남자'}`,
    `  종족   : ${r.name}`,
    `  직업   : ${j.name}  (시작 장비: ${j.weapon.icon} ${j.weapon.name})`,
    `  머리   : ${female ? HAIRS[c.hair ?? 0].name + ' 단발' : '대머리'}`,
    `  옷 색  : ${CLOTHS[c.cloth].name}`,
    c.motto ? `  한마디 : "${c.motto}"` : null,
  ].filter(Boolean).join('\n');
}
function summary(){
  say('');
  say('── 캐릭터 확인 ──', 'q');
  say(describe(draft));
  say('이대로 굴에 들어갈까?  1. 들어간다   2. 처음부터 다시', 'q');
  setOptions(['들어간다','처음부터 다시'], handle);

    if (v === '1' || /^y/i.test(v)){

      setTimeout(() => startGame(ch), 700);
    } else if (v === '2' || /^n/i.test(v)){

}
function beginCreator(offerLoad=true){

}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  T = Math.min(84, H / 7.4, (W - 40) / (curCols + ROWS * 0.42 + 1.2));
  rowH = T * 0.6;
  skew = rowH * 0.7;
  const bottomPad = W <= 640 ? 96 : Math.max(24, H * 0.07);
  floorTop = Math.min(H - rowH * ROWS - bottomPad, H / 2 + T * 1.5);
  camX = curCols * T / 2 - W / 2;   // 맵 전체가 화면 가운데
}

function occupied(c, r, self){
  if (c < 0 || c >= LOBBY_COLS || r < 0 || r >= ROWS) return true;
  if (blocked.has(keyOf(c,r))) return true;
  for (const p of [player, karius, goblin, rebecca]) if (p.freed !== false && p !== self && p.c === c && p.r === r) return true;
  return false;
}

function stepPawn(p, dc, dr){
  p.fromX = p.x; p.fromY = p.y; p.c += dc; p.r += dr; p.t = 0;
  if (dc) p.face = dc;
}

/* ---------- 연속 이동: 속도값으로 걷고, 키를 떼면 관성으로 조금 미끄러짐 ---------- */
function moveInput(){
  let dx = 0, dy = 0;
  if (held.has('left')) dx--; if (held.has('right')) dx++;
  if (held.has('up')) dy--;   if (held.has('down')) dy++;
  const l = Math.hypot(dx, dy);
  return l ? { x: dx / l, y: dy / l } : null;
}
function stepMover(m, dt, input, speed, solid){
  if (input){
    const k = Math.min(1, dt * 12);
    m.vx += (input.x * speed - m.vx) * k;
    m.vy += (input.y * speed - m.vy) * k;
  } else {
    const f = Math.exp(-dt * 7);
    m.vx *= f; m.vy *= f;
    if (Math.hypot(m.vx, m.vy) < 0.05){ m.vx = 0; m.vy = 0; }
  }
  const nx = m.x + m.vx * dt;
  if (solid(nx, m.y, m.x, m.y)) m.vx = 0; else m.x = nx;
  const ny = m.y + m.vy * dt;
  if (solid(m.x, ny, m.x, m.y)) m.vy = 0; else m.y = ny;
  if (Math.abs(m.vx) > 0.15) m.face = Math.sign(m.vx);
  m.moving = Math.hypot(m.vx, m.vy) > 0.25;
  if (m.moving) m.walkClock = (m.walkClock || 0) + dt;
}
function lobbySolid(nx, ny, ox, oy){
  if (nx < 0 || nx > LOBBY_COLS - 1 || ny < 0 || ny > ROWS - 1) return true;
  const obs = [[FIRE.c, FIRE.r, 0.7], [karius.x, karius.y, 0.95], [goblin.x, goblin.y, 0.55]];
  if (rebecca.freed) obs.push([rebecca.x, rebecca.y, 0.55]);
  for (const [cx, cy, r] of obs){
    const dn = Math.hypot(nx - cx, ny - cy), d0 = Math.hypot(ox - cx, oy - cy);
    if (dn < r && dn < d0) return true;   // 멀어지는 방향은 허용
  }
  return false;
}
let pStats = null;
function updatePlayerLobby(dt){
  const locked = dialog || scene || anyPanel();
  stepMover(player, dt, locked ? null : moveInput(), pStats.spd, lobbySolid);
  player.c = Math.round(player.x); player.r = Math.round(player.y);
}

function nearestNpc(){
  const d = p => Math.hypot(p.x - player.x, p.y - player.y);
  if (!rebecca.freed){ if (player.y <= 1.4 && Math.abs(player.x - rebecca.c) <= 1.4) return rebecca; }
  else if (d(rebecca) <= 1.4) return rebecca;
  if (d(goblin) <= 1.4) return goblin;
  if (d(karius) <= 2.1) return karius;
  return null;
}

   자유 행동 AI (림월드식)
   ========================================================= */
function assign(p, kind){
  p.kind = kind; p.busy = false;
  let spot;
  if (kind === 'dig') spot = p === goblin ? SPOTS.goblinDig : SPOTS.kariusDig;
  else if (kind === 'fire') spot = p === goblin ? SPOTS.goblinFire : p === rebecca ? SPOTS.rebeccaFire : SPOTS.kariusFire;
  else if (kind === 'sky') spot = SPOTS.sky;
  else if (kind === 'meditate') spot = SPOTS.meditate;
  else {
    for (let i = 0; i < 30; i++){
      const c = 1 + Math.floor(Math.random() * (LOBBY_COLS - 3)), r = Math.floor(Math.random() * ROWS);
      if (!occupied(c, r, p)){ spot = { c, r, face: Math.random() < .5 ? 1 : -1 }; break; }
    }
    spot = spot || { c:p.c, r:p.r, face:p.face };
  }
  p.target = spot;
  p.timer = { fire: 14 + Math.random()*6, meditate: 12 + Math.random()*6, wander: 4 + Math.random()*3, sky: 10 + Math.random()*6 }[kind] || 0;
}

function updatePawn(p, dt){
  if (p.t < 1){
    p.t = Math.min(1, p.t + dt / p.stepTime);
    const e = p.t;
    p.x = p.fromX + (p.c - p.fromX) * e;
    p.y = p.fromY + (p.r - p.fromY) * e;
    p.walkClock += dt;
    return;
  }
  if (dialog && dialog.npc === p) return;
  if (p.target){
    const tc = p.target.c, tr = p.target.r;
    if (p.c === tc && p.r === tr){
      p.face = p.target.face; p.target = null; p.busy = true; return;
    }
    const opts = [];
    if (p.c !== tc) opts.push([Math.sign(tc - p.c), 0]);
    if (p.r !== tr) opts.push([0, Math.sign(tr - p.r)]);
    if (p.wait > 1.2) opts.push([0, p.r < 2 ? 1 : -1], [0, p.r < 2 ? -1 : 1]);
    for (const [dc, dr] of opts){
      if (!occupied(p.c + dc, p.r + dr, p)){ stepPawn(p, dc, dr); p.wait = 0; return; }
    }
    p.wait += dt;
    if (p.wait > 4 && p.kind === 'wander'){ p.wait = 0; assign(p, 'wander'); }
    return;
  }
  // 도착해서 일하는 중
  if (p.kind !== 'dig') p.timer -= dt;
}

function director(dt){
  shiftT -= dt;
  if (shiftT <= 0){
    shift = shift === 'goblin' ? 'karius' : 'goblin';
    shiftT = SHIFT_LEN[shift];
    if (shift === 'karius'){ assign(karius, 'dig'); assign(goblin, 'fire'); addFloater('교대!', karius, '#ffd28a'); }
    else                   { assign(goblin, 'dig'); assign(karius, 'fire'); addFloater('교대!', goblin, '#ffd28a'); }
  }
  // 레베카 (합류 후): 모닥불 → 하늘 바라보기 → 산책
  if (rebecca.freed && !scene && rebecca.busy && rebecca.kind !== 'lying' && rebecca.timer <= 0){
    assign(rebecca, { fire:'sky', sky:'wander', wander:'fire' }[rebecca.kind] || 'fire');
  }
  // 카리우스가 쉬는 차례면 모닥불 → 명상 → 산책 순환
  if (shift === 'goblin' && karius.busy && karius.kind !== 'dig' && karius.timer <= 0){
    const next = { fire:'meditate', meditate:'wander', wander:'fire', idle:'fire' }[karius.kind];
    assign(karius, next);
  }
}

function digEffects(p, dt){
  if (!(p.kind === 'dig' && p.busy)) { p.swing = 0; return; }
  const period = p === karius ? 1.1 : 0.72;
  p.hitClock += dt;
  p.swing = (p.hitClock % period) / period;
  if (p.hitClock >= period){
    p.hitClock -= period;
    const big = p === karius;
    const hit = { x: LOBBY_COLS - 0.05, y: p.r + 0.5 };
    const s = P(hit.x, hit.y);
    const hy = s.y - T * (big ? 1.7 : 0.55);
    floaters.push({ text: big ? '콰앙!' : '캉!', wx: s.x + camX + (Math.random()*16-8), y: hy - T*0.3, color: big ? '#ffe0a0' : '#cfe8ff', life: 1, big });
    for (let i = 0; i < (big ? 12 : 6); i++) sparks.push({ x:s.x + camX, y:hy, vx:-Math.random()*180, vy:-Math.random()*170, life:0.45 });
    if (big) shake = 0.18;
  }
}

/* =========================================================
   업데이트
   ========================================================= */
let shake = 0;
function update(dt){
  time += dt;
  updatePlayerLobby(dt);
  director(dt);
  updatePawn(karius, dt);
  updatePawn(goblin, dt);
  if (rebecca.freed) updatePawn(rebecca, dt);
  digClock = Math.max(0, digClock - dt);
  digEffects(karius, dt);
  digEffects(goblin, dt);

  if (karius.kind === 'meditate' && karius.busy && Math.random() < dt * 0.4) addFloater('…옴', karius, '#9fd0ff');
  if (!rebecca.freed && Math.random() < dt * 0.22) addFloater(['읍!','으읍!!','꺼내줘요…!','(꿈틀꿈틀)'][Math.floor(Math.random()*4)], rebecca, '#ff9aa8', -1.5);

  // 모닥불 불티
  if (Math.random() < dt * 14){
    const f = P(FIRE.c + 0.5, FIRE.r + 0.5);
    embers.push({ wx: f.x + camX + (Math.random()-0.5)*T*0.3, y: f.y - T*0.3, vx:(Math.random()-0.5)*20, vy:-40 - Math.random()*50, life:1 + Math.random() });
  }

  floaters.forEach(f => { f.life -= dt; f.y -= 22 * dt; });
  floaters = floaters.filter(f => f.life > 0);
  sparks.forEach(s => { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 520 * dt; });
  sparks = sparks.filter(s => s.life > 0);
  embers.forEach(e => { e.life -= dt; e.wx += e.vx * dt; e.y += e.vy * dt; });
  embers = embers.filter(e => e.life > 0);
  shake = Math.max(0, shake - dt);
  tickTurn(dt);
  updateFalling(dt);
  updateWeather(dt);
  if (caption){ caption.life -= dt; if (caption.life <= 0) caption = null; }
  updateHud();


  const n = dialog ? null : nearestNpc();
  const pr = document.getElementById('prompt');
  pr.hidden = !n;
  if (n) pr.textContent = n === rebecca && !rebecca.freed && world.rescueAsked ? `[Space] 흙 파내기 (${world.rescue || 0}%)` : `[Space] ${n.name}에게 말걸기`;
  updateBar(n);
}
function addFloater(text, who, color, lift=-1){
  const isR = who === rebecca && !rebecca.freed;
  const p = P((isR ? who.c : who.x) + 0.5, isR ? 0 : who.y + 0.5);
  const h = who === karius ? 3.4 : who === goblin ? 1.2 : 1.15;
  floaters.push({ text, wx: p.x + camX, y: p.y + T * (lift < -1 ? lift : -h), color, life: 1.2 });
}

/* =========================================================
   그리기 — 림월드식: 굵은 외곽선 + 단색 도형
   ========================================================= */
function shape(pathFn, fill, lw=2){
  ctx.beginPath(); pathFn();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.stroke();
}
function circle(x, y, r, fill, lw){ shape(() => ctx.arc(x, y, r, 0, Math.PI*2), fill, lw); }
function limb(x0, y0, cx, cy, x1, y1, w, color){
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.quadraticCurveTo(cx,cy,x1,y1);
  ctx.strokeStyle = OUT; ctx.lineWidth = w + 4; ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
function rrect(x, y, w, h, r){ ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function emoji(ch, x, y, size, rot=0){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${Math.round(size)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 0, 0);
  ctx.restore();
}
function hash(a, b){ const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }

function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*6*shake/0.18, (Math.random()-0.5)*4*shake/0.18);
  ctx.fillStyle = '#060408'; ctx.fillRect(-10,-10,W+20,H+20);

  drawWall();
  drawFloor();
  if (!rebecca.freed) drawRebecca();
  drawGate();

  const list = [
    { y: player.y, fn: drawPlayerPawn },
    { y: karius.y, fn: () => drawKarius(karius) },
    { y: goblin.y, fn: () => drawGoblin(goblin) },
    { y: FIRE.r - 0.01, fn: drawFire },
  ];
  if (rebecca.freed) list.push({ y: rebecca.y, fn: () => drawRebeccaFigure(rebecca) });
  list.sort((a,b) => a.y - b.y);
  list.forEach(o => o.fn());
  drawFalling();

  // 불빛 (가산 합성)
  const f = P(FIRE.c + 0.5, FIRE.r + 0.5);
  const flick = 0.85 + Math.sin(time*13)*0.06 + Math.sin(time*7.3)*0.05;
  ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createRadialGradient(f.x, f.y - T*0.3, 0, f.x, f.y - T*0.3, T*4.2*flick);
  lg.addColorStop(0, 'rgba(255,150,60,.34)'); lg.addColorStop(0.4, 'rgba(255,110,40,.12)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg; ctx.fillRect(0,0,W,H);
  // 우물 위에서 떨어지는 희미한 빛
  const mc = P(LOBBY_COLS/2, 2.5);
  const sh = ctx.createLinearGradient(0, 0, 0, mc.y + rowH*2);
  sh.addColorStop(0, 'rgba(150,180,220,.10)'); sh.addColorStop(1, 'rgba(150,180,220,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.moveTo(mc.x - T*1.2, 0); ctx.lineTo(mc.x + T*1.2, 0); ctx.lineTo(mc.x + T*2.6, mc.y + rowH*2); ctx.lineTo(mc.x - T*2.6, mc.y + rowH*2); ctx.fill();
  ctx.fillStyle = '#ffb35a';
  embers.forEach(e => { ctx.globalAlpha = Math.min(1, e.life); ctx.fillRect(e.wx - camX, e.y, 2, 2); });
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  sparks.forEach(s => { ctx.fillStyle = s.c || '#ffe9a8'; ctx.fillRect(s.x - camX, s.y, 2.5, 2.5); });
  drawWeather();

  // 이름표 (림월드처럼 발밑)
  labelUnder(player, character.name, '#f3e6c8');
  labelUnder(karius, '카리우스', '#bfe0f5');
  labelUnder(goblin, '청광묵', '#c7eec9');
  if (rebecca.freed) labelUnder(rebecca, '레베카', '#ffc2cc');
  else {
    const rp = P(rebecca.c + 0.5, 0.35);
    tag('레베카', rp.x, rp.y + T*0.1, '#ffc2cc');
    if (world.rescue){
      const bw = T*0.9;
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(rp.x - bw/2, rp.y + T*0.3, bw, 5);
      ctx.fillStyle = '#c9a36a'; ctx.fillRect(rp.x - bw/2, rp.y + T*0.3, bw * world.rescue / 100, 5);
    }
  }

  ctx.textAlign = 'center';
  floaters.forEach(fl => {
    ctx.globalAlpha = Math.min(1, fl.life * 2);
    ctx.font = `${Math.round(T*(fl.big ? 0.36 : 0.26))}px "Do Hyeon",sans-serif`;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText(fl.text, fl.wx - camX, fl.y);
    ctx.fillStyle = fl.color; ctx.fillText(fl.text, fl.wx - camX, fl.y);
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  const vg = ctx.createRadialGradient(W/2, H*0.62, H*0.25, W/2, H*0.62, Math.max(W,H)*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  if (flash > 0){ ctx.fillStyle = `rgba(230,235,255,${flash})`; ctx.fillRect(0,0,W,H); }
  if (caption){
    ctx.globalAlpha = Math.min(1, caption.life, (caption.max - caption.life) * 3);
    ctx.font = `${Math.round(Math.max(20, T*0.42))}px "Do Hyeon",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.8)';
    ctx.strokeText(caption.text, W/2, H*0.3);
    ctx.fillStyle = '#eadfcb'; ctx.fillText(caption.text, W/2, H*0.3);
    ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
  }
}

function drawWall(){
  const a = P(0,0), b = P(curCols,0);
  const top = floorTop - T * 3.4;
  const g = ctx.createLinearGradient(0, top, 0, floorTop);
  g.addColorStop(0,'rgba(40,32,40,0)'); g.addColorStop(0.35,'#2a222b'); g.addColorStop(1,'#3b2f37');
  ctx.fillStyle = g;
  ctx.fillRect(a.x, top, b.x - a.x, floorTop - top);
  // 암석 덩어리
  for (let c = 0; c < curCols; c += 0.7){
    const p = P(c, 0);
    if (p.x < -T || p.x > W + T) continue;
    for (let k = 0; k < 3; k++){
      const hv = hash(c, k);
      if (hv < 0.45) continue;
      ctx.fillStyle = `rgba(0,0,0,${0.12 + hv*0.12})`;
      ctx.beginPath();
      ctx.ellipse(p.x + hv*T*0.4, floorTop - T*(0.4 + k*0.75 + hv*0.3), T*(0.18 + hv*0.2), T*(0.1 + hv*0.08), hv, 0, Math.PI*2);
      ctx.fill();
    }
  }
  // 벽 아래 턱
  ctx.fillStyle = '#1c161d';
  ctx.fillRect(a.x, floorTop - 4, b.x - a.x, 4);
  // 레베카 옆 갈라진 틈 (구불구불)
  const cr = P(2.5,0);
  ctx.strokeStyle = '#0c090d'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 12; i++){
    const y = floorTop - i * T * 0.26, x = cr.x + Math.sin(i * 1.4) * 6;
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
  // 좌우 끝 암벽
  ctx.fillStyle = '#09070b';
  const l0 = P(0,0), l1 = P(0,ROWS);
  ctx.beginPath(); ctx.moveTo(l0.x, top); ctx.lineTo(l0.x, l0.y); ctx.lineTo(l1.x, l1.y + 12); ctx.lineTo(l1.x - W, l1.y + 12); ctx.lineTo(l0.x - W, top); ctx.fill();
  const r0 = P(curCols,0), r1 = P(curCols,ROWS);
  ctx.beginPath(); ctx.moveTo(r0.x, top); ctx.lineTo(r0.x, r0.y); ctx.lineTo(r1.x, r1.y + 12); ctx.lineTo(r1.x + W, r1.y + 12); ctx.lineTo(r0.x + W, top); ctx.fill();
}

function drawFloor(){
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < curCols; c++){
      const a = P(c,r), b = P(c+1,r), d = P(c+1,r+1), e = P(c,r+1);
      if (b.x < -skew*6 || a.x > W + skew*6) continue;
      const hv = hash(c, r);
      const base = 44 + r*4 + hv*8;
      ctx.fillStyle = `rgb(${base+10|0},${base+2|0},${base-4|0})`;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(d.x,d.y); ctx.lineTo(e.x,e.y); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
      // 자갈
      if (hv > 0.55){
        const q = P(c + 0.2 + hash(r,c)*0.6, r + 0.3 + hv*0.4);
        ctx.fillStyle = 'rgba(0,0,0,.28)';
        ctx.beginPath(); ctx.ellipse(q.x, q.y, T*0.06, T*0.03, 0, 0, Math.PI*2); ctx.fill();
      }
    }
  }
  const f0 = P(0,ROWS), f1 = P(curCols,ROWS);
  ctx.fillStyle = '#1b1519';
  ctx.fillRect(f0.x, f0.y, f1.x - f0.x, 12);
}

function drawGate(){
  // 석문 — 바닥 오른쪽 대각선 테두리 위에 반투명하게 서 있음
  const B0 = P(LOBBY_COLS, 0), B1 = P(LOBBY_COLS, ROWS);
  const Hg = T * 3.9;
  // 문 로컬 좌표(u: 뒤→앞 0~1, v: 바닥→위 0~1)를 화면으로
  const G = (u, v) => ({ x: B0.x + (B1.x - B0.x)*u, y: B0.y + (B1.y - B0.y)*u - Hg*v });
  const outline = () => {
    const p0 = G(0,0), p1 = G(1,0), p2 = G(1,0.82), p3 = G(0,0.82), top = G(0.5,1.08);
    ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
    ctx.quadraticCurveTo(top.x, top.y, p3.x, p3.y); ctx.closePath();
  };
  // 바닥에 드리운 그림자
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); const s0 = G(0,0), s1 = G(1,0);
  ctx.moveTo(s0.x, s0.y); ctx.lineTo(s1.x, s1.y); ctx.lineTo(s1.x - T*0.35, s1.y); ctx.lineTo(s0.x - T*0.35, s0.y); ctx.fill();
  // 반투명 문짝
  const gl = 0.5 + Math.sin(time*1.5)*0.5;
  const g = ctx.createLinearGradient(G(0,0.9).x, G(0,0.9).y, G(1,0).x, G(1,0).y);
  g.addColorStop(0, 'rgba(120,112,135,.42)'); g.addColorStop(1, 'rgba(70,64,82,.32)');
  ctx.beginPath(); outline(); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(22,17,26,.85)'; ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(210,200,230,.35)'; ctx.stroke();
  // 가운데 이음새
  ctx.strokeStyle = 'rgba(22,17,26,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); let q = G(0.5,0); ctx.moveTo(q.x,q.y); q = G(0.5,0.98); ctx.lineTo(q.x,q.y); ctx.stroke();
  // 문양 (문 면을 따라 기울어진 원)
  ctx.save();
  const o = G(0,0);
  ctx.transform(B1.x - B0.x, B1.y - B0.y, 0, -Hg, o.x, o.y);
  ctx.beginPath(); ctx.ellipse(0.5, 0.58, 0.28, 0.13, 0, 0, Math.PI*2);
  ctx.moveTo(0.64, 0.58); ctx.ellipse(0.5, 0.58, 0.14, 0.065, 0, 0, Math.PI*2);
  ctx.restore();
  ctx.strokeStyle = `rgba(150,200,255,${0.25 + gl*0.2})`; ctx.lineWidth = 2; ctx.stroke();
  // 파인 자국
  ctx.fillStyle = 'rgba(10,8,12,.45)';
  [[0.28,0.15],[0.72,0.42],[0.3,0.24],[0.66,0.12]].forEach(([u,v], i) => {
    const m = G(u, v);
    ctx.beginPath(); ctx.ellipse(m.x, m.y, T*0.12, T*0.2, 0.5 + i*0.2, 0, Math.PI*2); ctx.fill();
  });
}

function drawFire(){
  const p = P(FIRE.c + 0.5, FIRE.r + 0.5);
  // 돌 테두리
  for (let i = 0; i < 8; i++){
    const a = i / 8 * Math.PI * 2;
    circle(p.x + Math.cos(a)*T*0.3, p.y + Math.sin(a)*T*0.1, T*0.07, '#5b545c', 1.5);
  }
  // 장작
  ctx.save(); ctx.translate(p.x, p.y - T*0.05);
  [-0.4, 0.4].forEach(rot => { ctx.save(); ctx.rotate(rot); shape(() => rrect(-T*0.28, -T*0.05, T*0.56, T*0.1, T*0.04), '#6b4326', 1.5); ctx.restore(); });
  ctx.restore();
  // 불꽃
  const layers = [['#e2442a', 0.5, 0.26], ['#ff9d3c', 0.38, 0.19], ['#ffe07a', 0.24, 0.1]];
  layers.forEach(([col, h, w], i) => {
    const fl = 1 + Math.sin(time*11 + i*2)*0.12 + Math.sin(time*17 + i)*0.06;
    ctx.beginPath();
    ctx.moveTo(p.x - T*w, p.y - T*0.05);
    ctx.quadraticCurveTo(p.x - T*w*0.8, p.y - T*h*0.6*fl, p.x + Math.sin(time*6 + i)*T*0.04, p.y - T*h*fl);
    ctx.quadraticCurveTo(p.x + T*w*0.8, p.y - T*h*0.6*fl, p.x + T*w, p.y - T*0.05);
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  });
}

/* ---------- 레베카: 벽에 박혀 꿈틀 ---------- */
function drawRebecca(){
  const p = P(rebecca.c + 0.5, 0);
  const cx = p.x + Math.sin(time * 5) * T * 0.03, wallY = p.y - T*0.95;
  const u = T;
  // 벽 구멍
  ctx.fillStyle = '#0b080c';
  const grow = 1 + (world.rescue || 0) / 250;
  ctx.beginPath(); ctx.ellipse(p.x, wallY - u*0.05, u*0.44*grow, u*0.38*grow, 0, 0, Math.PI*2); ctx.fill();
  // 구멍 틈으로 흘러나온 루비색 장발
  for (let i = 0; i < 7; i++){
    const sx = p.x + (i - 3) * u*0.12, side = i < 3.5 ? -1 : 1;
    const sway = Math.sin(time*2.4 + i) * u*0.04;
    ctx.beginPath();
    ctx.moveTo(sx, wallY - u*0.3);
    ctx.quadraticCurveTo(sx + side*u*0.35, wallY + u*0.1, sx + side*u*(0.25 + Math.abs(i-3)*0.06) + sway, p.y - u*0.05 - (i%3)*u*0.08);
    ctx.strokeStyle = i % 2 ? '#9e1731' : '#c2253f'; ctx.lineWidth = u*0.07; ctx.lineCap = 'round'; ctx.stroke();
  }
  // 다리 (판금 정강이, 번갈아 버둥)
  const k1 = Math.sin(time * 8) * u*0.07, k2 = Math.sin(time * 8 + 2) * u*0.07;
  limb(cx - u*0.13, wallY + u*0.15, cx - u*0.2, wallY + u*0.5, cx - u*0.22 + k1, p.y - u*0.12, u*0.12, '#b7bec8');
  limb(cx + u*0.13, wallY + u*0.15, cx + u*0.2, wallY + u*0.5, cx + u*0.24 + k2, p.y - u*0.16, u*0.12, '#b7bec8');
  shape(() => rrect(cx - u*0.32 + k1, p.y - u*0.18, u*0.2, u*0.1, u*0.03), '#5c616b', 1.5);
  shape(() => rrect(cx + u*0.14 + k2, p.y - u*0.22, u*0.2, u*0.1, u*0.03), '#5c616b', 1.5);
  // 엉덩이 판금 + 루비 천
  const wob = Math.sin(time * 8) * 1.5;
  shape(() => { ctx.moveTo(cx - u*0.36, wallY - u*0.12); ctx.lineTo(cx + u*0.36, wallY - u*0.12); ctx.lineTo(cx + u*0.3, wallY + u*0.25); ctx.lineTo(cx - u*0.3, wallY + u*0.25); ctx.closePath(); }, '#a01c35', 2);
  circle(cx - u*0.15, wallY + wob, u*0.2, '#c9d0d8', 2);
  circle(cx + u*0.15, wallY - wob, u*0.2, '#c9d0d8', 2);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(cx - u*0.2, wallY - u*0.08 + wob, u*0.06, u*0.03, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + u*0.1, wallY - u*0.08 - wob, u*0.06, u*0.03, -0.5, 0, Math.PI*2); ctx.fill();
}

/* ---------- 플레이어: 여자 단발 / 남자 대머리 ---------- */
function drawPlayerPawn(){ drawPlayerFigure(player); }
function walkBob(o){ return o.moving ? Math.abs(Math.sin(o.walkClock * 11)) * T * 0.025 : Math.sin(time*2) * T * 0.006; }
function drawPlayerFigure(o){
  const race = RACES[character.race];
  const p = P(o.x + 0.5, o.y + 0.5);
  const u = T * depthScale(o.y) * race.scale;
  shadowAt(p.x, p.y, u*0.3);
  drawHumanoid({
    x: p.x, y: p.y - walkBob(o), u, face: o.face, skin: race.skin, cloth: CLOTHS[character.cloth].c, bw: race.w,
    female: character.gender === 0, hair: HAIRS[character.hair ?? 0].c, race: race.id, tool: JOBS[character.job].weapon.icon,
  });
}
/* ---------- 레베카 (합류 후): 루비색 장발, 판금 갑옷, 장검 ---------- */
const REBECCA_LOOK = { skin:'#f3d5c0', cloth:'#c3cad3', bw:1.0, female:true, longHair:true, hair:'#c2253f', race:'human', tool:'🗡️', armor:true };
function drawRebeccaFigure(o){
  const p = P(o.x + 0.5, o.y + 0.5);
  const u = T * depthScale(o.y) * 0.95;
  shadowAt(p.x, p.y, u*0.3);
  if (o.kind === 'lying' && o.busy !== false){
    ctx.save(); ctx.translate(p.x, p.y - u*0.12); ctx.rotate(-Math.PI/2);
    drawHumanoid({ ...REBECCA_LOOK, x: 0, y: u*0.35, u, face: 1, tool: null });
    ctx.restore();
    return;
  }
  drawHumanoid({ ...REBECCA_LOOK, x: p.x, y: p.y - walkBob(o), u, face: o.face });
}
function drawEnemyGoblin(o){
  const p = P(o.x + 0.5, o.y + 0.5);
  const u = T * depthScale(o.y) * 0.8;
  shadowAt(p.x, p.y, u*0.3);
  drawHumanoid({ x: p.x, y: p.y - walkBob(o), u, face: o.face, skin:'#6f9e3f', cloth:'#5b4630', bw:1.1, female:false, race:'goblin', tool:'🔪', eye:'#e2443a' });
}

function drawHumanoid(o){
  const { x, y, u, face } = o;
  const bw = u * 0.44 * o.bw;
  // 뒷머리 (장발은 몸 뒤로 길게)
  if (o.longHair){
    const lhx = x + face*u*0.02, lhy = y - u*0.8, lhr = u*0.21;
    shape(() => rrect(lhx - lhr*1.18, lhy - lhr*1.1, lhr*2.36, u*0.8, [lhr, lhr, lhr*0.6, lhr*0.6]), o.hair);
  }
  // 몸통 (림월드식 둥근 몸)
  shape(() => rrect(x - bw/2, y - u*0.58, bw, u*0.56, [u*0.2, u*0.2, u*0.12, u*0.12]), o.cloth);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fillRect(x - bw/2 + 2, y - u*0.14, bw - 4, u*0.1);
  if (o.armor){
    ctx.fillStyle = '#9e1731'; ctx.fillRect(x - bw/2 + 1, y - u*0.3, bw - 2, u*0.07);
    circle(x - bw*0.46, y - u*0.5, u*0.1, '#e1e6ec', 1.5);
    circle(x + bw*0.46, y - u*0.5, u*0.1, '#e1e6ec', 1.5);
  }
  // 손
  circle(x + face*bw*0.55, y - u*0.28, u*0.07, o.skin, 1.5);
  if (o.tool) emoji(o.tool, x + face*bw*0.75, y - u*0.42, u*0.34, face*0.4);
  const hx = x + face*u*0.02, hy = y - u*0.8, hr = u*0.21;
  // 뒷머리 (단발)
  if (o.female && !o.longHair) shape(() => rrect(hx - hr*1.14, hy - hr*1.12, hr*2.28, hr*1.78, [hr, hr, hr*0.2, hr*0.2]), o.hair);
  // 귀
  if (o.race === 'goblin' || o.race === 'elf'){
    const L = o.race === 'goblin' ? 0.34 : 0.22;
    [-1,1].forEach(d => shape(() => { ctx.moveTo(hx + d*hr*0.75, hy - hr*0.15); ctx.lineTo(hx + d*(hr + u*L), hy - hr*0.75); ctx.lineTo(hx + d*hr*0.8, hy + hr*0.35); ctx.closePath(); }, o.skin, 1.5));
  }
  // 머리
  circle(hx, hy, hr, o.skin);
  if (o.female){
    // 앞머리
    shape(() => { ctx.arc(hx, hy - hr*0.05, hr*1.08, Math.PI*1.02, Math.PI*1.98); ctx.lineTo(hx + hr*0.95, hy - hr*0.2); ctx.lineTo(hx - hr*0.95, hy - hr*0.2); ctx.closePath(); }, o.hair);
  } else {
    // 대머리 광택
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.ellipse(hx - face*hr*0.3, hy - hr*0.55, hr*0.28, hr*0.13, -0.4*face, 0, Math.PI*2); ctx.fill();
  }
  if (o.race === 'dwarf') shape(() => { ctx.moveTo(hx - hr*0.75, hy + hr*0.25); ctx.quadraticCurveTo(hx, hy + hr*2.1, hx + hr*0.75, hy + hr*0.25); ctx.closePath(); }, o.female ? o.hair : '#6d4a2c', 1.5);
  // 눈
  ctx.fillStyle = o.eye || OUT;
  ctx.beginPath(); ctx.arc(hx + face*hr*0.15 - hr*0.28, hy + hr*0.05, hr*0.1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + face*hr*0.15 + hr*0.28, hy + hr*0.05, hr*0.1, 0, Math.PI*2); ctx.fill();
}

/* ---------- 청광묵: 작은 고블린 소녀 ---------- */
function drawGoblin(g){
  const p = P(g.x + 0.5, g.y + 0.5);
  const u = T * depthScale(g.y) * 0.72;
  const sitting = g.kind === 'fire' && g.busy;
  const walking = g.t < 1;
  const y = p.y - (walking ? Math.abs(Math.sin(g.walkClock*14)) * T*0.05 : 0) + (sitting ? u*0.16 : 0);
  const x = p.x, face = g.face;
  shadowAt(x, p.y, u*0.34);
  const skin = '#78b84e', hair = '#2c5a3c';
  // 양갈래
  circle(x - u*0.3, y - u*0.98, u*0.12, hair);
  circle(x + u*0.3, y - u*0.98, u*0.12, hair);
  // 원피스
  shape(() => { ctx.moveTo(x - u*0.16, y - u*0.58); ctx.lineTo(x + u*0.16, y - u*0.58); ctx.lineTo(x + u*0.28, y - (sitting ? u*0.14 : u*0.04)); ctx.lineTo(x - u*0.28, y - (sitting ? u*0.14 : u*0.04)); ctx.closePath(); }, '#8a5a2e');
  if (!sitting){
    ctx.fillStyle = OUT;
    ctx.fillRect(x - u*0.14, y - u*0.05, u*0.09, u*0.06);
    ctx.fillRect(x + u*0.05, y - u*0.05, u*0.09, u*0.06);
  }
  // 곡괭이질
  if (g.kind === 'dig' && g.busy){
    const sw = g.swing;
    const ang = sw < 0.65 ? -2.3 + (sw/0.65)*0.5 : -1.8 + ((sw-0.65)/0.35)*2.3;
    const sx = x + u*0.12, sy = y - u*0.5;
    const hx = sx + Math.cos(ang)*u*0.3, hy = sy + Math.sin(ang)*u*0.3;
    limb(sx, sy, (sx+hx)/2, (sy+hy)/2, hx, hy, u*0.08, skin);
    emoji('⛏️', hx + Math.cos(ang)*u*0.15, hy + Math.sin(ang)*u*0.15, u*0.55, ang + Math.PI*0.75);
  } else {
    circle(x + face*u*(sitting ? 0.3 : 0.22), y - u*(sitting ? 0.38 : 0.3), u*0.07, skin, 1.5);
    if (g.weapon) emoji(g.weapon, x + face*u*0.34, y - u*0.44, u*0.42, face*0.4);
  }
  // 머리 + 큰 귀
  const hx = x + face*u*0.03, hy = y - u*0.82, hr = u*0.24;
  [-1,1].forEach(d => shape(() => { ctx.moveTo(hx + d*hr*0.7, hy - hr*0.2); ctx.lineTo(hx + d*(hr + u*0.36), hy - hr*0.55); ctx.lineTo(hx + d*hr*0.75, hy + hr*0.35); ctx.closePath(); }, skin, 1.5));
  circle(hx, hy, hr, skin);
  shape(() => { ctx.arc(hx, hy - hr*0.1, hr*1.04, Math.PI*1.05, Math.PI*1.95); ctx.lineTo(hx + hr*0.8, hy - hr*0.35); ctx.lineTo(hx - hr*0.8, hy - hr*0.35); ctx.closePath(); }, hair);
  ctx.fillStyle = OUT;
  ctx.beginPath(); ctx.arc(hx + face*hr*0.2 - hr*0.28, hy + hr*0.08, hr*0.11, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + face*hr*0.2 + hr*0.28, hy + hr*0.08, hr*0.11, 0, Math.PI*2); ctx.fill();
  if (g.kind === 'dig') jobIcon('⛏️', hx, hy - hr - u*0.45);
}

/* ---------- 카리우스: 3m 실험체, 다리 여섯, 팔 넷, 대머리 안경 ---------- */
function drawKarius(k){
  const p = P(k.x + 0.5, k.y + 0.5);
  const u = T * depthScale(k.y);
  const x = p.x, face = k.face;
  const walking = k.t < 1;
  const sitting = (k.kind === 'fire' || k.kind === 'meditate') && k.busy;
  const med = k.kind === 'meditate' && k.busy;
  const float = med ? Math.sin(time*1.6)*u*0.06 - u*0.12 : 0;
  const y = p.y + float;
  const skin = '#b9aeb9', skinDark = '#8c8190';
  shadowAt(x, p.y, u*0.95);

  if (med){
    ctx.strokeStyle = `rgba(140,200,255,${0.25 + Math.sin(time*2)*0.1})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, p.y, u*(1.0 + Math.sin(time*2)*0.08), u*0.3, 0, 0, Math.PI*2); ctx.stroke();
  }

  const pelvisY = y - (sitting ? u*0.5 : u*1.05);
  const torsoH = u*1.4, torsoTop = pelvisY - torsoH;
  // 다리 여섯
  for (let i = 0; i < 6; i++){
    const side = i < 3 ? -1 : 1, k3 = i % 3;
    const hipX = x + side*u*(0.12 + k3*0.13);
    let fx, fy, kx, ky;
    if (sitting){
      fx = x + side*u*(0.55 + k3*0.28); fy = y - k3*u*0.02;
      kx = hipX + side*u*(0.45 + k3*0.15); ky = pelvisY - u*(0.45 - k3*0.08);
    } else {
      const lift = walking ? Math.max(0, Math.sin(k.walkClock*9 + i*1.05 + side)) * u*0.15 : 0;
      fx = x + side*u*(0.3 + k3*0.3); fy = y - lift - (k3 === 1 ? u*0.04 : 0);
      kx = hipX + side*u*(0.55 + k3*0.12); ky = pelvisY + u*0.1;
    }
    limb(hipX, pelvisY, kx, ky, fx, fy, u*0.13, i % 2 ? skinDark : skin);
  }
  // 허리천
  shape(() => rrect(x - u*0.5, pelvisY - u*0.28, u*1.0, u*0.36, u*0.1), '#4a4452');
  // 몸통
  const bob = walking ? Math.sin(k.walkClock*9)*u*0.03 : Math.sin(time*1.8)*u*0.015;
  shape(() => rrect(x - u*0.52, torsoTop + bob, u*1.04, torsoH - u*0.2, [u*0.42, u*0.42, u*0.2, u*0.2]), skin);
  // 봉합 자국 + 실험체 번호표
  ctx.strokeStyle = 'rgba(40,20,40,.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - u*0.3, torsoTop + u*0.5 + bob); ctx.lineTo(x + u*0.3, torsoTop + u*0.62 + bob); ctx.stroke();
  for (let i = 0; i < 5; i++){
    const sx = x - u*0.25 + i*u*0.12, sy = torsoTop + u*0.52 + i*u*0.024 + bob;
    ctx.beginPath(); ctx.moveTo(sx, sy - u*0.04); ctx.lineTo(sx, sy + u*0.04); ctx.stroke();
  }
  shape(() => rrect(x + face*u*0.1 - u*0.14, torsoTop + u*0.78 + bob, u*0.28, u*0.16, 2), '#d8d2c0', 1.5);
  ctx.fillStyle = OUT; ctx.font = `${Math.round(u*0.1)}px "Nanum Gothic Coding",monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('E-07', x + face*u*0.1, torsoTop + u*0.86 + bob);
  ctx.textBaseline = 'alphabetic';

  // 팔 넷 (위 2, 아래 2)
  const shY = torsoTop + u*0.28 + bob, loY = torsoTop + u*0.75 + bob;
  const arms = [
    { sx: x - u*0.5, sy: shY, side:-1, upper:true },
    { sx: x + u*0.5, sy: shY, side: 1, upper:true },
    { sx: x - u*0.48, sy: loY, side:-1, upper:false },
    { sx: x + u*0.48, sy: loY, side: 1, upper:false },
  ];
  const digging = k.kind === 'dig' && k.busy;
  arms.forEach((a, i) => {
    let hx, hy, cx, cy;
    const sway = Math.sin(time*1.7 + i) * u*0.04;
    if (med){
      if (a.upper){ hx = x + a.side*u*0.08; hy = torsoTop + u*0.95 + bob; }
      else { hx = x + a.side*u*0.75; hy = pelvisY - u*0.15; }
      cx = a.sx + a.side*u*0.35; cy = (a.sy + hy)/2;
    } else if (k.kind === 'fire' && k.busy){
      hx = x + face*u*(a.upper ? 0.95 : 0.8) + sway; hy = a.sy + u*(a.upper ? 0.35 : 0.3);
      cx = (a.sx + hx)/2; cy = a.sy + u*0.4;
    } else if (digging && a.upper && a.side === face){
      const sw = k.swing;
      const ang = sw < 0.6 ? -2.4 + (sw/0.6)*0.4 : -2.0 + ((sw-0.6)/0.4)*2.4;
      hx = a.sx + Math.cos(ang)*u*0.7*face; hy = a.sy + Math.sin(ang)*u*0.7;
      cx = (a.sx + hx)/2 + face*u*0.1; cy = (a.sy + hy)/2;
      a.pick = { hx, hy, ang };
    } else {
      hx = a.sx + a.side*u*(a.upper ? 0.25 : 0.3) + sway; hy = a.sy + u*(a.upper ? 0.85 : 0.6);
      cx = a.sx + a.side*u*0.3; cy = (a.sy + hy)/2;
    }
    limb(a.sx, a.sy, cx, cy, hx, hy, u*0.13, a.upper ? skin : skinDark);
    circle(hx, hy, u*0.1, a.upper ? skin : skinDark, 1.5);
    if (a.pick){
      const ang = face > 0 ? a.pick.ang : Math.PI - a.pick.ang;
      emoji('⛏️', hx + Math.cos(ang)*u*0.25, hy + Math.sin(ang)*u*0.25, u*0.8, ang + Math.PI*0.75);
    }
  });

  // 머리: 대머리 + 둥근 안경
  const hx = x + face*u*0.05, hy = torsoTop - u*0.2 + bob, hr = u*0.3;
  circle(hx, hy, hr, skin);
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.ellipse(hx - face*hr*0.3, hy - hr*0.6, hr*0.3, hr*0.12, -0.3*face, 0, Math.PI*2); ctx.fill();
  const gx = hx + face*hr*0.25, gy = hy + hr*0.02, lr = hr*0.26;
  if (med){
    ctx.strokeStyle = OUT; ctx.lineWidth = 2;
    [-1,1].forEach(d => { ctx.beginPath(); ctx.arc(gx + d*lr*1.15, gy + lr*0.1, lr*0.5, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke(); });
  } else {
    ctx.fillStyle = OUT;
    [-1,1].forEach(d => { ctx.beginPath(); ctx.arc(gx + d*lr*1.15, gy, lr*0.28, 0, Math.PI*2); ctx.fill(); });
  }
  ctx.strokeStyle = OUT; ctx.lineWidth = 2.5;
  [-1,1].forEach(d => {
    ctx.beginPath(); ctx.arc(gx + d*lr*1.15, gy, lr, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(190,225,255,.28)'; ctx.fill(); ctx.stroke();
  });
  ctx.beginPath(); ctx.moveTo(gx - lr*0.2, gy); ctx.lineTo(gx + lr*0.2, gy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(gx - face*lr*2.15, gy); ctx.lineTo(hx - face*hr*0.95, gy - hr*0.1); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillRect(gx - lr*1.5, gy - lr*0.55, lr*0.3, lr*0.18);
  ctx.beginPath(); ctx.moveTo(hx + face*hr*0.05, hy + hr*0.55); ctx.lineTo(hx + face*hr*0.45, hy + hr*0.5); ctx.stroke();

  if (digging || k.kind === 'dig') jobIcon('⛏️', hx, hy - hr - u*0.4);
  if (med) jobIcon('🧘', hx, hy - hr - u*0.4);
}

function jobIcon(ch, x, y){
  const r = T*0.2;
  circle(x, y, r, 'rgba(23,18,26,.9)', 1.5);
  emoji(ch, x, y + 1, r*1.3);
}
function shadowAt(x, y, r){
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(x, y, r, r*0.3, 0, 0, Math.PI*2); ctx.fill();
}
function labelUnder(p, text, color){
  const q = P(p.x + 0.5, p.y + 0.5);
  tag(text, q.x, q.y + T*0.3, color);
}
function tag(text, x, y, color){
  ctx.font = `${Math.round(Math.max(11, T*0.18))}px "Nanum Gothic Coding",monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + 8;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(x - w/2, y - T*0.12, w, T*0.24);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.textBaseline = 'alphabetic';
}

/* ---------- 림월드식 캐릭터 바 ---------- */
const barEl = document.getElementById('bar');
const barItems = {};
function buildBar(){
  barEl.innerHTML = '';
  [['player', character.name], ['rebecca','레베카'], ['karius','카리우스'], ['goblin','청광묵']].forEach(([id, name]) => {
    const d = document.createElement('div'); d.className = 'pi';
    d.onclick = () => openSheet(id);
    const c = document.createElement('canvas'); c.width = 80; c.height = 80;
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = name;
    const jb = document.createElement('div'); jb.className = 'job';
    d.append(c, nm, jb); barEl.appendChild(d);
    barItems[id] = { el:d, job:jb };
    drawPortrait(c, id);
  });
}
function drawPortrait(c, id){
  const g = c.getContext('2d');
  g.clearRect(0,0,80,80);
  // 같은 그리기 함수를 초상화용 캔버스로 재사용
  withCtx(g, () => {
    if (id === 'player'){
      const r = RACES[character.race];
      drawHumanoid({ x:40, y:120, u:95*r.scale, face:1, skin:r.skin, cloth:CLOTHS[character.cloth].c, bw:r.w, female:character.gender === 0, hair:HAIRS[character.hair ?? 0].c, race:r.id });
    } else if (id === 'rebecca'){
      drawHumanoid({ ...REBECCA_LOOK, x:40, y:120, u:95, face:1, tool:null });
    } else if (id === 'enemyGoblin'){
      drawHumanoid({ x:40, y:118, u:88, face:1, skin:'#6f9e3f', cloth:'#5b4630', bw:1.1, female:false, race:'goblin', eye:'#e2443a' });
    } else if (id === 'karius'){

/* ---------- CSV ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ','){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(c => c.trim()))
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
function toDrop(o){
  return { type: o['종류'], emoji: o['이모지'] || '❔', name: o['이름'], desc: o['설명'], fx: o['변동'] || '',
    weight: +o['가중치'] || 0, min: +o['최소턴'] || 1, max: o['최대턴'] ? +o['최대턴'] : Infinity,
    last: /^y/i.test(o['마지막칸'] || '') };
}
async function loadDrops(){
  try {
    const r = await fetch('data/drops.csv', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    DROPS = parseCSV(await r.text()).map(toDrop);
    dropSource = `data/drops.csv · ${DROPS.length}종`;
  } catch(e){
    DROPS = parseCSV(FALLBACK_CSV).map(toDrop);
    dropSource = '기본 목록 사용 중 (data/drops.csv 를 못 읽음)';
  }
}
const dropsReady = loadDrops();

/* ---------- 뽑기 ---------- */
function pickWeighted(pool){
  const tot = pool.reduce((a, d) => a + d.weight, 0);
  if (tot <= 0) return null;
  let r = Math.random() * tot;
  for (const d of pool){ r -= d.weight; if (r <= 0) return d; }
  return pool[pool.length - 1];
}
function rollDrop(turn){
  const owned = new Set(world.relics.map(r => r.name));
  const ok = d => turn >= d.min && turn <= d.max && !(d.type === '유물' && owned.has(d.name));
  const out = DROPS.filter(d => d.min === turn && d.max === turn && ok(d));   // 그 턴 고정 등장
  const count = Math.max(out.length, 3 + Math.floor(Math.random() * 8));     // 3~10개
  const pool = DROPS.filter(d => ok(d) && d.weight > 0 && !d.last);
  let relics = out.filter(d => d.type === '유물').length;
  for (let guard = 0; out.length < count - 1 && guard < 200; guard++){
    const d = pickWeighted(pool.filter(x => x.type !== '유물' || (relics < 2 && !out.includes(x))));
    if (!d) break;
    if (d.type === '유물') relics++;
    out.push(d);
  }
  // 마지막 칸: 가끔 날씨나 특수 이벤트
  if (out.length < count){
    const lastPool = DROPS.filter(d => ok(d) && d.weight > 0 && d.last);
    const d = (Math.random() < 0.35 && pickWeighted(lastPool)) || pickWeighted(pool.filter(x => x.type !== '유물'));
    if (d) out.push(d);
  }
  return out;
}
function applyDrop(d){
  const chips = [];
  for (const tok of d.fx.split(/\s+/).filter(Boolean)){
    let m;
    if (tok === '유물'){
      world.relics.push({ emoji: d.emoji, name: d.name, desc: d.desc, turn: world.turn });
      chips.push('🌟 보관');
    } else if (tok === '보관'){
      const it = world.items[d.name] || (world.items[d.name] = { emoji: d.emoji, name: d.name, desc: d.desc, n: 0 });
      it.n++; chips.push(`${d.emoji}x1`);
    } else if ((m = tok.match(/^날씨:(.+):(\d+)$/))){
      world.weather = { kind: m[1], turns: +m[2] };
      chips.push(`${WEATHER[m[1]] || ''}/${m[2]}턴`);
    } else if ((m = tok.match(/^(.+?)([+-]\d+)$/))){
      const k = m[1], v = +m[2];
      const bag = k === '🐌' ? world.stock : world.res;
      bag[k] = Math.max(0, (bag[k] || 0) + v);
      chips.push(`${k}${v > 0 ? '+' : ''}${v}`);
    }
  }
  return chips;
}
function storeUsed(){
  return Object.values(world.res).reduce((a, b) => a + b, 0)
    + Object.values(world.items).reduce((a, b) => a + b.n, 0) + world.relics.length;
}

function updateFalling(dt){
  if (!falling || !falling.items.length) return;
  falling.t += dt;
  const f = P(FIRE.c + 0.5, FIRE.r + 0.5);
  let all = true;
  for (const it of falling.items){
    if (it.landed) continue;
    all = false;
    if (falling.t < it.delay) continue;
    if (it.y === null){ it.y = -T; it.vy = 250; }
    it.vy += 1500 * dt; it.y += it.vy * dt; it.rot += dt * 7 * Math.sign(it.rot || 1);
    if (it.y >= f.y - T * 0.25){
      it.y = f.y - T * 0.25; it.landed = true;
      const x = f.x + it.dx * T;
      for (let i = 0; i < 12; i++) sparks.push({ x: x + camX, y: f.y - T*0.25, vx: (Math.random()-0.5)*300, vy: -Math.random()*280, life: 0.55 });
      shake = Math.max(shake, 0.12);
    }
  }
  if (all && !falling.done){ falling.done = true; falling.t = 0; }
  if (falling.done && falling.t > 0.8){ const list = falling.list; falling = null; showDropWindow(list); }
}
function drawFalling(){
  if (!falling) return;
  const f = P(FIRE.c + 0.5, FIRE.r + 0.5);
  for (const it of falling.items){
    if (it.y === null) continue;
    emoji(it.d.emoji, f.x + it.dx * T, it.y, T * 0.55, it.landed ? it.rot * 0.2 : it.rot);
  }
}

  if (w){
    const mc = P(LOBBY_COLS / 2, 2.5);

    const n = Math.floor(rate * dt + Math.random());
    for (let i = 0; i < n; i++){
      const x = mc.x + (Math.random() - 0.5) * T * 5.2;
      rain.push({ x, y: -10, vx: w.kind === '눈' ? 0 : -40, vy: w.kind === '눈' ? 40 + Math.random()*30 : 700 + Math.random()*200,
        end: floorTop + Math.random() * rowH * ROWS, snow: w.kind === '눈', ph: Math.random() * 6 });
    }
    if (w.kind === '뇌우' && Math.random() < dt * 0.12){ flash = 0.55; shake = Math.max(shake, 0.1); }
  }
  for (const d of rain){ d.y += d.vy * dt; d.x += (d.snow ? Math.sin(time*2 + d.ph) * 20 : d.vx) * dt; }
  rain = rain.filter(d => d.y < d.end);
}
function drawWeather(){
  if (!rain.length) return;
  ctx.strokeStyle = 'rgba(170,200,255,.45)'; ctx.lineWidth = 1;
  ctx.fillStyle = 'rgba(240,245,255,.85)';
  ctx.beginPath();
  for (const d of rain){
    if (d.snow) continue;
    ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 1.5, d.y - 12);
  }
  ctx.stroke();
  for (const d of rain) if (d.snow) ctx.fillRect(d.x, d.y, 2.5, 2.5);
}

  const rr = (py - floorTop) / rowH;
  const cc = (px + camX + rr * skew - 2.5 * skew) / T;
  if (rr < 0 || rr >= ROWS || cc < 0 || cc >= curCols) return null;
  return { c: Math.floor(cc), r: Math.floor(rr), fx: cc - 0.5, fy: rr - 0.5 };
}
function unitAt(fx, fy){
  let best = null, bd = 0.9;
  for (const u of battle.units){ const d = Math.hypot(u.x - fx, u.y - fy); if (d < bd){ bd = d; best = u; } }
  return best;
}
cv.addEventListener('pointermove', e => { if (mode === 'battle') hoverTile = screenToTile(e); });
cv.addEventListener('pointerleave', () => hoverTile = null);
cv.addEventListener('pointerdown', e => {
  if (mode !== 'battle' || anyPanel()) return;
  const t = screenToTile(e);
  if (!t) return;
  const tool = battle.tool;
  if (tool === 'select' || tool === 'erase'){
    const u = unitAt(t.fx, t.fy);
    if (!u) return;
    if (tool === 'erase'){ battle.units = battle.units.filter(o => o !== u); logLine(`${u.name} 제거`, 'sys'); }
    else openSheet(u.id, 'status', u);
    return;
  }
  const u = spawnUnit(tool, t.c, t.r);
  logLine(`${u.name} 배치 (${t.c}, ${t.r})`, 'sys');
});

const norm = (x, y) => { const l = Math.hypot(x, y); return l ? { x: x / l, y: y / l } : { x: 0, y: 0 }; };
const unitRadius = u => u.id === 'karius' ? 0.8 : 0.4;
const unitHeight = u => u.id === 'karius' ? 3.3 : (u.id === 'goblin' || u.id === 'enemyGoblin') ? 0.95 : 1.15;
function battleSolid(u){
  return (nx, ny, ox, oy) => {
    if (nx < 0 || nx > BATTLE_COLS - 1 || ny < 0 || ny > ROWS - 1) return true;
    for (const o of battle.units){
      if (o === u || o.dead) continue;
      const rr = (unitRadius(u) + unitRadius(o)) * 0.9;
      const dn = Math.hypot(nx - o.x, ny - o.y), d0 = Math.hypot(ox - o.x, oy - o.y);
      if (dn < rr && dn < d0) return true;
    }
    return false;
  };
}
function fxText(u, text, color, kind){
  const p = P(u.x + 0.5, u.y + 0.5);
  floaters.push({ text, wx: p.x + camX + (Math.random() - 0.5) * T * 0.3, y: p.y - unitHeight(u) * T * depthScale(u.y) - T * 0.3,
    color, life: kind === 'crit' ? 1.3 : 1.0, big: kind === 'big', crit: kind === 'crit' });
}
function burst(u, n, color, power = 260){
  const p = P(u.x + 0.5, u.y + 0.5);
  const y = p.y - unitHeight(u) * T * depthScale(u.y) * 0.55;
  for (let i = 0; i < n; i++) sparks.push({ x: p.x + camX, y, vx: (Math.random() - 0.5) * power, vy: -Math.random() * power, life: 0.5, c: color });
}
function resolveHit(a, d){
  if (a.dead || d.dead) return;
  if (Math.random() < d.st.eva){
    fxText(d, '회피', '#b8b0a4');
    logLine(`${a.name} → ${d.name}: 회피`, 'miss');
    return;
  }
  let dmg = a.st.atk;
  const crit = Math.random() < a.st.crit;
  if (crit) dmg *= 3;
  const blocked = Math.random() < d.st.block;
  if (blocked) dmg = Math.max(1, dmg - d.st.def);
  d.hp = Math.max(0, d.hp - dmg);
  d.hurt = 0.18;
  if (crit){
    battle.hitstop = 0.14; shake = 0.3; battle.redFlash = 0.35;
    const p = P(d.x + 0.5, d.y + 0.5);
    battle.fx.push({ type: 'ring', wx: p.x + camX, y: p.y - unitHeight(d) * T * depthScale(d.y) * 0.55, life: 0.45, max: 0.45 });
    burst(d, 24, '#ffd35a', 420);
    fxText(d, `치명타! ${dmg}`, '#ffd35a', 'crit');
    logLine(`💥 ${a.name} → ${d.name}: 치명타 ${dmg}${blocked ? ' (방어)' : ''}`, 'crit');
  } else {
    burst(d, blocked ? 6 : 10, blocked ? '#cfe3ff' : '#e2443a');
    fxText(d, blocked ? `🛡${dmg}` : String(dmg), blocked ? '#9fd3ff' : '#f3e6c8');
    logLine(`${a.name} → ${d.name}: ${dmg}${blocked ? ` (방어 -${d.st.def})` : ''}`);
  }
  if (d.hp <= 0) killUnit(d);
}
function killUnit(d){
  d.dead = true; d.deadT = 0; d.hp = 0;
  logLine(`💀 ${d.name} 쓰러짐`, 'dead');
  if (d.id === 'rebecca') fxText(d, '…재생 중', '#ffc2cc');
}
function reviveUnit(u){
  u.dead = false; u.hp = u.st.hp; u.deadT = 0;
  fxText(u, '재생!', '#8ee08e', 'big');
  burst(u, 20, '#8ee08e');
  logLine(`✨ ${u.name} 재생 (🫀${u.hp})`, 'heal');
}

function updateBattle(dt){
  time += dt;
  const b = battle;
  let sdt = dt;
  if (b.hitstop > 0){ b.hitstop -= dt; sdt = dt * 0.1; }
  sdt *= b.speed;
  shake = Math.max(0, shake - dt);
  b.redFlash = Math.max(0, b.redFlash - dt * 1.5);
  floaters.forEach(f => { f.life -= dt; f.y -= 26 * dt; });
  floaters = floaters.filter(f => f.life > 0);
  sparks.forEach(s => { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 520 * dt; });
  sparks = sparks.filter(s => s.life > 0);
  b.fx.forEach(f => f.life -= dt); b.fx = b.fx.filter(f => f.life > 0);
  if (caption){ caption.life -= dt; if (caption.life <= 0) caption = null; }

  const input = anyPanel() ? null : moveInput();
  for (const u of b.units){
    if (u.dead){
      u.deadT += sdt; u.vx = u.vy = 0;
      if (u.id === 'rebecca' && b.running && u.deadT > 6) reviveUnit(u);
      continue;
    }
    u.hurt = Math.max(0, u.hurt - sdt);
    u.lunge = Math.max(0, u.lunge - sdt);
    let tgt = null, dist = Infinity;
    for (const o of b.units){
      if (o.side === u.side || o.dead) continue;
      const d = Math.hypot(o.x - u.x, o.y - u.y);
      if (d < dist){ dist = d; tgt = o; }
    }
    let dir = null;
    if (u.id === 'player' && input) dir = input;              // 방향키로 직접 이동 (공격은 자동)
    else if (b.running && tgt && dist > u.st.range){
      const v = norm(tgt.x - u.x, tgt.y - u.y);
      for (const o of b.units){
        if (o === u || o.dead) continue;
        const dx = u.x - o.x, dy = u.y - o.y, d = Math.hypot(dx, dy), rr = unitRadius(u) + unitRadius(o);
        if (d > 0 && d < rr){ v.x += dx / d * (rr - d) * 1.5; v.y += dy / d * (rr - d) * 1.5; }
      }
      dir = norm(v.x, v.y);
    }
    stepMover(u, sdt, dir, u.st.spd, battleSolid(u));
    u.t = u.moving ? 0 : 1;
    if (tgt && !u.moving) u.face = Math.sign(tgt.x - u.x) || u.face;
    if (b.running && tgt){
      u.cd -= sdt;
      if (dist <= u.st.range + 0.05 && u.cd <= 0){
        u.cd = u.st.cd;
        u.lunge = 0.25;
        const n = norm(tgt.x - u.x, tgt.y - u.y); u.lx = n.x; u.ly = n.y;
        u.face = Math.sign(n.x) || u.face;
        for (let k = 0; k < u.st.hits; k++) b.pending.push({ t: 0.1 + k * 0.18, a: u, d: tgt });
        if (u.st.ranged) b.fx.push({ type: 'bolt', a: u, d: tgt, life: 0.22, max: 0.22 });
      }
    }
  }
  b.pending.forEach(p => { p.t -= sdt; if (p.t <= 0) resolveHit(p.a, p.d); });
  b.pending = b.pending.filter(p => p.t > 0);
  b.units = b.units.filter(u => !(u.side === 'enemy' && u.dead && u.deadT > 1.6));

  if (b.running){
    const allies = b.units.filter(u => u.side === 'ally'), enemies = b.units.filter(u => u.side === 'enemy');
    const aAlive = allies.some(u => !u.dead) || allies.some(u => u.id === 'rebecca');
    const eAlive = enemies.some(u => !u.dead);
    if (!eAlive || !aAlive){
      b.running = false;
      b.over = eAlive ? '전멸' : '승리';
      caption = { text: b.over, life: 2.4, max: 2.4 };
      logLine(`— ${b.over} —`, 'sys');
      syncRun();
    }
  }
}

function drawBattle(){
  const b = battle;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 8 * shake / 0.18, (Math.random() - 0.5) * 5 * shake / 0.18);
  ctx.fillStyle = '#060408'; ctx.fillRect(-10, -10, W + 20, H + 20);
  drawWall();
  drawFloor();
  // 배치할 칸 표시
  if (hoverTile && b.tool !== 'select' && b.tool !== 'erase'){
    const { c, r } = hoverTile;
    const q = [P(c, r), P(c + 1, r), P(c + 1, r + 1), P(c, r + 1)];
    ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
    ctx.fillStyle = getStats(b.tool).side === 'ally' ? 'rgba(92,194,106,.25)' : 'rgba(226,68,58,.25)';
    ctx.fill();
  }
  const list = [...b.units].sort((a, c) => a.y - c.y);
  for (const u of list){
    const lo = u.lunge > 0 ? Math.sin((u.lunge / 0.25) * Math.PI) * 0.3 : 0;
    const v = { ...u, x: u.x + u.lx * lo + (u.hurt > 0 ? (Math.random() - 0.5) * 0.06 : 0), y: u.y + u.ly * lo * 0.5 };
    ctx.save();
    if (u.dead){
      const p = P(v.x + 0.5, v.y + 0.5);
      ctx.globalAlpha = u.side === 'enemy' ? Math.max(0, 1 - u.deadT / 1.6) : 0.55;
      ctx.translate(p.x, p.y); ctx.rotate(-u.face * 1.35); ctx.translate(-p.x, -p.y);
    }
    if (u.id === 'player') drawPlayerFigure(v);
    else if (u.id === 'rebecca') drawRebeccaFigure(v);
    else if (u.id === 'karius') drawKarius(v);
    else if (u.id === 'goblin') drawGoblin(v);
    else drawEnemyGoblin(v);
    ctx.restore();
  }
  // 마법 탄 · 치명타 고리
  for (const f of b.fx){
    const k = f.life / f.max;
    if (f.type === 'bolt'){
      const a = P(f.a.x + 0.5, f.a.y + 0.5), d = P(f.d.x + 0.5, f.d.y + 0.5);
      ctx.strokeStyle = `rgba(170,140,255,${k})`; ctx.lineWidth = 4 * k + 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y - T * 0.6); ctx.lineTo(d.x, d.y - T * 0.6); ctx.stroke();
    } else if (f.type === 'ring'){
      ctx.strokeStyle = `rgba(255,211,90,${k})`; ctx.lineWidth = 3 + 5 * k;
      ctx.beginPath(); ctx.arc(f.wx - camX, f.y, T * (0.3 + (1 - k) * 1.1), 0, Math.PI * 2); ctx.stroke();
    }
  }
  sparks.forEach(s => { ctx.fillStyle = s.c || '#ffe9a8'; ctx.fillRect(s.x - camX, s.y, 2.5, 2.5); });
  // 체력 바 + 이름
  for (const u of list){
    if (u.dead && u.side === 'enemy') continue;
    const p = P(u.x + 0.5, u.y + 0.5);
    const top = p.y - unitHeight(u) * T * depthScale(u.y) - T * 0.2;
    const w = T * (u.id === 'karius' ? 1.2 : 0.8);
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(p.x - w / 2 - 1, top - 1, w + 2, 7);
    ctx.fillStyle = u.side === 'ally' ? '#5cc26a' : '#e2443a';
    ctx.fillRect(p.x - w / 2, top, w * u.hp / u.st.hp, 5);
    tag(u.name, p.x, p.y + T * 0.3, u.side === 'ally' ? '#f3e6c8' : '#ffb3a8');
  }
  ctx.textAlign = 'center';
  floaters.forEach(fl => {
    ctx.globalAlpha = Math.min(1, fl.life * 2);
    const pop = fl.crit ? 1 + Math.max(0, fl.life - 1.0) * 2.2 : 1;
    ctx.font = `${Math.round(T * (fl.crit ? 0.5 : fl.big ? 0.36 : 0.28) * pop)}px "Do Hyeon",sans-serif`;
    ctx.lineWidth = fl.crit ? 5 : 3; ctx.strokeStyle = fl.crit ? '#7a0c0c' : 'rgba(0,0,0,.75)';
    ctx.strokeText(fl.text, fl.wx - camX, fl.y);
    ctx.fillStyle = fl.color; ctx.fillText(fl.text, fl.wx - camX, fl.y);
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  const vg = ctx.createRadialGradient(W / 2, H * 0.62, H * 0.25, W / 2, H * 0.62, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (b.redFlash > 0){ ctx.fillStyle = `rgba(200,30,20,${b.redFlash * 0.35})`; ctx.fillRect(0, 0, W, H); }
  if (caption){
    ctx.globalAlpha = Math.min(1, caption.life, (caption.max - caption.life) * 3);
    ctx.font = `${Math.round(Math.max(24, T * 0.6))}px "Do Hyeon",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.85)';
    ctx.strokeText(caption.text, W / 2, H * 0.3);
    ctx.fillStyle = caption.text === '승리' ? '#ffd76a' : '#eadfcb'; ctx.fillText(caption.text, W / 2, H * 0.3);
    ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
  }
}

/* ---------- 루프 ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (player && !gameEl.hidden){
    if (mode === 'battle'){ updateBattle(dt); drawBattle(); }
    else { update(dt); draw(); }
  }
  requestAnimationFrame(loop);
}

function boot(data){
  if (data && data.character) startGame(data.character);
  else beginCreator(true);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
