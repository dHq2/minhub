function drawDgFloor(A){
  const [R, G, B] = A.floor;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < curCols; c++){
    const a = P(c, r), b = P(c + 1, r), d = P(c + 1, r + 1), e = P(c, r + 1);
    if (b.x < -T * 3 || a.x > W + T * 3) continue;
    const hv = hash(c, r), v = (hv - 0.5) * 10 + r * 2;
    let col = `rgb(${R + v | 0},${G + v | 0},${B + v | 0})`;
    if (A.carpet && r === 2) col = A.carpet;
    if (A.puddles && hv > 0.8) col = `rgb(${R - 8},${G + 6},${B + 14})`;
    fillQuad([a, b, d, e], col);
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1; ctx.stroke();
  }
  const f0 = P(0, ROWS), f1 = P(curCols, ROWS);
  ctx.fillStyle = '#0c0a0e'; ctx.fillRect(f0.x - W, f0.y, f1.x - f0.x + W * 2, H);
}
function drawDgProp(p){
  if (p.kind === 'stone'){
    const q = P(p.x, p.y + 0.5);
    ctx.fillStyle = '#4b4c50'; ctx.beginPath(); ctx.ellipse(q.x, q.y - T * 0.08 * p.s, T * 0.28 * p.s, T * 0.16 * p.s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.ellipse(q.x - T * 0.08 * p.s, q.y - T * 0.14 * p.s, T * 0.1 * p.s, T * 0.05 * p.s, 0, 0, Math.PI * 2); ctx.fill();
  } else if (p.kind === 'hole' || p.kind === 'figure'){
    drawUnitBody(p.u);
  } else if (p.kind === 'door'){
    const c = P(p.x, 0), w = T * 1.7, h = T * 3.0, y = floorTop;
    ctx.fillStyle = '#0e0c12'; ctx.fillRect(c.x - w / 2 - T * 0.15, y - h - T * 0.15, w + T * 0.3, h + T * 0.15);
    if (p.open){
      const g = ctx.createLinearGradient(0, y - h, 0, y);
      g.addColorStop(0, '#07060a'); g.addColorStop(1, '#1d2238');
      ctx.fillStyle = g; ctx.fillRect(c.x - w / 2, y - h, w, h);
    } else {
      ctx.fillStyle = '#2a2530'; ctx.fillRect(c.x - w / 2, y - h, w, h);
      ctx.strokeStyle = '#141118'; ctx.lineWidth = 2; ctx.strokeRect(c.x - w / 2, y - h, w, h);
      ctx.beginPath(); ctx.moveTo(c.x, y - h); ctx.lineTo(c.x, y); ctx.stroke();
      ctx.fillStyle = '#6e6456';
      for (let i = 0; i < 4; i++) for (const s of [-1, 1]){ ctx.beginPath(); ctx.arc(c.x + s * w * 0.28, y - h * (0.2 + i * 0.2), T * 0.04, 0, Math.PI * 2); ctx.fill(); }
    }
  } else if (p.kind === 'throne'){
    const c = P(p.x, p.y), y = c.y;
    shape(() => rrect(c.x - T * 0.55, y - T * 2.6, T * 1.1, T * 2.6, T * 0.1), '#2a1f33');
    shape(() => rrect(c.x - T * 0.7, y - T * 0.9, T * 1.4, T * 0.5, T * 0.06), '#352741');
    ctx.fillStyle = '#b8923a'; ctx.fillRect(c.x - T * 0.55, y - T * 2.6, T * 1.1, T * 0.08);
    ctx.fillStyle = '#5a1624'; ctx.fillRect(c.x - T * 0.35, y - T * 2.3, T * 0.7, T * 1.3);
  } else if (p.kind === 'millstone'){
    const c = P(p.x, p.y), rx = T * 1.3, ry = T * 0.55;
    ctx.fillStyle = '#4e4b44'; ctx.beginPath(); ctx.ellipse(c.x, c.y - T * 0.25, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6e6a60'; ctx.beginPath(); ctx.ellipse(c.x, c.y - T * 0.45, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3c3a34'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(c.x, c.y - T * 0.45); ctx.lineTo(c.x + Math.cos(p.a || 0) * rx, c.y - T * 0.45 + Math.sin(p.a || 0) * ry); ctx.stroke();
    ctx.fillStyle = 'rgba(220,215,200,.5)'; ctx.beginPath(); ctx.ellipse(c.x + rx * 1.1, c.y, T * 0.5, T * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  }
}
// 관: 뒤(몸통 옆면 · 윗면 · 안) / 앞(앞면 · 뚜껑 · 손) 두 번에 나눠 그려서, 일어나는 왕이 관 안에서 나오는 것처럼 보이게
function drawCoffin(cf, part){
  const x0 = cf.x - 1.15, x1 = cf.x + 1.15, r0 = cf.y - 0.45, r1 = cf.y + 0.45, h = T * 0.46;
  const a = P(x0, r0), b = P(x1, r0), c = P(x1, r1), d = P(x0, r1), up = q => ({ x: q.x, y: q.y - h });
  const lidOn = cf.state === 'closed' || cf.state === 'rattle' || cf.state === 'hand';
  if (part === 'back'){
    fillQuad([b, c, up(c), up(b)], '#2c2833');
    fillQuad([up(a), up(b), up(c), up(d)], lidOn ? '#4a4452' : '#0c0a0e');
    if (cf.state === 'open'){                                   // 누워 있는 늙은 왕
      const hd = P(x0 + 0.45, cf.y), ft = P(x1 - 0.3, cf.y);
      ctx.fillStyle = '#24346e'; ctx.beginPath(); ctx.ellipse((hd.x + ft.x) / 2, hd.y - h * 0.8, (ft.x - hd.x) / 2, T * 0.14, 0, 0, Math.PI * 2); ctx.fill();
      circle(hd.x, hd.y - h * 0.85, T * 0.14, '#cfc6bb');
      ctx.fillStyle = '#e8e4dc'; ctx.beginPath(); ctx.ellipse(hd.x + T * 0.14, hd.y - h * 0.8, T * 0.12, T * 0.06, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e0b64a'; ctx.fillRect(hd.x - T * 0.24, hd.y - h * 0.95, T * 0.1, T * 0.2);
    }
    if (cf.state === 'stairs'){
      for (let i = 0; i < 5; i++){
        const k = i / 5, l = P(x0 + 0.2 + k * 0.3, r0 + 0.15), rr = P(x1 - 0.2 - k * 0.3, r0 + 0.15);
        ctx.fillStyle = `rgba(90,90,110,${0.5 - k * 0.08})`; ctx.fillRect(l.x, l.y - h + k * T * 0.12, rr.x - l.x, T * 0.05);
      }
    }
  } else {
    fillQuad([d, c, up(c), up(d)], '#3d3845');
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(d.x + T * 0.15, d.y - h * 0.8, c.x - d.x - T * 0.3, h * 0.6);

      fillQuad([up(a), up(b), up(c), up(d)].map(q => ({ x: q.x + j, y: q.y - lift })), '#6a6474');
      fillQuad([up(d), up(c), c, d].map(q => ({ x: q.x + j, y: q.y - lift })).map((q, i) => i < 2 ? q : { x: q.x, y: q.y - h + T * 0.07 }), '#57515f');
      if (cf.state === 'hand'){                                  // 뚜껑 틈으로 앙상한 손이 툭
        const hb = up(P(cf.x - 0.35, r1 - 0.05));
        ctx.strokeStyle = '#d8d0c4'; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(2, T * 0.05);
        ctx.beginPath(); ctx.moveTo(hb.x, hb.y); ctx.lineTo(hb.x - T * 0.05, hb.y - T * 0.28); ctx.stroke();
        for (let i = 0; i < 4; i++){ const ax = hb.x - T * 0.05 + (i - 1.5) * T * 0.05; ctx.beginPath(); ctx.moveTo(ax, hb.y - T * 0.28); ctx.lineTo(ax + (i - 1.5) * T * 0.03, hb.y - T * 0.46 - Math.sin(time * 8 + i) * T * 0.02); ctx.stroke(); }
      }
    } else {
      const off = q => ({ x: q.x + T * 1.3, y: q.y + T * 0.15 });
      fillQuad([a, b, c, d].map(off).map(q => ({ x: q.x, y: q.y - T * 0.08 })), '#6a6474');

function drawRisingKing(cf){
  const k = easeOut(cf.k), ground = P(cf.x, cf.y + 0.45).y - T * 0.46;

// look 설정 하나로 그리는 사람 모양 (죽은 기사, 전사, 세자르, 낙오자, 방앗간지기, 헤론)
function drawLookUnit(o){
  const L = o.st.look;
  if (L.kind === 'hole') return drawFingerHole(o);

function drawLookFigure(L, x, y, u, face, o){

// 손가락 구멍: 땅의 구멍에서 손가락들이 꿈틀거림. 칠 땐 대상 쪽으로 쭉 뻗음
function drawFingerHole(o){
  const p = P(o.x + 0.5, o.y + 0.5), s = depthScale(o.y), rx = T * 0.8 * s, ry = T * 0.28 * s;
  ctx.fillStyle = '#3a2a2a'; ctx.beginPath(); ctx.ellipse(p.x, p.y, rx * 1.1, ry * 1.15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#080506'; ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  const reach = o.windup > 0 ? 0.4 : o.lunge > 0 ? 1.4 : 0;
  ctx.lineCap = 'round';
  for (let i = 0; i < 18; i++){
    const a = (i / 18) * Math.PI * 2, bx = p.x + Math.cos(a) * rx * 0.75, by = p.y + Math.sin(a) * ry * 0.75;
    const len = T * s * (0.3 + hash(i, 4) * 0.35) * (1 + reach * (Math.cos(a) * (o.face || 1) > 0.3 ? 1 : 0.2));
    const sw = Math.sin(time * (3 + hash(i, 2) * 3) + i) * 0.5 + Math.cos(a) * 0.3 * (o.face || 1) * reach;
    const tx = bx + Math.sin(sw) * len, ty = by - Math.cos(sw) * len;
    ctx.strokeStyle = OUTC; ctx.lineWidth = T * s * 0.09 + 2; ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo((bx + tx) / 2 + sw * 6, (by + ty) / 2, tx, ty); ctx.stroke();
    ctx.strokeStyle = '#d9a89a'; ctx.lineWidth = T * s * 0.09; ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo((bx + tx) / 2 + sw * 6, (by + ty) / 2, tx, ty); ctx.stroke();
    ctx.fillStyle = '#f2d8cf'; ctx.beginPath(); ctx.arc(tx, ty, T * s * 0.03, 0, Math.PI * 2); ctx.fill();
  }
}

function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (player && !gameEl.hidden){
    if (mode === 'battle'){
      updateBattle(dt); updateCamera(dt);
      const c = battle && battle.clash;                                           // 딱! 순간엔 끊어지는 프레임 (초당 12장 정도)
      if (c && c.t < c.dur){ c.t += dt; loop.stut = (loop.stut || 0) + dt; if (loop.stut >= 0.08){ loop.stut = 0; drawBattle(); } }
      else drawBattle();
    }
    else if (mode === 'dungeon'){ updateDungeon(dt); drawDungeon(); }
    else { update(dt); draw(); }
    if (mode === 'battle' && DG.inFight) dgFightTick(dt);
  }
  requestAnimationFrame(loop);
}
