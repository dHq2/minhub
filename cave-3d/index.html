<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>굴의 프롤로그 3D</title>
<!-- 굴의 프롤로그 3D 시제품  version v0.16 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#efe6d6; --dim:#a99c8a; --gold:#e8c27a; --red:#ff5a4a; --line:rgba(232,194,122,.35); }
  html,body{margin:0;height:100%;background:#050406;color:var(--ink);font-family:"Nanum Gothic",sans-serif;overflow:hidden;user-select:none;}
  #stage{position:fixed;inset:0;}
  #party,#cmd,#prompt,#bossbar,#caption,#help,#textbox,#ver{position:fixed;z-index:5;}
  #gauge{position:fixed;z-index:4;width:54px;height:7px;margin-left:-27px;background:rgba(0,0,0,.7);border:1px solid rgba(0,0,0,.9);border-radius:3px;overflow:hidden;pointer-events:none;}
  #aimtag{position:fixed;left:0;top:0;z-index:4;pointer-events:none;font-family:"Do Hyeon",sans-serif;font-size:15px;text-shadow:0 1px 3px #000,0 0 6px #000;}
  #aimtag.ok{color:#ffe08a;} #aimtag.no{color:#ff8a7a;}
  #focusnote{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:15;pointer-events:none;font-family:"Do Hyeon",sans-serif;font-size:20px;color:var(--gold);background:rgba(8,6,10,.85);padding:12px 22px;border-radius:8px;border:1px solid var(--line);}
  #spearMark{position:fixed;left:0;top:0;z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:"Do Hyeon",sans-serif;color:#ffd35a;text-shadow:0 1px 3px #000,0 0 6px #000;}
  #spearMark i{font-style:normal;font-size:20px;display:none;} #spearMark.off i{display:block;} #spearMark b{font-weight:400;font-size:14px;white-space:nowrap;background:rgba(8,6,10,.6);padding:1px 7px;border-radius:4px;}
  #gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a45c,#ffd35a);}
  #gauge.win{border-color:#fff;box-shadow:0 0 8px #9fd0ff;} #gauge.win i{background:#fff;}
  .hpbar.ally{position:relative;} .hpbar.ally::after{content:attr(data-n);position:absolute;left:100%;top:-5px;margin-left:4px;font-size:10px;color:#d8f0d8;text-shadow:0 1px 2px #000;white-space:nowrap;}
  .mark{font-family:"Do Hyeon",sans-serif;font-size:14px;color:var(--gold);text-shadow:0 1px 3px #000,0 0 8px #000;white-space:nowrap;text-align:center;transform:translateX(-50%);animation:bob 1.6s ease-in-out infinite;}
  .mark::before{content:'◆';display:block;font-size:16px;}
  @keyframes bob{50%{margin-top:-5px;}}
  #stage canvas{display:block;width:100%;height:100%;}
  #ui{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  #ui > *{position:absolute;left:0;top:0;}
  .hpbar{width:46px;height:5px;background:rgba(0,0,0,.65);border:1px solid rgba(0,0,0,.8);border-radius:2px;}
  .hpbar i{display:block;height:100%;background:#7fd47f;border-radius:1px;}
  .hpbar.enemy i{background:#e2443a;} .hpbar.neutral i{background:#c9a45c;}
  .ntag{font-size:12px;color:#d8cfb9;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap;margin-top:-4px;}
  .ntag.down{color:#ff8a7a;} .ntag.down::after{content:' (쓰러짐)';}
  .pop{font-family:"Do Hyeon",sans-serif;font-size:20px;color:#fff3dc;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;}
  .pop.big{font-size:26px;color:#ffe0b0;} .pop.crit{font-size:34px;color:#ffd35a;} .pop.hurt{color:#ff8a7a;}
  .pop.miss{font-size:17px;color:#cfd6de;} .pop.heal{color:#8dffb0;} .pop.alert{font-size:30px;color:#ff5a4a;} .pop.aim{font-size:16px;color:#ffd35a;}
  #party{left:16px;bottom:16px;top:auto;display:flex;flex-direction:column;gap:5px;min-width:210px;}
  .pm{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;gap:8px;font-size:13px;background:rgba(8,6,10,.7);padding:5px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.06);}
  .pm i{height:7px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;} .pm b{display:block;height:100%;background:#7fd47f;}
  .pm small{text-align:right;color:var(--dim);} .pm.down{opacity:.5;} .pm.down b{background:#a33;}
  .sk{display:grid;grid-template-columns:26px auto 1fr auto;align-items:center;gap:8px;font-size:12.5px;background:rgba(8,6,10,.7);padding:5px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.06);}
  .sk .cd{width:24px;height:24px;border-radius:50%;background:conic-gradient(#7dffa0 var(--p),rgba(255,255,255,.1) 0);display:grid;place-items:center;}
  .sk .cd i{width:18px;height:18px;border-radius:50%;background:#14101a;color:#8dffb0;font-style:normal;font-size:11px;display:grid;place-items:center;}
  .sk.ready .cd{box-shadow:0 0 8px #7dffa0;} .sk.off{opacity:.5;}
  .sk .pips{display:flex;gap:3px;} .sk .pips em{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.12);} .sk .pips em.on{background:#7dffa0;}
  .sk small{color:var(--dim);text-align:right;}
  .sp{font-size:12px;color:var(--gold);padding:2px 4px;text-shadow:0 1px 3px #000;}
  #cmd{left:auto;right:16px;bottom:16px;top:auto;display:flex;gap:6px;pointer-events:auto;}
  #cmd button{font-family:"Nanum Gothic";font-size:13px;color:var(--ink);background:rgba(8,6,10,.75);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 11px;cursor:pointer;}
  #cmd button.on{border-color:var(--gold);color:var(--gold);}
  #cmd kbd{font-family:inherit;color:var(--dim);margin-right:4px;}
  #prompt{left:50%;top:auto;bottom:118px;transform:translateX(-50%);font-size:15px;background:rgba(8,6,10,.82);padding:9px 16px;border-radius:6px;border:1px solid var(--line);white-space:nowrap;}
  #prompt kbd{font-family:"Do Hyeon";color:#1a1008;background:var(--gold);padding:1px 7px;border-radius:3px;margin-right:6px;}
  #textbox{left:50%;top:auto;bottom:70px;transform:translateX(-50%);width:min(720px,88vw);min-height:86px;box-sizing:border-box;background:linear-gradient(rgba(10,8,12,.92),rgba(6,5,8,.96));border:1px solid var(--line);border-radius:8px;padding:16px 22px;pointer-events:auto;}
  #textbox b{display:block;font-family:"Do Hyeon";font-weight:400;font-size:19px;color:var(--gold);margin-bottom:6px;}
  #textbox p{margin:0;font-size:17px;line-height:1.6;}
  #textbox p.in{animation:tin .45s ease both;}
  #textbox .more{position:absolute;right:16px;bottom:10px;color:var(--gold);font-size:12px;animation:blink 1s infinite;}
  @keyframes tin{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @keyframes blink{50%{opacity:.25;}}
  #load{position:fixed;inset:0;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:20;}
  #load .lines p{font-size:20px;line-height:1.9;margin:0;text-align:center;opacity:0;animation:lin 1.1s ease forwards;text-shadow:0 2px 10px #000;}
  #load .go{font-family:"Do Hyeon";font-size:18px;color:var(--gold);animation:blink 1.4s infinite;}
  @keyframes lin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  #caption{left:50%;top:22%;transform:translateX(-50%);text-align:center;opacity:0;}
  #caption b{display:block;font-family:"Do Hyeon";font-weight:400;font-size:46px;letter-spacing:6px;color:var(--ink);text-shadow:0 3px 18px #000;}
  #caption span{font-size:16px;color:var(--dim);letter-spacing:3px;}
  #caption.show{animation:cap 3.2s ease both;}
  @keyframes cap{0%{opacity:0;}20%{opacity:1;}75%{opacity:1;}100%{opacity:0;}}
  #bossbar{left:50%;top:18px;transform:translateX(-50%);width:min(560px,70vw);text-align:center;}
  #bossname{font-family:"Do Hyeon";font-size:20px;color:#ffb3a8;text-shadow:0 2px 8px #000;}
  #bosstrack{height:10px;background:rgba(0,0,0,.7);border:1px solid #5a1a1a;border-radius:3px;margin-top:5px;overflow:hidden;}
  #bossfill{height:100%;background:linear-gradient(90deg,#8e1515,#e2443a);transition:width .15s;}
  #bossphase{font-size:12px;color:var(--dim);margin-top:4px;}
  #flash,#redflash{position:fixed;inset:0;pointer-events:none;opacity:0;}
  #redflash{background:radial-gradient(ellipse at center,rgba(200,20,20,0) 40%,rgba(200,20,20,.8));}
  body::before,body::after{content:'';position:fixed;left:0;right:0;height:0;background:#000;z-index:10;transition:height .6s ease;pointer-events:none;}
  body::before{top:0;} body::after{bottom:0;}
  body.cine::before,body.cine::after{height:9vh;}
  body.cine #party,body.cine #cmd,body.cine #prompt{opacity:0;}
  body.cine .hpbar,body.cine .ntag,body.cine #spearMark{opacity:0;}
  #help{pointer-events:none;left:50%;top:auto;bottom:16px;transform:translateX(-50%);width:max-content;max-width:min(760px,calc(100vw - 520px));text-align:center;line-height:1.7;font-size:12.5px;color:var(--dim);background:rgba(8,6,10,.72);padding:8px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.06);}
  #help b{color:var(--ink);font-weight:700;}
  #ver{left:auto;right:10px;top:auto;bottom:4px;font-size:10px;color:#4a4450;}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Do Hyeon";font-size:22px;color:var(--dim);background:#050406;z-index:30;}
  /* v0.10 프롤로그: 초상화 글상자 · 특성 태그 · 말풍선 · 안내 줄 · 암전 · 몽환 */
  #caption,#bossbar,#party,#help,#ver{pointer-events:none;}   /* 사라진 자막 · 보스 줄이 클릭 (찌르기 · 투창)을 가로채던 것 */
  #textbox{z-index:12;}   /* 암전 (#dark) 위에서도 보이게 */
  #textbox.hasface{padding-left:118px;min-height:112px;}
  #textbox .face{position:absolute;left:14px;bottom:12px;width:90px;height:90px;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:#120e16;}
  .tag{display:inline-block;vertical-align:middle;margin-left:6px;padding:1px 7px 2px;border-radius:2px;font-family:"Nanum Gothic";font-weight:700;font-size:12px;line-height:1.5;letter-spacing:0;border:1px solid;}
  .tag.gS{color:#1a1206;background:#ffcf4a;border-color:#ffe08a;} .tag.gA{color:#1a0a04;background:#ff7a45;border-color:#ffa47a;}
  .tag.gB{color:#fff;background:#8a4fd8;border-color:#b78bff;} .tag.gC{color:#06121a;background:#4ab0ff;border-color:#8fd0ff;}
  .tag.gD{color:#06140c;background:#5fd38a;border-color:#9ae8b6;} .tag.gE{color:#111;background:#9aa0a8;border-color:#c4c8cc;} .tag.gF{color:#ddd;background:#4a4f58;border-color:#6a6f78;}
  .tag.curse{color:#f0c8ff;background:#2a0f2e;border-color:#a54bd1;}
  #bossname .tag{font-size:12px;}
  .bubble{position:absolute;font-family:"Do Hyeon",sans-serif;font-size:18px;color:#1a1418;background:#f4ede2;padding:6px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.6);transform:translate(-50%,-100%);}
  .bubble::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#f4ede2;}
  .bubble.big{font-size:30px;color:#fff;background:#8e1515;letter-spacing:1px;animation:quiver .06s infinite;} .bubble.big::after{border-top-color:#8e1515;}
  .bubble.soft{font-size:15px;color:#d8f0ff;background:rgba(20,16,34,.75);border:1px solid rgba(160,220,255,.35);} .bubble.soft::after{border-top-color:rgba(20,16,34,.75);}
  .bubble.zzz{font-size:16px;color:#cfe0ff;background:none;box-shadow:none;text-shadow:0 1px 4px #000;} .bubble.zzz::after{display:none;}
  @keyframes quiver{0%{margin-left:-2px;}50%{margin-left:2px;margin-top:1px;}100%{margin-left:0;}}
  #guide{position:fixed;left:50%;top:auto;bottom:178px;transform:translateX(-50%);z-index:6;pointer-events:none;font-family:"Do Hyeon",sans-serif;font-size:24px;color:#fff3dc;text-shadow:0 2px 10px #000,0 0 4px #000;white-space:nowrap;opacity:0;transition:opacity .5s;}
  #guide.on{opacity:1;} #guide em{font-style:normal;color:var(--gold);}
  #dark{position:fixed;inset:0;background:#000;pointer-events:none;z-index:9;opacity:0;}
  #dream{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 3s;background:radial-gradient(ellipse at center,rgba(120,90,200,0) 45%,rgba(60,30,110,.45) 100%);mix-blend-mode:screen;}
  #dream.on{opacity:1;}
  #mid{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:11;pointer-events:none;font-family:"Do Hyeon",sans-serif;font-size:34px;letter-spacing:6px;color:#cfc6b8;opacity:0;transition:opacity .25s;}
  #mid.on{opacity:1;}
  /* v0.11 오늘의 낙하 결과 (10칸) · 낙하물 종류 태그 */
  /* v0.15 오늘의 낙하: 큰 목록 (한 줄씩 채워짐) */
  #fallres{position:fixed;left:50%;top:9%;transform:translateX(-50%);z-index:12;pointer-events:none;width:min(560px,92vw);box-sizing:border-box;background:linear-gradient(rgba(14,10,22,.95),rgba(8,6,12,.97));border:1px solid var(--line);border-radius:10px;padding:16px 18px 12px;}
  #fallres > b{display:block;font-family:"Do Hyeon";font-weight:400;font-size:24px;color:var(--gold);letter-spacing:2px;margin-bottom:10px;text-align:center;}
  #fallres .rows{display:flex;flex-direction:column;gap:4px;max-height:66vh;overflow:hidden;}
  #fallres .row{display:grid;grid-template-columns:46px 1fr auto 96px;align-items:center;gap:10px;padding:3px 10px;flex:none;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);animation:rowin .35s ease both;}
  #fallres .row .ic{display:grid;place-items:center;height:32px;font-size:22px;} #fallres .row .ic img{max-width:40px;max-height:32px;object-fit:contain;}
  #fallres .row .nm{font-size:15px;color:var(--ink);} #fallres .row .nt{font-size:12px;color:var(--dim);text-align:right;}
  #fallres .row .tag{margin:0;}
  #fallres .row.weather{background:rgba(160,180,255,.08);border-color:rgba(160,180,255,.25);} #fallres .row.foe{background:rgba(255,60,50,.12);border-color:rgba(255,90,74,.5);} #fallres .row.foe .ic{color:#ff8a7a;}
  #fallres small{display:block;margin-top:10px;font-size:12px;color:var(--gold);text-align:center;animation:blink 1.2s infinite;}
  @keyframes rowin{0%{opacity:0;transform:translateX(-14px);background:rgba(255,240,200,.18);}100%{opacity:1;transform:none;}}
  .tag.tlive{color:#2a0a14;background:#ff9fb8;border-color:#ffc8d6;} .tag.tstorm{color:#fff;background:#5b3fb0;border-color:#a68bff;}
  #fallres .row.storm{background:rgba(120,90,255,.14);border-color:rgba(166,139,255,.55);}
  .tag.tweather{color:#0a1020;background:#a8c0ff;border-color:#cfdcff;} .tag.tfoe{color:#fff;background:#b3261e;border-color:#ff8a7a;}
  .tag.tfurn{color:#fff;background:#7a5634;border-color:#a8805a;} .tag.tfood{color:#06140c;background:#5fd38a;border-color:#9ae8b6;}
  .tag.tsup{color:#06121a;background:#4ab0ff;border-color:#8fd0ff;} .tag.tequip{color:#1a1206;background:#ffcf4a;border-color:#ffe08a;} .tag.tjunk{color:#ddd;background:#4a4f58;border-color:#6a6f78;}
  #skipBtn{position:fixed;right:16px;top:16px;z-index:13;font-family:"Do Hyeon",sans-serif;font-size:15px;color:var(--ink);background:rgba(8,6,10,.78);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;pointer-events:auto;}
  #skipBtn:hover{color:var(--gold);border-color:var(--gold);}
  [hidden]{display:none !important;}
  body{-webkit-user-select:none;user-select:none;}
  @media (max-width:900px){ #help{max-width:88vw;bottom:auto;top:12px;} }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<div id="party" class="hud"></div>
<div id="cmd" hidden><button data-c="follow"><kbd>1</kbd>따라와</button><button data-c="focus"><kbd>2</kbd>내 목표</button><button data-c="free"><kbd>3</kbd>자유</button></div>
<div id="prompt" hidden></div>
<div id="gauge" hidden><i></i></div>
<div id="aimtag" hidden></div>
<div id="spearMark" hidden><i>➜</i><b></b></div>
<div id="focusnote" hidden>화면을 클릭하면 조작할 수 있어요</div>
<div id="bossbar" hidden><div id="bossname"></div><div id="bosstrack"><div id="bossfill"></div></div><div id="bossphase"></div></div>
<div id="caption"></div>
<div id="help" hidden><b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>좌클릭/J</b> 찌르기 · <b>우클릭/K</b> 누르고 있다 놓기 = 투창 (적 위에서 누르면 정조준) · <b>Space</b> 점프 · <b>Q</b> 구르기 · <b>F</b> 방어 (맞는 순간 누르면 튕겨냄) · <b>Z C</b> 카메라 돌리기 · <b>E</b> 살펴보기 (◆) · <b>1 2 3</b> 동료 지시 · <b>H</b> 도움말</div>
<div id="textbox" hidden></div>
<div id="load" hidden><div class="lines"></div><div class="go" hidden>▶ 계속 (E · 클릭)</div></div>
<div id="flash"></div><div id="redflash"></div>
<div id="fallres" hidden><b>오늘의 낙하</b><div class="rows"></div><small>▶ E · 클릭으로 닫기</small></div>
<button id="skipBtn" type="button" hidden>프롤로그 건너뛰기 ▶▶</button>
<div id="guide"></div><div id="dream"></div><div id="dark"></div><div id="mid"></div>
<div id="ver"></div>
<div id="boot">굴로 내려가는 중…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="src/core.js"></script>
<script src="src/world.js"></script>
<script src="src/camera.js"></script>
<script src="src/units.js"></script>
<script src="src/ai.js"></script>
<script src="src/player.js"></script>
<script src="src/boss.js"></script>
<script src="src/prologue.js"></script>
<script src="src/game.js"></script>
</body>
</html>
