<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dr. 마틴의 추리판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@700;800&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/a.css">
<link rel="stylesheet" href="css/b.css">
<link rel="stylesheet" href="css/c.css">
<link rel="stylesheet" href="css/d.css">
</head>
<body>
<aside id="nb" aria-label="수사 수첩"><div class="nb-top"><b>수사 수첩<small id="nbCase"></small></b><button type="button" id="nbX" aria-label="닫기">×</button></div><div id="nbBody"></div></aside>
<div id="nbScrim"></div>
<div id="app">
  <header class="top">
    <div class="brand">DR. MARTIN<small id="ver"></small></div>
    <button class="clk" id="clk" type="button" aria-label="사건 시계 — 누르면 실제로 든 시간"><b>10:50:00</b><small>사건 시각</small></button><!-- 11-17 D: 사건 시계(js/clock.js) -->
    <div class="case" id="caseName"></div>
    <button class="tb" id="btnEv" type="button">자료<span class="n" id="evN"></span></button>
    <button class="tb" id="btnNb" type="button">수첩<span class="n" id="nbN"></span></button>
    <button class="tb" id="btnPz" type="button">난제<span class="n" id="pzN"></span></button>
    <button class="tb" id="btnMenu" type="button">사건</button>
  </header>
  <!-- 11-16 B: 큰 가설 띠 → 한 줄 「붙잡은 난제」 띠. 누르면 난제 지도 -->
  <section class="hyp pzbar" id="hyp" role="button" tabindex="0" aria-label="붙잡은 난제 — 난제 지도 열기">
    <div class="hyp-row">
      <span class="pzst" id="hypN">p1 붙잡음</span>
      <span class="ht" id="hypT">무슨 일이 있었나</span>
      <span class="pzcnt" id="pzCnt"></span>
      <span class="pct"><b id="hypP">0</b><small>%</small></span>
    </div>
    <div class="meter"><i id="hypM"></i></div>
  </section>
  <main class="board" id="board">
    <div class="world" id="world">
      <svg id="zones" viewBox="0 0 2000 2000"></svg>
      <svg id="strings" viewBox="0 0 2000 2000"></svg>
      <div id="tags"></div>
      <div id="nodes"></div>
      <svg id="xl" viewBox="0 0 2000 2000" style="z-index:3"></svg>
      <svg id="marks" viewBox="0 0 2000 2000" style="z-index:4"></svg>
    </div>
    <div class="shade"></div>
    <button class="fit fit2" id="btnTidy" type="button">판 정리</button>
    <button class="fit" id="btnFit" type="button">전체 보기</button>
    <button class="fit fit3" id="btnShot" type="button">판 사진</button>
    <!-- 11-16 C: 되돌리기 · 다시 하기 (js/undo.js) -->
    <div class="undo-bt"><button type="button" id="btnUndo" disabled>↶ 되돌리기</button><button type="button" id="btnRedo" hidden aria-label="다시 하기">↷</button></div>
  </main>
  <section class="stage">
    <div class="split" id="split" role="separator" aria-orientation="horizontal" aria-label="판·대화 비율 — 끌어서 조절, 두 번 누르면 반반"><i></i></div>
    <img class="martin" id="martin" alt="Dr. 마틴" src="img/martin.webp">
    <div class="talk">
      <div class="who"><span>DR. 마틴 <small id="brain"></small></span><button id="btnLog" type="button">기록</button></div>
      <div class="chat" id="chat"></div>
    </div>
  </section>
  <div class="chips" id="chips"></div>
  <form class="bar" id="form">
    <button class="ib" id="btnAtt" type="button" aria-label="사진·파일 붙이기" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M16 7l-7.5 7.5a2.1 2.1 0 003 3L19 10a4 4 0 00-5.7-5.7L5.6 12a6 6 0 008.5 8.5L20 14.6"/></svg></button>
    <textarea id="msg" rows="1" placeholder="무엇이든 붙여 넣어라"></textarea>
    <button class="go" id="send" type="submit">건네기</button>
  </form>
  <div class="attm" id="attm"><label>사진 고르기<input type="file" id="fileImg" accept="image/*" multiple></label><label>글 파일 고르기<input type="file" id="fileAny" multiple></label><button type="button" class="attx" id="attPaste">붙여넣기 칸 · 크롬에서 열기</button></div>
  <div class="pv" id="pv"><div class="pv-top"><b id="pvT"></b><button type="button" id="pvX" aria-label="닫기">×</button><div class="pv-btns"><button type="button" class="pvc" id="pvR">다시 읽혀</button><button type="button" class="pvc" id="pvD">판독문</button><button type="button" class="pvc" id="pvC">대화 숨기기</button></div></div><!-- 11-17 B: 위는 이름 한 줄 + ×, 단추는 그 아래 한 줄. 메모·판독문(#pvN)은 「판독문」을 눌러야 사진 위에 펼쳐짐(pvdoc.js) --><div class="pv-stage" id="pvS"><img id="pvI" alt=""><span class="pv-hint">두 손가락 확대 · 두 번 눌러 확대 · 바깥 눌러 닫기</span></div><div class="pv-note" id="pvN"></div></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog"></div>
</div>
<!-- 11-16 B: 난제 지도 — 폰은 오른쪽 서랍, 아주 넓은 화면은 판 오른쪽에 늘 -->
<aside id="pzm" aria-label="난제 지도"><div class="pz-top"><b>난제 지도<small id="pzmCase"></small></b><button type="button" id="pzmX" aria-label="닫기">×</button></div><div id="pzmBody"></div><form class="pzadd" id="pzmAdd"><span id="pzmUnder"></span><input id="pzmIn" maxlength="80" placeholder="새 난제 — 질문 한 줄" autocomplete="off"><button type="submit">지정</button></form></aside>
<div id="pzmScrim"></div>
<script src="js/ver.js"></script>
<script src="js/changes.js"></script>
<script src="js/core.js"></script>
<script src="js/board.js"></script>
<script src="js/persona.js"></script>
<script src="js/ai.js"></script>
<script src="js/input.js"></script>
<script src="js/sheets.js"></script>
<script src="js/view.js"></script>
<script src="js/evidence.js"></script>
<script src="js/tidy.js"></script>
<script src="js/lib/html-to-image.js"></script>
<script src="js/shot.js"></script>
<script src="js/notebook.js"></script>
<script src="js/xref.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/undo.js"></script>
<script src="js/mode.js"></script>
<script src="js/habits.js"></script>
<script src="js/size.js"></script>
<script src="js/pvtalk.js"></script>
<script src="js/brief.js"></script>
<script src="js/update.js"></script>
<script src="js/split.js"></script>
<script src="js/pvdoc.js"></script>
<script src="js/trail.js"></script>
<script src="js/clock.js"></script>
<script src="js/recap.js"></script>
<script src="js/wallclock.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
