<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161d">
<title>굴 전투판 v1</title>
<style>
  :root{
    --bg:#101218; --panel:#1a1d26; --panel2:#232733; --line:#303546;
    --txt:#e8e4d6; --dim:#9a9788; --gold:#f5b53a; --blue:#4a86ff; --red:#e2543f; --green:#4cc38a;
    --field:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;}
  button{font:inherit;color:inherit;}
  .hidden{display:none !important;}
  #app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:inherit;}

  /* ---- 공통 버튼 ---- */
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:38px;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
  .btn:active{transform:translateY(1px);filter:brightness(1.2);}
  .btn.on{background:#27406e;border-color:var(--blue);}
  .btn.warn.on{background:#6b3a14;border-color:#ff9d3a;}
  .btn.gold{background:#5a4412;border-color:var(--gold);}
  .btn.go{background:#17503a;border-color:var(--green);font-weight:700;}
  .btn.danger{background:#5a211b;border-color:var(--red);}
  .btn[disabled]{opacity:.35;pointer-events:none;}
  .btn.sm{min-height:30px;padding:4px 8px;font-size:12px;}

  /* ---- 홈(막사) ---- */
  #scrHome{overflow-y:auto;touch-action:pan-y;}
  .wrap{width:100%;max-width:920px;margin:0 auto;padding:14px 16px 40px;}
  h1{margin:6px 0 2px;font-size:22px;letter-spacing:.5px;}
  .sub{color:var(--dim);font-size:13px;margin-bottom:12px;line-height:1.5;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .sec{margin:16px 0 8px;font-size:13px;color:var(--gold);letter-spacing:.5px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.5;}
  .card .nm{font-size:15px;font-weight:700;}
  .card .st{color:var(--dim);font-size:12px;}
  .card .badge{display:inline-block;padding:0 6px;border-radius:6px;background:#3a3320;color:var(--gold);font-size:11px;margin-left:4px;}
  .card.new{border-color:var(--green);}
  .logrow{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:7px 10px;margin-bottom:6px;font-size:12px;}

  /* ---- 전투 ---- */
  #topbar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  #topbar .lbl{font-size:12px;color:var(--dim);margin-right:auto;line-height:1.3;}
  #topbar .lbl b{color:var(--txt);font-size:13px;}
  #chips{display:flex;gap:5px;padding:5px 8px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);touch-action:pan-x;}
  .chip{flex:0 0 auto;min-width:74px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:11px;line-height:1.25;cursor:pointer;position:relative;}
  .chip.sel{border-color:var(--gold);background:#3b3115;}
  .chip.dead{opacity:.35;pointer-events:none;text-decoration:line-through;}
  .chip .bar{height:3px;background:#333;border-radius:2px;margin-top:2px;overflow:hidden;}
  .chip .bar i{display:block;height:100%;background:var(--green);}
  .chip .bar.st i{background:var(--blue);}
  .chip .star{color:var(--gold);}
  #stage{position:relative;flex:1;min-height:0;background:#d9d9d9;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #info{position:absolute;left:6px;top:6px;max-width:min(300px,70%);background:rgba(20,22,30,.86);border:1px solid var(--line);border-radius:9px;
    padding:6px 9px;font-size:11.5px;line-height:1.45;pointer-events:none;}
  #info .h{font-size:13px;font-weight:700;}
  #info .dim{color:var(--dim);}
  #minilog{position:absolute;left:6px;bottom:6px;max-width:75%;font-size:11px;line-height:1.35;color:#222;background:rgba(255,255,255,.78);
    border-radius:7px;padding:4px 7px;pointer-events:none;}
  #minilog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #zoomBtns{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;}
  #hint{font-size:11.5px;color:var(--dim);padding:0 4px 1px;pointer-events:none;line-height:1.35;}
  #bars{background:var(--panel);border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;}
  #bars .r{display:flex;gap:5px;flex-wrap:wrap;}
  #bars .btn{flex:1 1 auto;min-width:54px;}
  #logDrawer{position:absolute;inset:0;background:rgba(10,12,18,.96);z-index:20;display:flex;flex-direction:column;padding:inherit;}
  #logDrawer .hd{display:flex;gap:6px;padding:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  #logDrawer .hd b{margin-right:auto;}
  #logText{flex:1;overflow-y:auto;padding:8px 10px;font-size:12px;line-height:1.5;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:pan-y;-webkit-user-select:text;user-select:text;}

  /* ---- 모달 ---- */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;}
  #modalBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;touch-action:pan-y;}
  #modalBox h2{margin:0 0 6px;font-size:19px;}
  #modalBox .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:14px;cursor:pointer;}
  #modalBox .opt:active{filter:brightness(1.25);}
  #modalBox p{margin:6px 0;font-size:13px;line-height:1.55;}
  .win{color:var(--green);} .lose{color:var(--red);} .draw{color:var(--gold);}
  .help{font-size:12.5px;line-height:1.65;color:var(--txt);}
  .help b{color:var(--gold);}
</style>
</head>
<body>
<div id="app">

  <!-- 막사(홈) -->
  <div id="scrHome" class="screen">
    <div class="wrap">
      <h1>굴 전투판 <span style="font-size:13px;color:var(--dim)">v1</span></h1>
      <div class="sub" id="homeSub"></div>
      <div class="row">
        <button class="btn go" id="btnStart">전투 시작</button>
        <button class="btn" id="btnHelp">조작법</button>
        <button class="btn" id="btnLogs">전투 로그</button>
        <button class="btn danger" id="btnNewRun">새 런</button>
      </div>
      <div class="sec">보유 유닛</div>
      <div class="cards" id="rosterCards"></div>
      <div id="logsBox" class="hidden">
        <div class="sec">저장된 전투 로그 (브라우저 자동 저장 · 최근 25판)</div>
        <div id="logsList"></div>
        <div class="row" style="margin-top:6px">
          <button class="btn sm" id="btnExportAll">전체 로그 JSON 내보내기</button>
          <button class="btn sm" id="btnExportRun">런 상태 JSON 내보내기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 전투 -->
  <div id="scrBattle" class="screen hidden">
    <div id="topbar">
      <button class="btn sm" id="btnBack">← 막사</button>
      <div class="lbl" id="lblTop"></div>
      <button class="btn sm" id="btnAI" title="AI 지휘관에게 아군 지휘를 맡깁니다">AI 맡김</button>
      <button class="btn sm" id="btnSpeed">1x</button>
      <button class="btn sm go" id="btnPlay">▶ 전투 개시</button>
      <button class="btn sm" id="btnLog">로그</button>
    </div>
    <div id="chips"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="info"></div>
      <div id="zoomBtns">
        <button class="btn sm" id="zIn">＋</button>
        <button class="btn sm" id="zOut">－</button>
        <button class="btn sm" id="zFit">맞춤</button>
      </div>
      <div id="minilog"></div>
    </div>
    <div id="bars">
      <div id="hint"></div>
      <div class="r" id="bar1">
        <button class="btn" id="mNormal">이동·공격</button>
        <button class="btn warn" id="mCharge">돌격</button>
        <button class="btn" id="mRetreat">이탈</button>
        <button class="btn" id="bHold">정지 사수</button>
        <button class="btn" id="bDefend">방어 태세</button>
        <button class="btn" id="bCancel">명령 취소</button>
        <button class="btn" id="bRoute">경유 +</button>
      </div>
      <div class="r" id="bar2">
        <button class="btn" id="bMulti">다중 선택</button>
        <button class="btn" id="bAll">전체</button>
        <button class="btn" id="bSqSel">분대 선택</button>
        <button class="btn gold" id="bSquad">분대 편성</button>
        <button class="btn" id="bUnsquad">분대 해제</button>
        <button class="btn gold" id="bLeader">분대장 임명</button>
        <button class="btn gold" id="bMain">지휘관 임명</button>
      </div>
    </div>
    <div id="logDrawer" class="hidden">
      <div class="hd"><b>이번 전투 로그</b>
        <button class="btn sm" id="lgJson">JSON 저장</button>
        <button class="btn sm" id="lgTxt">TXT 저장</button>
        <button class="btn sm" id="lgClose">닫기</button></div>
      <div id="logText"></div>
    </div>
  </div>
</div>
<div id="modal" class="hidden"><div id="modalBox"></div></div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/log.js"></script>
<script src="js/command.js"></script>
<script src="js/sim.js"></script>
<script src="js/ai.js"></script>
<script src="js/run.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
